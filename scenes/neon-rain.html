<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Rain</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
// ============================================================================
// livewall runtime — copy this block unchanged into every scene.
//
// Scene contract:
//   * Self-contained single file. No network requests, no external assets.
//   * Draw in a virtual 1920x1080 space; the runtime scales it to "cover".
//   * Put ALL timing in update(dt) / sim-time timers (after/every). Never use
//     setTimeout/setInterval for animation — those keep running while paused
//     and break ?still rendering.
//   * Use rand() (seeded) instead of Math.random().
//
// URL params:  ?fps=30      frame cap (host passes 30; default 60)
//              ?seed=123    deterministic randomness
//              ?still=1&t=8 simulate 8s of scene time, draw one frame, stop
//                           (used to generate theme background stills)
// Host API:    window.livewall.pause() / resume() / paused
// ============================================================================
const LW = (() => {
  const params = new URLSearchParams(location.search);
  const VW = 1920, VH = 1080;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let seed = (Number(params.get('seed')) || (Date.now() % 2147483647)) >>> 0;
  function rand() { // mulberry32
    seed = (seed + 0x6D2B79F5) >>> 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const range = (a, b) => a + rand() * (b - a);
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];

  // sim-time scheduler
  let simTime = 0;
  const timers = [];
  function after(sec, fn) { timers.push({ at: simTime + sec, fn }); }
  function every(minSec, maxSec, fn) {
    const go = () => { fn(); after(range(minSec, maxSec), go); };
    after(range(minSec, maxSec), go);
  }
  function runTimers() {
    for (let i = timers.length - 1; i >= 0; i--) {
      if (timers[i].at <= simTime) { const t = timers.splice(i, 1)[0]; t.fn(); }
    }
  }

  const view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
  function resize() {
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);
    view.w = Math.round(innerWidth * view.dpr);
    view.h = Math.round(innerHeight * view.dpr);
    canvas.width = view.w; canvas.height = view.h;
    view.scale = Math.max(view.w / VW, view.h / VH);
    view.ox = (view.w - VW * view.scale) / 2;
    view.oy = (view.h - VH * view.scale) / 2;
    if (scene.resize) scene.resize(view);
    drawFrame();
  }

  let scene = null, paused = false, last = 0, raf = 0;
  const fps = Math.max(1, Number(params.get('fps')) || 60);
  const still = params.has('still');

  function step(dt) { simTime += dt; runTimers(); scene.update(dt, simTime); }
  function drawFrame() {
    if (!scene) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, view.w, view.h);
    ctx.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
    scene.draw(ctx, simTime);
  }
  function loop(now) {
    raf = 0;
    if (paused) return;
    raf = requestAnimationFrame(loop);
    if (!last) { last = now; return; }
    const elapsed = now - last;
    if (elapsed < 1000 / fps - 2) return;
    last = now;
    step(Math.min(elapsed / 1000, 0.1));
    drawFrame();
  }
  function pause() { paused = true; if (raf) cancelAnimationFrame(raf); raf = 0; }
  function resume() { if (still) return; paused = false; last = 0; if (!raf) raf = requestAnimationFrame(loop); }

  function start(s) {
    scene = s;
    if (scene.init) scene.init(view);
    addEventListener('resize', resize);
    resize();
    if (still) {
      const T = Number(params.get('t')) || 8;
      while (simTime < T) step(1 / 30);
      drawFrame();
      document.title += ' [still]';
      return;
    }
    document.addEventListener('visibilitychange', () => document.hidden ? pause() : resume());
    resume();
  }

  window.livewall = { pause, resume, get paused() { return paused; } };
  return { VW, VH, ctx, rand, range, pick, after, every, start, view,
           get time() { return simTime; } };
})();
// ============================== end runtime =================================

// ---- scene: Neon Rain ------------------------------------------------------
// Rain-soaked cyberpunk metropolis at night: 3D-extruded brutalist arcologies
// and high-rises across three depth ranks, skybridges, ribbon & curtain-wall
// window bands, calligraphic neon signage, rooftop holograms, sweeping
// searchlights, flying spinners, and shimmering wet-quay reflections.
const { VW, VH, rand, range, pick, after, every } = LW;
const TAU = Math.PI * 2;
const H0 = 876;                       // waterfront quay / street level
const WATER = VH - H0;

const C = {
  nearTop: '#030710', nearBot: '#091832', nearSide: '#061124', unlitNear: '#081326',
  midTop: '#07142d', midBot: '#112c5c', midSide: '#0b1f44',
  farTop: '#0d224a', farBot: '#1b427a',
};
const NEON = ['#29e6ff', '#3d8bff', '#5ab8ff', '#29e6ff', '#c56bff', '#ff4a6a'];
const ACCENT = '#ff3fb4';

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function mrng(s) {
  s >>>= 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let rs = 0;
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * rs));
  c.height = Math.max(1, Math.ceil(h * rs));
  const x = c.getContext('2d');
  x.setTransform(rs, 0, 0, rs, 0, 0);
  return [c, x];
}

// ---------------------------------------------------------------------------
// Curated calligraphic Neo-Tokyo glyph library (in [0..1]x[0..1] cell space)
// ---------------------------------------------------------------------------
const GLYPHS = [
  // 0: 'Den' / Electric gate style
  [[0.1,0.15,0.9,0.15],[0.5,0.15,0.5,0.92],[0.18,0.38,0.82,0.38],[0.18,0.38,0.18,0.68],[0.82,0.38,0.82,0.68],[0.18,0.65,0.82,0.65],[0.5,0.92,0.88,0.84]],
  // 1: 'Hikari' / Light / Ray style
  [[0.5,0.08,0.5,0.48],[0.18,0.20,0.34,0.40],[0.82,0.20,0.66,0.40],[0.10,0.48,0.90,0.48],[0.38,0.48,0.16,0.90],[0.62,0.48,0.62,0.86],[0.62,0.86,0.88,0.86]],
  // 2: 'Mirai' / Future / Tree branch style
  [[0.20,0.25,0.80,0.25],[0.10,0.50,0.90,0.50],[0.50,0.08,0.50,0.94],[0.50,0.50,0.14,0.86],[0.50,0.50,0.86,0.86]],
  // 3: 'Yoru' / Night / Roofed character
  [[0.50,0.06,0.50,0.20],[0.12,0.20,0.88,0.20],[0.32,0.20,0.14,0.58],[0.24,0.44,0.24,0.92],[0.48,0.36,0.82,0.36],[0.82,0.36,0.52,0.88],[0.46,0.54,0.88,0.90]],
  // 4: 'Shin' / Cyber / Torii gate style
  [[0.12,0.22,0.88,0.18],[0.08,0.44,0.92,0.44],[0.30,0.20,0.30,0.92],[0.70,0.19,0.70,0.92],[0.30,0.68,0.70,0.68]],
  // 5: 'Zero' / Boxed katakana Ro + slash
  [[0.18,0.16,0.82,0.16],[0.82,0.16,0.82,0.84],[0.18,0.84,0.82,0.84],[0.18,0.16,0.18,0.84],[0.14,0.50,0.86,0.50],[0.50,0.16,0.50,0.50]],
  // 6: 'Kaze' / Wind / Winged enclosure
  [[0.16,0.14,0.84,0.14],[0.16,0.14,0.12,0.90],[0.84,0.14,0.88,0.88],[0.32,0.34,0.68,0.34],[0.50,0.34,0.50,0.76],[0.28,0.78,0.74,0.72]],
  // 7: 'Tora' / Stylized angular katakana
  [[0.18,0.18,0.78,0.18],[0.36,0.42,0.84,0.42],[0.84,0.42,0.32,0.90],[0.24,0.18,0.24,0.62]],
  // 8: 'Ryuu' / Dragon crown mark
  [[0.50,0.08,0.50,0.24],[0.16,0.24,0.84,0.24],[0.26,0.24,0.34,0.46],[0.74,0.24,0.66,0.46],[0.12,0.46,0.88,0.46],[0.24,0.62,0.76,0.62],[0.50,0.46,0.50,0.88],[0.50,0.88,0.86,0.88]],
  // 9: 'Neo' / Katakana Ne + O
  [[0.50,0.10,0.50,0.26],[0.18,0.26,0.78,0.26],[0.78,0.26,0.22,0.78],[0.52,0.52,0.52,0.92],[0.58,0.56,0.86,0.78]],
];

function addGlyph(ox, oy, g, lines, idx) {
  const strokes = GLYPHS[idx % GLYPHS.length];
  for (const [x0, y0, x1, y1] of strokes) {
    lines.push([ox + x0 * g, oy + y0 * g, ox + x1 * g, oy + y1 * g]);
  }
}

function genSign(type, scale) {
  const g = 26 * scale;
  const sh = { type, lines: [], arcs: [], parts: null, w: 0, h: 0 };
  const startGlyph = Math.floor(rand() * GLYPHS.length);

  if (type === 'vbanner') {
    const n = 3 + Math.floor(rand() * 3), cw = g + 16 * scale;
    for (let i = 0; i < n; i++) {
      addGlyph(8 * scale, 12 * scale + i * (g + 12 * scale), g, sh.lines, startGlyph + i * 3);
    }
    sh.w = cw;
    sh.h = n * (g + 12 * scale) + 12 * scale;
    sh.frame = true;
    // Top & bottom decorative bracket bars inside frame
    sh.lines.push([6 * scale, 6 * scale, sh.w - 6 * scale, 6 * scale]);
    sh.lines.push([6 * scale, sh.h - 6 * scale, sh.w - 6 * scale, sh.h - 6 * scale]);
  } else if (type === 'hsign') {
    const n = 3 + Math.floor(rand() * 2);
    for (let i = 0; i < n; i++) {
      addGlyph(12 * scale + i * (g + 12 * scale), 8 * scale, g, sh.lines, startGlyph + i * 2);
    }
    sh.w = n * (g + 12 * scale) + 12 * scale;
    sh.h = g + 26 * scale;
    sh.frame = true;
    sh.lines.push([10 * scale, sh.h - 7 * scale, sh.w - 10 * scale, sh.h - 7 * scale]);
  } else if (type === 'ring') {
    const r = 30 * scale;
    sh.w = sh.h = r * 2 + 16 * scale;
    const cx = sh.w / 2, cy = sh.h / 2;
    sh.arcs.push([cx, cy, r]);
    sh.arcs.push([cx, cy, r * 0.72]);
    // Stylized cyber-emblem inside ring
    addGlyph(cx - r * 0.45, cy - r * 0.45, r * 0.9, sh.lines, startGlyph);
  } else if (type === 'chevron' || type === 'bars') {
    const n = type === 'chevron' ? 4 : 5;
    sh.parts = [];
    if (type === 'chevron') {
      sh.w = n * 20 * scale + 24 * scale;
      sh.h = 46 * scale;
      for (let i = 0; i < n; i++) {
        const x0 = 12 * scale + i * 20 * scale;
        sh.parts.push({
          lines: [
            [x0, 8 * scale, x0 + 14 * scale, sh.h / 2],
            [x0 + 14 * scale, sh.h / 2, x0, sh.h - 8 * scale],
          ],
          arcs: [],
        });
      }
    } else {
      sh.w = 72 * scale;
      sh.h = n * 14 * scale + 12 * scale;
      for (let i = 0; i < n; i++) {
        const y = sh.h - 10 * scale - i * 14 * scale, half = (12 + i * 5) * scale;
        sh.parts.push({ lines: [[sh.w / 2 - half, y, sh.w / 2 + half, y]], arcs: [] });
      }
    }
  }
  return sh;
}

// ---------------------------------------------------------------------------
// Layout data & procedural cyberpunk architecture
// ---------------------------------------------------------------------------
const L = {
  far: [], mid: [], near: [], bridges: [], wins: [], signs: [],
  beacons: [], lamps: [], holos: [], board: null,
};
const R = {};
const S = {
  drops: [], ripples: [], vehicles: [], trains: [], fogs: [], lights: [],
  flash: 0, bolt: null, boardSlide: 0, boardNext: 1, boardMix: 0, boardGlitch: 0,
};

function winCol() {
  const r = rand();
  const c =
    r < 0.46 ? '#9fd8ff' :
    r < 0.72 ? '#42e6ff' :
    r < 0.86 ? '#5e92ff' :
    r < 0.93 ? '#ffbe6b' : // warm amber apartment/office lights
               '#ff6bd6';
  return hexA(c, range(0.55, 0.94).toFixed(2));
}

function genSkylines() {
  // 1. Far skyline: dense megacity backdrop with tapered arcologies & twin spires
  let x = -80;
  while (x < VW + 80) {
    const w = range(42, 118);
    const h = Math.min(range(160, 440) * range(0.75, 1.25), 530);
    const kind = pick(['tower', 'tower', 'spire', 'arcology', 'chamfer']);
    L.far.push({ x, w, h, kind, seed: rand() * 1e9 });
    x += w * range(0.48, 0.92);
  }

  // 2. Mid skyline: 3D-extruded high-rises with stepped crowns & baked neon signs
  x = -90;
  while (x < VW + 90) {
    const w = range(84, 175);
    const cx = x + w / 2;
    const dip = 1 - 0.22 * Math.exp(-(((cx - 960) / 420) ** 2));
    const h = range(240, 590) * dip;
    const style = pick(['ribbon', 'curtain', 'mixed', 'grid']);
    const crown = pick(['step', 'slant', 'twinSpire', 'bevel', 'arcology']);
    const sideW = (cx < 960 ? 1 : -1) * range(14, 26);
    L.mid.push({
      x, w, h, sideW, style, crown, seed: rand() * 1e9,
      sign: rand() < 0.32 ? { sh: genSign(pick(['vbanner', 'hsign', 'ring']), 0.58), col: pick(NEON) } : null,
    });
    x += w * range(0.62, 0.98);
  }

  // 3. Near skyline: monumental 3D cyberpunk towers with varied window architecture
  x = -60;
  while (x < VW + 60) {
    const w = range(118, 225);
    const cx = x + w / 2;
    const dip = 1 - 0.36 * Math.exp(-(((cx - 960) / 340) ** 2));
    const h = (rand() < 0.34 ? range(560, 750) : range(280, 570)) * dip;
    const rim = cx < 960 ? 1 : -1;
    const sideW = rim * range(18, 32);
    const winStyle = pick(['ribbon', 'curtain', 'mixed', 'tiered']);
    const roof = pick(['setback', 'slant', 'antenna', 'chamfer', 'cyber']);
    const b = {
      x, w, h, rim, sideW, winStyle, roof,
      seed: rand() * 1e9,
      w0: L.wins.length,
      strip: rand() < 0.42,
      sb: range(0.14, 0.26) * w,
      sbH: range(32, 78),
      ant: range(55, 130),
    };

    // Architectural window bands on the main facade (avoiding uniform polka-dots)
    const margin = 12;
    const innerW = w - margin * 2;
    let y = H0 - h + 22;
    while (y < H0 - 44) {
      // Occasional dark mechanical louver floor
      if (rand() < 0.14) {
        y += range(14, 24);
        continue;
      }
      const mode = winStyle === 'mixed' ? pick(['ribbon', 'panel', 'curtain']) : winStyle;
      if (mode === 'ribbon') {
        const segs = 2 + Math.floor(rand() * 4);
        const gap = 6;
        const sw = (innerW - gap * (segs - 1)) / segs;
        const ph = range(4.5, 6.5);
        const rowLit = rand() < 0.55;
        const c0 = winCol();
        for (let s = 0; s < segs; s++) {
          L.wins.push({
            x: x + margin + s * (sw + gap), y,
            w: sw, h: ph,
            lit: rowLit ? rand() < 0.78 : rand() < 0.18,
            col: rand() < 0.7 ? c0 : winCol(),
          });
        }
        y += ph + range(7, 11);
      } else if (mode === 'curtain') {
        const cols = Math.max(4, Math.floor(innerW / 15));
        const gx = 5, pw = (innerW - gx * (cols - 1)) / cols;
        const ph = range(11, 16);
        const base = range(0.18, 0.48);
        for (let c = 0; c < cols; c++) {
          L.wins.push({
            x: x + margin + c * (pw + gx), y,
            w: pw, h: ph,
            lit: rand() < base,
            col: winCol(),
          });
        }
        y += ph + range(4, 7);
      } else {
        // Tiered / panel office blocks
        const cols = Math.max(5, Math.floor(innerW / 13));
        const gx = 5, pw = (innerW - gx * (cols - 1)) / cols;
        const ph = range(6, 9);
        const rowF = rand() < 0.28 ? 1.8 : rand() < 0.25 ? 0.2 : 0.9;
        const base = range(0.16, 0.38);
        for (let c = 0; c < cols; c++) {
          L.wins.push({
            x: x + margin + c * (pw + gx), y,
            w: pw, h: ph,
            lit: rand() < base * rowF,
            col: winCol(),
          });
        }
        y += ph + range(6, 9);
      }
    }
    b.w1 = L.wins.length;
    L.near.push(b);
    x += w + (rand() < 0.45 ? range(26, 72) : range(6, 18));
  }

  // Skybridges connecting adjacent near buildings
  for (let i = 0; i < L.near.length - 1; i++) {
    const a = L.near[i], b = L.near[i + 1];
    const gap = b.x - (a.x + a.w);
    const minH = Math.min(a.h, b.h);
    if (gap > 12 && gap < 85 && minH > 320 && rand() < 0.65) {
      const by = H0 - range(210, minH - 70);
      L.bridges.push({ x0: a.x + a.w - 4, x1: b.x + 4, y: by, h: range(14, 20) });
    }
  }

  // Rooftop aviation beacons & hologram projectors
  for (const b of L.near) {
    if (b.h > 400 && b.x > 100 && b.x + b.w < VW - 100) {
      const top = H0 - b.h - (b.roof === 'setback' || b.roof === 'cyber' ? b.sbH : 0) - (b.roof === 'antenna' ? b.ant : 0);
      L.beacons.push({
        x: b.x + b.w / 2, y: top - 2,
        ph: rand() * 6, sp: range(0.6, 1.1),
        col: rand() < 0.6 ? ACCENT : '#ff4a6a',
      });
    }
  }

  // Rooftop volumetric hologram on a central-ish medium near building
  const holoCands = L.near.filter((b) => b.h > 260 && b.h < 560 && b.x > 260 && b.x + b.w < VW - 260);
  if (holoCands.length) {
    const hb = holoCands[Math.floor(holoCands.length / 2)];
    const hy = H0 - hb.h - (hb.roof === 'setback' || hb.roof === 'cyber' ? hb.sbH : 0);
    L.holos.push({ x: hb.x + hb.w / 2, y: hy, r: 44, col: '#29e6ff' });
  }

  // Neon signs on near buildings (including projecting side-mounted vertical banners)
  const boxes = [];
  const types = ['vbanner', 'vbanner', 'hsign', 'ring', 'chevron', 'vbanner', 'hsign', 'bars', 'vbanner', 'ring', 'vbanner', 'hsign'];
  let tries = 0;
  while (L.signs.length < 12 && tries++ < 360) {
    const b = pick(L.near);
    if (b.h < 250 || b.x < 80 || b.x + b.w > VW - 80) continue;
    const type = types[L.signs.length % types.length];
    const sh = genSign(type, type === 'vbanner' ? range(0.88, 1.12) : range(0.82, 1.06));
    let sx, projecting = false;
    if (type === 'vbanner' && rand() < 0.65) {
      projecting = true;
      sx = rand() < 0.5 ? b.x - sh.w * 0.55 : b.x + b.w - sh.w * 0.45;
    } else {
      sx = b.x + range(8, Math.max(9, b.w - sh.w - 8));
    }
    if (sh.w > b.w - 10 && !projecting) continue;
    const sy = range(H0 - b.h + 36, H0 - sh.h - 68);
    if (sy < 140 || sx < 100 || sx + sh.w > VW - 100) continue;
    const box = [sx - 14, sy - 14, sx + sh.w + 14, sy + sh.h + 14];
    if (boxes.some((o) => !(box[2] < o[0] || box[0] > o[2] || box[3] < o[1] || box[1] > o[3]))) continue;
    boxes.push(box);
    const col =
      L.signs.length % 4 === 2 ? ACCENT :
      L.signs.length % 5 === 3 ? '#c56bff' :
      pick(['#29e6ff', '#3d8bff', '#29e6ff', '#5ab8ff']);
    L.signs.push({
      sh, x: sx, y: sy, col, projecting,
      side: sx < b.x + b.w / 2 ? 1 : -1,
      level: 1, on: true, flick: 0, ft: 0, dead: 0, ph: rand() * 6, buzz: false,
    });
  }
  if (L.signs.length) L.signs[Math.floor(rand() * L.signs.length)].buzz = true;

  // Large high-tech LED billboard on a wide near tower
  for (const b of L.near.slice().sort(() => rand() - 0.5)) {
    if (b.w < 165 || b.h < 420 || b.x < 180 || b.x + b.w > VW - 180) continue;
    const bw = 116, bh = 186, bx = b.x + (b.w - bw) / 2, by = H0 - b.h + 48;
    const box = [bx - 20, by - 20, bx + bw + 20, by + bh + 20];
    if (boxes.some((o) => !(box[2] < o[0] || box[0] > o[2] || box[3] < o[1] || box[1] > o[3]))) continue;
    L.board = { x: bx, y: by, w: bw, h: bh };
    break;
  }

  for (let lx = 55; lx < VW; lx += range(105, 145)) L.lamps.push(lx);
}

// ---------------------------------------------------------------------------
// Pre-rendering layers
// ---------------------------------------------------------------------------
function strokeShapes(x, shapes, color, glow) {
  const p = new Path2D();
  for (const l of shapes.lines) { p.moveTo(l[0], l[1]); p.lineTo(l[2], l[3]); }
  for (const a of shapes.arcs) { p.moveTo(a[0] + a[2], a[1]); p.arc(a[0], a[1], a[2], 0, TAU); }
  x.lineCap = 'round';
  x.lineJoin = 'round';
  if (!glow) {
    x.strokeStyle = color;
    x.lineWidth = 3.2;
    x.stroke(p);
    return;
  }
  x.strokeStyle = color;
  x.shadowColor = color;
  x.lineWidth = 4.4; x.shadowBlur = 26 * rs; x.stroke(p);
  x.lineWidth = 3.0; x.shadowBlur = 9 * rs; x.stroke(p);
  x.shadowBlur = 0;
  x.strokeStyle = 'rgba(235,252,255,0.95)';
  x.lineWidth = 1.4;
  x.stroke(p);
}

const PAD = 60;
function renderSign(sg) {
  const sh = sg.sh, w = sh.w + PAD * 2, h = sh.h + PAD * 2;
  const draw = (shapes, wall) => {
    const [c, x] = mk(w, h);
    if (wall) {
      const r = Math.max(sh.w, sh.h) * 0.78 + 32;
      x.save();
      x.translate(w / 2, h / 2);
      x.scale(sh.w >= sh.h ? 1 : 0.62, sh.h > sh.w ? 1 : 0.62);
      const g = x.createRadialGradient(0, 0, 0, 0, 0, r);
      g.addColorStop(0, hexA(sg.col, 0.28));
      g.addColorStop(1, hexA(sg.col, 0));
      x.fillStyle = g;
      x.fillRect(-r, -r, r * 2, r * 2);
      x.restore();
    }
    x.translate(PAD, PAD);
    if (sh.frame && wall) {
      x.strokeStyle = hexA(sg.col, 0.85);
      x.shadowColor = sg.col;
      x.shadowBlur = 14 * rs;
      x.lineWidth = 1.8;
      x.strokeRect(1, 1, sh.w - 2, sh.h - 2);
      x.shadowBlur = 0;
    }
    strokeShapes(x, shapes, sg.col, true);
    return c;
  };
  sg.cv = draw(sh, true);
  sg.partCv = sh.parts ? sh.parts.map((pt) => draw(pt, false)) : null;
}

function signDimTubes(x, sg, ox, oy) {
  const sh = sg.sh;
  x.save();
  x.translate(sg.x - ox, sg.y - oy);
  // Mounting struts for projecting vertical banners
  if (sg.projecting) {
    x.strokeStyle = '#182b49';
    x.lineWidth = 2.5;
    const bx = sg.side > 0 ? sh.w : 0;
    const tx = sg.side > 0 ? sh.w + 12 : -12;
    for (const fy of [0.18, 0.5, 0.82]) {
      x.beginPath();
      x.moveTo(bx, sh.h * fy);
      x.lineTo(tx, sh.h * fy);
      x.stroke();
    }
  }
  x.fillStyle = 'rgba(3,7,16,0.92)';
  if (sh.frame || sh.type === 'hsign') x.fillRect(-4, -4, sh.w + 8, sh.h + 8);
  if (sh.frame) {
    x.strokeStyle = '#162947';
    x.lineWidth = 1.6;
    x.strokeRect(1, 1, sh.w - 2, sh.h - 2);
  }
  const dim = hexA(sg.col, 0.18);
  strokeShapes(x, sh, dim, false);
  if (sh.parts) for (const pt of sh.parts) strokeShapes(x, pt, dim, false);
  x.restore();
}

function renderSky() {
  const [c, x] = mk(VW, H0);
  const g = x.createLinearGradient(0, 0, 0, H0);
  g.addColorStop(0.00, '#010308');
  g.addColorStop(0.32, '#040c1f');
  g.addColorStop(0.68, '#0b214a');
  g.addColorStop(0.88, '#143972');
  g.addColorStop(1.00, '#1e5499');
  x.fillStyle = g;
  x.fillRect(0, 0, VW, H0);

  const glow = (cx, cy, rx, ry, col, a) => {
    x.save();
    x.translate(cx, cy);
    x.scale(rx / ry, 1);
    const rg = x.createRadialGradient(0, 0, 0, 0, 0, ry);
    rg.addColorStop(0, hexA(col, a));
    rg.addColorStop(1, hexA(col, 0));
    x.fillStyle = rg;
    x.fillRect(-ry, -ry, ry * 2, ry * 2);
    x.restore();
  };
  glow(960, H0 - 20, 940, 380, '#2a8cff', 0.30);
  glow(1380, H0 - 50, 520, 280, '#29e6ff', 0.15);
  glow(460, H0 - 30, 460, 260, '#9a52ff', 0.13);
  R.sky = c;
}

function renderClouds() {
  const r = mrng(9001), H = 600;
  const [c, x] = mk(VW, H);
  const blob = (cx, cy, rx, ry, col, a) => {
    for (const dx of [-VW, 0, VW]) {
      if (cx + dx + rx < 0 || cx + dx - rx > VW) continue;
      x.save();
      x.translate(cx + dx, cy);
      x.scale(rx / ry, 1);
      const g = x.createRadialGradient(0, 0, 0, 0, 0, ry);
      g.addColorStop(0, hexA(col, a));
      g.addColorStop(1, hexA(col, 0));
      x.fillStyle = g;
      x.fillRect(-ry, -ry, ry * 2, ry * 2);
      x.restore();
    }
  };
  for (let i = 0; i < 90; i++) {
    const cy = 30 + r() * (H - 80), depth = cy / H;
    blob(r() * VW, cy, 160 + r() * 340, 30 + r() * 60, depth > 0.5 ? '#2a5fa8' : '#14294f', 0.12 + r() * 0.2 * (0.4 + depth));
  }
  for (let i = 0; i < 30; i++) blob(r() * VW, 360 + r() * 220, 200 + r() * 300, 20 + r() * 30, '#3a86d8', 0.06 + r() * 0.08);
  for (let i = 0; i < 12; i++) blob(r() * VW, 420 + r() * 160, 150 + r() * 200, 15 + r() * 20, '#8a5cff', 0.04 + r() * 0.04);
  R.clouds = c;
  R.cloudH = H;
}

function bldGrad(x, top, bot, y0) {
  const g = x.createLinearGradient(0, y0, 0, H0);
  g.addColorStop(0, top);
  g.addColorStop(1, bot);
  return g;
}

function renderFar() {
  const top = 260, [c, x] = mk(VW, H0 - top);
  x.translate(0, -top);
  for (const b of L.far) {
    const y0 = H0 - b.h;
    x.fillStyle = bldGrad(x, C.farTop, C.farBot, 360);
    if (b.kind === 'arcology') {
      x.beginPath();
      x.moveTo(b.x - 14, H0);
      x.lineTo(b.x + b.w * 0.15, y0);
      x.lineTo(b.x + b.w * 0.85, y0);
      x.lineTo(b.x + b.w + 14, H0);
      x.closePath();
      x.fill();
    } else if (b.kind === 'chamfer') {
      x.beginPath();
      x.moveTo(b.x, H0);
      x.lineTo(b.x, y0 + 18);
      x.lineTo(b.x + 18, y0);
      x.lineTo(b.x + b.w - 18, y0);
      x.lineTo(b.x + b.w, y0 + 18);
      x.lineTo(b.x + b.w, H0);
      x.closePath();
      x.fill();
    } else {
      x.fillRect(b.x, y0, b.w, b.h);
      if (b.kind === 'spire') {
        x.fillRect(b.x + b.w * 0.2, y0 - 16, b.w * 0.6, 16);
        x.fillRect(b.x + b.w / 2 - 1, y0 - 58, 2, 58);
      }
    }
    // Horizontal sky-glow window ribbons on far towers
    const r = mrng(b.seed);
    for (let y = y0 + 10; y < H0 - 12; y += 8) {
      if (r() < 0.28) {
        x.fillStyle = `rgba(115,190,255,${0.14 + r() * 0.24})`;
        const rx = b.x + 6 + r() * 8;
        const rw = Math.max(4, (b.w - 16) * (0.3 + r() * 0.6));
        x.fillRect(rx, y, rw, 2);
      }
    }
  }
  R.far = c;
  R.farTop = top;
}

function renderMid() {
  const top = 150, [c, x] = mk(VW, H0 - top);
  x.translate(0, -top);
  for (const b of L.mid) {
    const y0 = H0 - b.h;
    // 3D side wall extrusion
    const sx = b.sideW > 0 ? b.x + b.w : b.x + b.sideW;
    const sw = Math.abs(b.sideW);
    x.fillStyle = C.midSide;
    x.beginPath();
    if (b.sideW > 0) {
      x.moveTo(b.x + b.w, y0);
      x.lineTo(b.x + b.w + sw, y0 + 10);
      x.lineTo(b.x + b.w + sw, H0);
      x.lineTo(b.x + b.w, H0);
    } else {
      x.moveTo(b.x, y0);
      x.lineTo(b.x - sw, y0 + 10);
      x.lineTo(b.x - sw, H0);
      x.lineTo(b.x, H0);
    }
    x.closePath();
    x.fill();

    // Main front facade
    x.fillStyle = bldGrad(x, C.midTop, C.midBot, H0 - 580);
    if (b.crown === 'arcology') {
      x.beginPath();
      x.moveTo(b.x - 16, H0);
      x.lineTo(b.x + 8, y0);
      x.lineTo(b.x + b.w - 8, y0);
      x.lineTo(b.x + b.w + 16, H0);
      x.closePath();
      x.fill();
    } else {
      x.fillRect(b.x, y0, b.w, b.h);
    }

    // Architectural crown details
    if (b.crown === 'step') {
      x.fillRect(b.x + b.w * 0.16, y0 - 34, b.w * 0.68, 35);
      x.fillRect(b.x + b.w * 0.32, y0 - 58, b.w * 0.36, 25);
    } else if (b.crown === 'slant') {
      x.beginPath();
      x.moveTo(b.x, y0 + 1);
      x.lineTo(b.x + b.w, y0 - 42);
      x.lineTo(b.x + b.w, y0 + 1);
      x.closePath();
      x.fill();
    } else if (b.crown === 'twinSpire') {
      x.fillRect(b.x + b.w * 0.15, y0 - 24, b.w * 0.7, 25);
      x.fillRect(b.x + b.w * 0.28, y0 - 74, 2.2, 50);
      x.fillRect(b.x + b.w * 0.72, y0 - 62, 2.2, 38);
    } else if (b.crown === 'bevel') {
      x.beginPath();
      x.moveTo(b.x + 12, y0 - 26);
      x.lineTo(b.x + b.w - 12, y0 - 26);
      x.lineTo(b.x + b.w, y0 + 1);
      x.lineTo(b.x, y0 + 1);
      x.closePath();
      x.fill();
    }

    // Rim highlight on roof & side edge
    x.fillStyle = 'rgba(105,195,255,0.26)';
    x.fillRect(b.x, y0, b.w, 1.2);
    x.fillStyle = 'rgba(80,165,255,0.18)';
    x.fillRect(b.sideW > 0 ? b.x + b.w - 1.5 : b.x, y0, 1.5, b.h);

    // Mid-rank architectural window patterns
    const r = mrng(b.seed);
    for (let y = y0 + 12; y < H0 - 22; y += 10) {
      if (r() < 0.18) continue;
      if (b.style === 'ribbon' || (b.style === 'mixed' && r() < 0.5)) {
        if (r() < 0.45) {
          x.fillStyle = r() < 0.82
            ? `rgba(115,205,255,${0.25 + r() * 0.35})`
            : `rgba(255,185,110,${0.25 + r() * 0.3})`;
          const segs = 2 + Math.floor(r() * 3);
          const sw2 = (b.w - 20) / segs;
          for (let s = 0; s < segs; s++) {
            if (r() < 0.75) x.fillRect(b.x + 8 + s * sw2, y, sw2 - 5, 3.2);
          }
        }
      } else {
        const base = 0.10 + r() * 0.25;
        for (let xx = b.x + 8; xx < b.x + b.w - 10; xx += 9) {
          if (r() < base) {
            x.fillStyle = `rgba(${r() < 0.8 ? '120,205,255' : '190,145,255'},${0.25 + r() * 0.38})`;
            x.fillRect(xx, y, 5, 5.5);
          }
        }
      }
    }
    if (b.sign) {
      const sg = { sh: b.sign.sh, col: b.sign.col };
      renderSign(sg);
      const sx2 = b.x + (b.w - sg.sh.w) / 2;
      const sy2 = y0 + 30 + r() * Math.max(1, b.h - sg.sh.h - 120);
      x.globalAlpha = 0.72;
      x.drawImage(sg.cv, sx2 - PAD, sy2 - PAD, sg.sh.w + PAD * 2, sg.sh.h + PAD * 2);
      x.globalAlpha = 1;
    }
  }
  R.mid = c;
  R.midTop = top;
}

function renderNear() {
  const top = 30, [c, x] = mk(VW, H0 + 8 - top);
  x.translate(0, -top);
  const fill = bldGrad(x, C.nearTop, C.nearBot, 140);

  // Elevated skybridges connecting near towers
  for (const br of L.bridges) {
    const bw = br.x1 - br.x0;
    x.fillStyle = '#050c1a';
    x.fillRect(br.x0, br.y, bw, br.h);
    x.fillStyle = 'rgba(95,215,255,0.55)';
    x.fillRect(br.x0, br.y + 4, bw, 3.5);
    x.fillStyle = 'rgba(120,200,255,0.28)';
    x.fillRect(br.x0, br.y, bw, 1);
    x.fillRect(br.x0, br.y + br.h - 1, bw, 1);
  }

  for (const b of L.near) {
    const y0 = H0 - b.h;
    const sw = Math.abs(b.sideW);

    // 1. Extruded 3D side facade (angled toward center street canyon)
    x.fillStyle = C.nearSide;
    x.beginPath();
    if (b.sideW > 0) {
      x.moveTo(b.x + b.w, y0);
      x.lineTo(b.x + b.w + sw, y0 + 14);
      x.lineTo(b.x + b.w + sw, H0 + 2);
      x.lineTo(b.x + b.w, H0 + 2);
    } else {
      x.moveTo(b.x, y0);
      x.lineTo(b.x - sw, y0 + 14);
      x.lineTo(b.x - sw, H0 + 2);
      x.lineTo(b.x, H0 + 2);
    }
    x.closePath();
    x.fill();

    // Subtle vertical light strips on 3D side face
    x.fillStyle = 'rgba(65,155,255,0.16)';
    const sxEdge = b.sideW > 0 ? b.x + b.w + sw * 0.45 : b.x - sw * 0.55;
    x.fillRect(sxEdge, y0 + 24, 2, b.h - 50);

    // 2. Main front facade + roof architecture
    x.fillStyle = fill;
    x.fillRect(b.x, y0, b.w, b.h + 2);

    if (b.roof === 'setback' || b.roof === 'cyber') {
      x.fillRect(b.x + b.sb, y0 - b.sbH, b.w - 2 * b.sb, b.sbH + 1);
      if (b.roof === 'cyber') {
        x.fillRect(b.x + b.sb * 1.6, y0 - b.sbH - 26, b.w - 3.2 * b.sb, 27);
        x.strokeStyle = 'rgba(41,230,255,0.55)';
        x.lineWidth = 1.6;
        x.strokeRect(b.x + b.sb + 4, y0 - b.sbH + 6, b.w - 2 * b.sb - 8, b.sbH - 12);
      }
    } else if (b.roof === 'slant') {
      x.beginPath();
      x.moveTo(b.x, y0 + 1);
      x.lineTo(b.x + b.w * (b.rim > 0 ? 0.25 : 0.75), y0 - 64);
      x.lineTo(b.x + b.w, y0 + 1);
      x.closePath();
      x.fill();
    } else if (b.roof === 'chamfer') {
      x.beginPath();
      x.moveTo(b.x, y0 + 1);
      x.lineTo(b.x + 24, y0 - 38);
      x.lineTo(b.x + b.w - 24, y0 - 38);
      x.lineTo(b.x + b.w, y0 + 1);
      x.closePath();
      x.fill();
    } else if (b.roof === 'antenna') {
      x.fillRect(b.x + b.w * 0.22, y0 - 24, b.w * 0.56, 25);
      x.fillRect(b.x + b.w / 2 - 1.8, y0 - b.ant, 3.6, b.ant);
      x.fillRect(b.x + b.w / 2 - 16, y0 - b.ant * 0.58, 32, 2);
      x.fillRect(b.x + b.w * 0.28, y0 - 52, 2, 52);
    }

    // Structural vertical pilasters & horizontal mechanical bands
    x.fillStyle = 'rgba(2,5,12,0.55)';
    x.fillRect(b.x + 6, y0, 3, b.h);
    x.fillRect(b.x + b.w - 9, y0, 3, b.h);
    x.fillStyle = 'rgba(55,110,190,0.12)';
    for (let y = y0 + 56; y < H0 - 24; y += 56) x.fillRect(b.x, y, b.w, 1.5);

    // Rim light along the building corner & roof crest
    const ex = b.rim > 0 ? b.x + b.w - 2 : b.x;
    const rg = x.createLinearGradient(0, y0, 0, H0);
    rg.addColorStop(0, 'rgba(95,205,255,0.52)');
    rg.addColorStop(1, 'rgba(95,205,255,0.06)');
    x.fillStyle = rg;
    x.fillRect(ex, y0, 2.2, b.h);
    x.fillStyle = 'rgba(130,220,255,0.34)';
    x.fillRect(b.x, y0, b.w, 1.4);

    // Windows
    for (let i = b.w0; i < b.w1; i++) paintWin(x, L.wins[i]);

    // Glowing vertical neon architecture trim strip
    if (b.strip) {
      x.save();
      x.shadowColor = '#29e6ff';
      x.shadowBlur = 12 * rs;
      x.fillStyle = 'rgba(90,235,255,0.82)';
      x.fillRect(b.rim > 0 ? b.x + 4 : b.x + b.w - 6, y0 + 8, 2.2, b.h - 44);
      x.restore();
    }
  }

  for (const sg of L.signs) signDimTubes(x, sg, 0, 0);

  if (L.board) {
    const B = L.board;
    x.fillStyle = '#02050c';
    x.fillRect(B.x - 6, B.y - 6, B.w + 12, B.h + 12);
    x.strokeStyle = 'rgba(70,150,255,0.45)';
    x.lineWidth = 1.5;
    x.strokeRect(B.x - 6, B.y - 6, B.w + 12, B.h + 12);
    x.fillStyle = '#1a2c48';
    x.fillRect(B.x - 5, B.y + B.h + 6, 3, 28);
    x.fillRect(B.x + B.w + 2, B.y + B.h + 6, 3, 28);
  }

  // Waterfront promenade / quay wall + streetlamps + warm storefront glow pockets
  x.fillStyle = '#03070f';
  x.fillRect(0, H0 - 12, VW, 20);
  x.fillStyle = 'rgba(115,205,255,0.42)';
  x.fillRect(0, H0 - 12, VW, 1.3);
  for (const lx of L.lamps) {
    x.fillStyle = '#0b162a';
    x.fillRect(lx - 1, H0 - 46, 2.2, 34);
    x.fillRect(lx - 1, H0 - 46, 9, 2.2);
    x.save();
    x.shadowColor = '#7fd8ff';
    x.shadowBlur = 14 * rs;
    x.fillStyle = '#dff6ff';
    x.fillRect(lx + 4, H0 - 45, 5.5, 2.6);
    x.restore();
  }
  R.near = c;
  R.nearTop = top;
  R.nearCtx = x;
}

function paintWin(x, w) {
  x.fillStyle = C.unlitNear;
  x.fillRect(w.x, w.y, w.w, w.h);
  if (w.lit) {
    x.fillStyle = w.col;
    x.fillRect(w.x, w.y, w.w, w.h);
  }
}

function renderReflection() {
  const [c, x] = mk(VW, WATER);
  const g = x.createLinearGradient(0, 0, 0, WATER);
  g.addColorStop(0, '#0c2856');
  g.addColorStop(1, '#02060e');
  x.fillStyle = g;
  x.fillRect(0, 0, VW, WATER);

  const k = 0.32;
  const layers = [
    [R.sky, 0, H0, 0.9],
    [R.far, R.farTop, H0 - R.farTop, 0.55],
    [R.mid, R.midTop, H0 - R.midTop, 0.65],
    [R.near, R.nearTop, H0 + 8 - R.nearTop, 0.8],
  ];
  for (const [cv, top, h, a] of layers) {
    for (let i = 0; i < 5; i++) {
      x.save();
      x.globalAlpha = a * (i === 0 ? 0.62 : 0.26);
      x.translate(0, i * 4);
      x.scale(1, -k);
      x.translate(0, -H0);
      x.drawImage(cv, 0, top, VW, h);
      x.restore();
    }
  }

  const d = x.createLinearGradient(0, 0, 0, WATER);
  d.addColorStop(0, 'rgba(2,6,16,0.22)');
  d.addColorStop(1, 'rgba(2,5,12,0.72)');
  x.fillStyle = d;
  x.fillRect(0, 0, VW, WATER);

  const r = mrng(4242);
  for (let i = 0; i < 260; i++) {
    const y = r() * WATER;
    x.fillStyle = `rgba(1,3,9,${0.25 + r() * 0.35})`;
    x.fillRect(r() * VW - 100, y, 60 + r() * 400, 1 + r() * 2);
  }
  for (const lx of L.lamps) {
    const ll = 55 + r() * 75;
    const lg = x.createLinearGradient(0, 0, 0, ll);
    lg.addColorStop(0, 'rgba(165,230,255,0.26)');
    lg.addColorStop(1, 'rgba(165,230,255,0)');
    x.fillStyle = lg;
    x.fillRect(lx + 3, 6, 7, ll);
  }
  R.refl = c;

  const [rc, rx] = mk(VW + 40, WATER);
  for (let i = 0; i < 200; i++) {
    rx.fillStyle = `rgba(1,4,10,${0.3 + r() * 0.4})`;
    rx.fillRect(r() * (VW + 40) - 50, r() * WATER, 40 + r() * 260, 1 + r() * 1.5);
  }
  for (let i = 0; i < 65; i++) {
    rx.fillStyle = `rgba(140,210,255,${0.05 + r() * 0.07})`;
    rx.fillRect(r() * VW, r() * WATER, 30 + r() * 140, 1);
  }
  R.ripple = rc;
}

function renderSprites() {
  const dot = (col) => {
    const [c, x] = mk(64, 64);
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.14, hexA(col, 0.92));
    g.addColorStop(0.42, hexA(col, 0.28));
    g.addColorStop(1, hexA(col, 0));
    x.fillStyle = g;
    x.fillRect(0, 0, 64, 64);
    return c;
  };
  R.dotCyan = dot('#29e6ff');
  R.dotMag = dot(ACCENT);
  R.dotRed = dot('#ff4a6a');
  R.dotWhite = dot('#cfe8ff');
  R.dotBlue = dot('#3d8bff');

  // Spinner headlight cone
  {
    const [c, x] = mk(240, 44);
    const g = x.createLinearGradient(0, 0, 240, 0);
    g.addColorStop(0, 'rgba(185,238,255,0.62)');
    g.addColorStop(0.5, 'rgba(120,205,255,0.22)');
    g.addColorStop(1, 'rgba(120,205,255,0)');
    x.fillStyle = g;
    x.beginPath();
    x.moveTo(0, 20);
    x.lineTo(240, 0);
    x.lineTo(240, 44);
    x.lineTo(0, 24);
    x.fill();
    R.cone = c;
  }

  // Rooftop searchlight beam
  {
    const [c, x] = mk(1300, 220);
    for (const [wf, a] of [[1, 0.055], [0.7, 0.065], [0.45, 0.085], [0.22, 0.11]]) {
      const g = x.createLinearGradient(0, 0, 1300, 0);
      g.addColorStop(0, `rgba(155,215,255,${a * 2})`);
      g.addColorStop(0.5, `rgba(155,215,255,${a})`);
      g.addColorStop(1, 'rgba(155,215,255,0)');
      x.fillStyle = g;
      x.beginPath();
      x.moveTo(0, 110 - 6 * wf);
      x.lineTo(1300, 110 - 110 * wf);
      x.lineTo(1300, 110 + 110 * wf);
      x.lineTo(0, 110 + 6 * wf);
      x.fill();
    }
    R.beam = c;
  }

  // Volumetric street fog puff
  {
    const [c, x] = mk(1400, 240);
    const r = mrng(77);
    for (let i = 0; i < 28; i++) {
      const cx = 200 + r() * 1000, cy = 90 + r() * 70, ry = 42 + r() * 60, rx = ry * (2 + r() * 3);
      x.save();
      x.translate(cx, cy);
      x.scale(rx / ry, 1);
      const g = x.createRadialGradient(0, 0, 0, 0, 0, ry);
      g.addColorStop(0, 'rgba(85,155,235,0.22)');
      g.addColorStop(1, 'rgba(85,155,235,0)');
      x.fillStyle = g;
      x.fillRect(-ry, -ry, ry * 2, ry * 2);
      x.restore();
    }
    R.fog = c;
  }

  // Lightning flash blob
  {
    const [c, x] = mk(400, 400);
    const g = x.createRadialGradient(200, 200, 0, 200, 200, 200);
    g.addColorStop(0, 'rgba(175,210,255,0.58)');
    g.addColorStop(0.5, 'rgba(110,155,255,0.20)');
    g.addColorStop(1, 'rgba(90,120,255,0)');
    x.fillStyle = g;
    x.fillRect(0, 0, 400, 400);
    R.flashBlob = c;
  }

  // Vignette + top status-bar shade
  {
    const [c, x] = mk(VW, VH);
    const g = x.createRadialGradient(VW / 2, VH * 0.55, VH * 0.45, VW / 2, VH * 0.55, VW * 0.76);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,2,8,0.62)');
    x.fillStyle = g;
    x.fillRect(0, 0, VW, VH);
    const t = x.createLinearGradient(0, 0, 0, 110);
    t.addColorStop(0, 'rgba(0,1,5,0.55)');
    t.addColorStop(1, 'rgba(0,1,5,0)');
    x.fillStyle = t;
    x.fillRect(0, 0, VW, 110);
    R.vig = c;
  }
}

function renderBoard() {
  if (!L.board) return;
  const B = L.board, r = mrng(31337);
  R.slides = [0, 1, 2, 3].map((k) => {
    const [c, x] = mk(B.w, B.h);
    const bg = x.createLinearGradient(0, 0, 0, B.h);
    const pal = [
      ['#062044', '#0b5294', '#29e6ff'],
      ['#150838', '#442299', '#d28cff'],
      ['#04223a', '#0a6c8e', '#7ff0ff'],
      ['#1a0826', '#4a1259', ACCENT],
    ][k];
    bg.addColorStop(0, pal[0]);
    bg.addColorStop(1, pal[1]);
    x.fillStyle = bg;
    x.fillRect(0, 0, B.w, B.h);

    x.strokeStyle = pal[2];
    x.fillStyle = pal[2];
    x.lineWidth = 2.6;
    x.lineCap = 'round';
    const cx = B.w / 2;
    if (k === 0) {
      // Cybernetic target / orbital rings
      for (let i = 1; i <= 4; i++) {
        x.globalAlpha = 1 - i * 0.16;
        x.beginPath();
        x.arc(cx, 66, i * 11, 0, TAU);
        x.stroke();
      }
      x.globalAlpha = 0.9;
      x.beginPath(); x.moveTo(cx - 42, 66); x.lineTo(cx + 42, 66); x.stroke();
    } else if (k === 1) {
      // Neon pyramid + sun emblem
      x.beginPath();
      x.moveTo(cx, 28);
      x.lineTo(cx + 38, 102);
      x.lineTo(cx - 38, 102);
      x.closePath();
      x.stroke();
      x.globalAlpha = 0.65;
      x.beginPath(); x.arc(cx, 72, 14, 0, TAU); x.fill();
    } else if (k === 2) {
      // Large calligraphic kanji mark
      const lines = [];
      addGlyph(cx - 30, 24, 60, lines, 0);
      x.beginPath();
      for (const l of lines) { x.moveTo(l[0], l[1]); x.lineTo(l[2], l[3]); }
      x.lineWidth = 4.2;
      x.stroke();
    } else {
      // Equalizer / telemetry spectrum bars
      for (let i = 0; i < 8; i++) {
        x.globalAlpha = 0.45 + (i % 3) * 0.18;
        const bh = 22 + r() * 58;
        x.fillRect(18 + i * 10.5, 108 - bh, 6.5, bh);
      }
    }
    x.globalAlpha = 0.85;
    for (let i = 0; i < 3; i++) x.fillRect(16, 134 + i * 11, 34 + r() * 52, 4);
    x.globalAlpha = 0.14;
    x.fillStyle = '#000';
    for (let y = 0; y < B.h; y += 3) x.fillRect(0, y, B.w, 1);
    x.globalAlpha = 1;
    return c;
  });

  const [gc, gx] = mk(B.w + 160, B.h + 160);
  const g = gx.createRadialGradient(gc.width / rs / 2, gc.height / rs / 2, 20, gc.width / rs / 2, gc.height / rs / 2, 150);
  g.addColorStop(0, 'rgba(55,155,255,0.38)');
  g.addColorStop(1, 'rgba(55,155,255,0)');
  gx.fillStyle = g;
  gx.fillRect(0, 0, B.w + 160, B.h + 160);
  R.boardGlow = gc;
}

function renderAll() {
  renderSky();
  renderClouds();
  renderFar();
  renderMid();
  renderNear();
  for (const sg of L.signs) renderSign(sg);
  renderReflection();
  renderSprites();
  renderBoard();
  if (S.bolt) renderBolt(S.bolt);
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------
function spawnVehicle(initial) {
  const s = range(0.42, 1.35), dir = rand() < 0.5 ? 1 : -1;
  const y = 130 + (1.35 - s) * 260 + range(-25, 85) + (s > 1 ? 110 : 0);
  const v = {
    s, dir,
    y: Math.max(110, y),
    speed: range(85, 165) * (0.5 + s),
    bf: range(0.6, 1.2),
    ph: rand() * 6,
    x: dir > 0 ? -160 : VW + 160,
    tail: rand() < 0.35 ? ACCENT : '#ff4a6a',
  };
  if (initial) v.x = range(260, VW - 260);
  S.vehicles.push(v);
  return v;
}

function lightning() {
  const x0 = range(250, VW - 250);
  const pts = [[x0, range(40, 90)]];
  let x = x0, y = pts[0][1];
  const yEnd = range(330, 520);
  while (y < yEnd) { y += range(18, 42); x += range(-28, 28); pts.push([x, y]); }
  const branch = [];
  const bi = 2 + Math.floor(rand() * (pts.length - 3));
  let bx = pts[bi][0], by = pts[bi][1];
  branch.push([bx, by]);
  for (let i = 0; i < 4; i++) {
    bx += range(10, 40) * (rand() < 0.5 ? -1 : 1);
    by += range(15, 35);
    branch.push([bx, by]);
  }
  S.bolt = { pts, branch, x0 };
  renderBolt(S.bolt);
  const pulses = 1 + Math.floor(rand() * 3);
  let d = 0;
  for (let i = 0; i < pulses; i++) {
    after(d, () => { S.flash = Math.max(S.flash, range(0.7, 1)); });
    d += range(0.08, 0.3);
  }
}

function renderBolt(b) {
  const xs = b.pts.map((p) => p[0]).concat(b.branch.map((p) => p[0]));
  const ys = b.pts.map((p) => p[1]).concat(b.branch.map((p) => p[1]));
  const minx = Math.min(...xs) - 30, miny = Math.min(...ys) - 30;
  const maxx = Math.max(...xs) + 30, maxy = Math.max(...ys) + 30;
  const [c, x] = mk(maxx - minx, maxy - miny);
  x.translate(-minx, -miny);
  const line = (pts, wdt) => {
    x.beginPath();
    x.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) x.lineTo(p[0], p[1]);
    x.lineWidth = wdt;
    x.strokeStyle = '#9cc8ff';
    x.shadowColor = '#6fa8ff';
    x.shadowBlur = 18 * rs;
    x.stroke();
    x.shadowBlur = 0;
    x.lineWidth = wdt * 0.4;
    x.strokeStyle = '#f0f8ff';
    x.stroke();
  };
  x.lineJoin = 'round';
  line(b.pts, 2.4);
  line(b.branch, 1.4);
  b.cv = c;
  b.bx = minx; b.by = miny; b.bw = maxx - minx; b.bh = maxy - miny;
}

function searchlight() {
  if (S.lights.length >= 2) return;
  const ox = range(300, VW - 300);
  S.lights.push({
    ox, oy: H0 - range(90, 140),
    a0: range(-0.55, 0.55),
    sp: range(0.04, 0.09) * (rand() < 0.5 ? -1 : 1),
    amp: range(0.2, 0.45),
    age: 0, life: range(14, 30), ph: rand() * 6,
  });
}

// ---------------------------------------------------------------------------
// Scene lifecycle
// ---------------------------------------------------------------------------
LW.start({
  init() {
    genSkylines();
    for (let i = 0; i < 270; i++) {
      const near = i >= 175;
      S.drops.push({
        x: range(-200, VW), y: range(-50, VH), near,
        len: near ? range(26, 44) : range(13, 22),
        sp: near ? range(1350, 1650) : range(850, 1100),
      });
    }
    const fogDefs = [[640, 0.55, 9], [770, 0.8, -6], [800, 0.7, 12], [840, 1, -14], [700, 0.6, 7], [860, 0.9, 16]];
    S.fogs = fogDefs.map(([y, a, sp], i) => ({ y, a, sp, x: range(-1400, VW), slot: i < 2 ? 0 : i < 4 ? 1 : 2 }));

    spawnVehicle(true);
    spawnVehicle(true);
    if (rand() < 0.7) spawnVehicle(true);
    after(3.2, () => spawnVehicle(false));
    after(4.4, () => spawnVehicle(false));
    after(5.5, () => spawnVehicle(false));

    every(4.5, 13, () => {
      spawnVehicle(false);
      if (rand() < 0.35) {
        const n = 1 + Math.floor(rand() * 2);
        for (let i = 1; i <= n; i++) after(i * range(0.5, 1.1), () => spawnVehicle(false));
      }
    });
    every(0.12, 0.65, () => {
      const w = pick(L.wins);
      if (!w) return;
      w.lit = !w.lit;
      if (w.lit) w.col = winCol();
      if (R.nearCtx) paintWin(R.nearCtx, w);
    });
    every(3, 14, () => { const s = pick(L.signs); if (s && s.dead <= 0) s.flick = range(0.2, 1.1); });
    every(25, 70, () => { const s = pick(L.signs); if (s) s.dead = range(2, 9); });
    every(1.2, 4, () => { for (const s of L.signs) if (s.buzz && s.dead <= 0) s.flick = Math.max(s.flick, range(0.05, 0.3)); });
    every(40, 120, lightning);
    every(18, 55, searchlight);
    searchlight();
    S.lights[0].age = 4;
    if (rand() < 0.6) { searchlight(); S.lights[1].age = 3; }
    every(4, 11, () => { S.boardNext = (S.boardSlide + 1 + Math.floor(rand() * 3)) % 4; S.boardMix = 0.0001; });
    every(6, 20, () => { S.boardGlitch = range(0.15, 0.4); });
  },
  resize(view) {
    const want = Math.min(2, Math.max(0.5, Math.round(view.scale * 4) / 4));
    if (want === rs) return;
    rs = want;
    renderAll();
  },
  update(dt, t) {
    for (const d of S.drops) {
      d.y += d.sp * dt;
      d.x += d.sp * 0.2 * dt;
      if (d.y - d.len > VH) { d.y = range(-80, -10); d.x = range(-250, VW); }
    }
    let n = Math.floor(dt * 32 + rand());
    while (n-- > 0) {
      const y = H0 + 8 + Math.pow(rand(), 0.8) * (WATER - 8);
      S.ripples.push({ x: range(80, VW - 80), y, r: 0, rm: 3 + ((y - H0) / WATER) * 16, life: 0 });
    }
    for (let i = S.ripples.length - 1; i >= 0; i--) {
      const p = S.ripples[i];
      p.life += dt * 1.8;
      if (p.life >= 1) S.ripples.splice(i, 1);
    }
    for (const f of S.fogs) {
      f.x += f.sp * dt;
      if (f.x > VW + 50) f.x = -1450;
      if (f.x < -1450) f.x = VW + 50;
    }
    for (let i = S.vehicles.length - 1; i >= 0; i--) {
      const v = S.vehicles[i];
      v.x += v.dir * v.speed * dt;
      if (v.x < -300 || v.x > VW + 300) S.vehicles.splice(i, 1);
    }
    for (const s of L.signs) {
      if (s.dead > 0) {
        s.dead -= dt;
        s.level = 0.0;
        if (s.dead <= 0) s.flick = range(0.4, 1.2);
        continue;
      }
      if (s.flick > 0) {
        s.flick -= dt;
        s.ft -= dt;
        if (s.ft <= 0) { s.on = !s.on; s.ft = range(0.02, 0.11); }
        s.level = s.on ? range(0.75, 1) : range(0, 0.2);
        if (s.flick <= 0) s.on = true;
      } else s.level = 0.93 + 0.07 * Math.sin(t * 9 + s.ph);
    }
    for (let i = S.lights.length - 1; i >= 0; i--) {
      const l = S.lights[i];
      l.age += dt;
      if (l.age > l.life) S.lights.splice(i, 1);
    }
    S.flash = Math.max(0, S.flash - dt * 5);
    if (S.boardMix > 0) {
      S.boardMix += dt * 1.5;
      if (S.boardMix >= 1) { S.boardSlide = S.boardNext; S.boardMix = 0; }
    }
    S.boardGlitch = Math.max(0, S.boardGlitch - dt);
  },
  draw(ctx, t) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(R.sky, 0, 0, VW, H0);

    const cx = (t * 5) % VW;
    ctx.globalAlpha = 0.95;
    ctx.drawImage(R.clouds, cx, 0, VW, R.cloudH);
    ctx.drawImage(R.clouds, cx - VW, 0, VW, R.cloudH);
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = 'lighter';
    if (S.flash > 0.01 && S.bolt) {
      const b = S.bolt;
      ctx.globalAlpha = S.flash;
      ctx.drawImage(R.flashBlob, b.x0 - 500, -350, 1000, 1000);
      ctx.globalAlpha = Math.min(1, S.flash * 1.4);
      ctx.drawImage(b.cv, b.bx, b.by, b.bw, b.bh);
    }
    for (const l of S.lights) {
      const fade = Math.min(1, l.age / 2.5, (l.life - l.age) / 2.5);
      const a = l.a0 + Math.sin(l.age * l.sp * TAU + l.ph) * l.amp;
      ctx.save();
      ctx.translate(l.ox, l.oy);
      ctx.rotate(-Math.PI / 2 + a);
      ctx.globalAlpha = 0.82 * Math.max(0, fade);
      ctx.drawImage(R.beam, 0, -110, 1300, 220);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // Far skyline
    ctx.drawImage(R.far, 0, R.farTop, VW, H0 - R.farTop);
    drawFogs(ctx, 0);
    drawVehicles(ctx, t, 0, 0.62);

    // Mid skyline
    ctx.drawImage(R.mid, 0, R.midTop, VW, H0 - R.midTop);
    drawFogs(ctx, 1);
    drawVehicles(ctx, t, 0.62, 1.0);

    // Near skyline
    ctx.drawImage(R.near, 0, R.nearTop, VW, H0 + 8 - R.nearTop);
    drawBoard(ctx, t);
    drawHolos(ctx, t);

    ctx.globalCompositeOperation = 'lighter';
    for (const s of L.signs) drawSign(ctx, s, t, false);
    for (const b of L.beacons) {
      const k = Math.max(0, Math.sin(t * b.sp * 3 + b.ph));
      if (k < 0.05) continue;
      ctx.globalAlpha = k * 0.9;
      ctx.drawImage(b.col === ACCENT ? R.dotMag : R.dotRed, b.x - 9, b.y - 9, 18, 18);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    drawVehicles(ctx, t, 1.0, 9);

    // Shimmering wet street / canal reflection
    for (let i = 0; i < 25; i++) {
      const sy = i * 8, off = Math.sin(t * 1.3 + i * 0.75) * (1 + i * 0.18);
      ctx.drawImage(R.refl, 0, sy * rs, R.refl.width, 8 * rs, -10 + off, H0 + sy, VW + 20, 8.4);
    }
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, H0 + 6, VW, WATER);
    ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of L.signs) drawSign(ctx, s, t, true);
    if (S.flash > 0.01) {
      ctx.globalAlpha = S.flash * 0.25;
      ctx.fillStyle = '#3a5aa0';
      ctx.fillRect(0, H0, VW, WATER);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    const ro = Math.sin(t * 0.7) * 14;
    ctx.drawImage(R.ripple, -20 + ro, H0, VW + 40, WATER);
    ctx.restore();

    // Raindrop ripples
    ctx.strokeStyle = 'rgba(155,215,255,0.52)';
    ctx.lineWidth = 1;
    for (const p of S.ripples) {
      const r = p.rm * p.life;
      ctx.globalAlpha = (1 - p.life) * 0.55;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, r, r * 0.22, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    drawFogs(ctx, 2);

    // Rain streaks
    ctx.lineCap = 'butt';
    for (const near of [false, true]) {
      ctx.beginPath();
      for (const d of S.drops) {
        if (d.near === near) {
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x - d.len * 0.2, d.y - d.len);
        }
      }
      ctx.strokeStyle = near ? 'rgba(175,220,255,0.32)' : 'rgba(140,195,255,0.16)';
      ctx.lineWidth = near ? 1.4 : 1;
      ctx.stroke();
    }
    if (S.flash > 0.01) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = S.flash * 0.08;
      ctx.fillStyle = '#6f8fd0';
      ctx.fillRect(0, 0, VW, VH);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(R.vig, 0, 0, VW, VH);
  },
});

function drawFogs(ctx, slot) {
  for (const f of S.fogs) {
    if (f.slot === slot) {
      ctx.globalAlpha = f.a;
      ctx.drawImage(R.fog, f.x, f.y - 140, 1400, 240);
    }
  }
  ctx.globalAlpha = 1;
}

function drawHolos(ctx, t) {
  if (!L.holos.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const h of L.holos) {
    const cy = h.y - h.r - 22;
    // Upward projector light cone
    const cg = ctx.createLinearGradient(h.x, h.y, h.x, cy - h.r);
    cg.addColorStop(0, 'rgba(41,230,255,0.45)');
    cg.addColorStop(1, 'rgba(41,230,255,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(h.x - 10, h.y);
    ctx.lineTo(h.x - h.r * 1.15, cy - h.r * 0.4);
    ctx.lineTo(h.x + h.r * 1.15, cy - h.r * 0.4);
    ctx.lineTo(h.x + 10, h.y);
    ctx.closePath();
    ctx.fill();

    // Rotating 3D wireframe hologram globe
    ctx.strokeStyle = 'rgba(41,230,255,0.65)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(h.x, cy, h.r, 0, TAU);
    ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const rx = Math.abs(Math.sin(t * 0.7 + (i * Math.PI) / 3)) * h.r;
      ctx.beginPath();
      ctx.ellipse(h.x, cy, Math.max(2, rx), h.r, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.ellipse(h.x, cy, h.r, h.r * 0.32, 0, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}

function drawSign(ctx, s, t, refl) {
  if (s.level <= 0.01) return;
  const sh = s.sh, w = sh.w + PAD * 2, h = sh.h + PAD * 2, x = s.x - PAD;
  if (!refl) {
    ctx.globalAlpha = s.level;
    ctx.drawImage(s.cv, x, s.y - PAD, w, h);
    if (s.partCv) {
      const n = s.partCv.length, idx = Math.floor(t * (sh.type === 'chevron' ? 4 : 2.5)) % (n + 2);
      for (let i = 0; i < n; i++) {
        const on = sh.type === 'chevron' ? (i === idx || i === idx - 1) : i <= idx;
        ctx.globalAlpha = s.level * (on ? 1 : 0.14);
        ctx.drawImage(s.partCv[i], x, s.y - PAD, w, h);
      }
    }
  } else {
    const cy = s.y + sh.h / 2, ry = H0 + (H0 - cy) * 0.3;
    const rh = Math.max(h * 0.9, 120);
    ctx.save();
    ctx.translate(x + Math.sin(t * 2 + s.ph) * 2, ry);
    ctx.scale(1, -1);
    ctx.globalAlpha = s.level * 0.22;
    ctx.drawImage(s.cv, 0, -rh / 2, w, rh);
    ctx.globalAlpha = s.level * 0.15;
    ctx.drawImage(s.cv, 0, -rh * 0.95, w, rh * 1.9);
    ctx.restore();
  }
}

function drawVehicles(ctx, t, smin, smax) {
  for (const v of S.vehicles) {
    if (v.s < smin || v.s >= smax) continue;
    const y = v.y + Math.sin(t * v.bf + v.ph) * 3 * v.s;
    ctx.save();
    ctx.translate(v.x, y);
    ctx.scale(v.dir * v.s, v.s);

    // Long plasma tail-light trail behind spinner
    ctx.globalCompositeOperation = 'lighter';
    const tg = ctx.createLinearGradient(-150, 0, -24, 0);
    const tCol = v.tail === ACCENT ? '255,63,180' : '255,74,106';
    tg.addColorStop(0, `rgba(${tCol},0)`);
    tg.addColorStop(1, `rgba(${tCol},0.75)`);
    ctx.fillStyle = tg;
    ctx.fillRect(-150, -3, 126, 4);

    // Volumetric headlight cone & ventral hover thruster glow
    ctx.globalAlpha = 0.65;
    ctx.drawImage(R.cone, 22, -22, 240, 44);
    ctx.globalAlpha = 0.75;
    ctx.drawImage(R.dotCyan, -24, -3, 48, 22);
    ctx.drawImage(R.dotCyan, 2, -3, 36, 18);

    // Sleek Blade-Runner spinner hull
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#071022';
    ctx.beginPath();
    ctx.moveTo(-30, 2);
    ctx.lineTo(-24, -5);
    ctx.lineTo(-10, -6);
    ctx.lineTo(-1, -12);
    ctx.lineTo(14, -11);
    ctx.lineTo(24, -4);
    ctx.lineTo(32, -1);
    ctx.lineTo(28, 4);
    ctx.lineTo(-26, 5);
    ctx.closePath();
    ctx.fill();

    // Canopy glass & neon trim
    ctx.fillStyle = 'rgba(130,215,255,0.65)';
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(12, -9.5);
    ctx.lineTo(20, -4);
    ctx.lineTo(-2, -4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(85,205,255,0.7)';
    ctx.fillRect(-24, 3, 50, 1.2);

    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(R.dotWhite, 20, -10, 18, 18);
    ctx.drawImage(v.tail === ACCENT ? R.dotMag : R.dotRed, -36, -9, 18, 18);
    if (Math.sin(t * 5 + v.ph) > 0.85) ctx.drawImage(R.dotWhite, -8, -24, 22, 22);
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawBoard(ctx, t) {
  if (!L.board || !R.slides) return;
  const B = L.board;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.62 + 0.1 * Math.sin(t * 3);
  ctx.drawImage(R.boardGlow, B.x - 80, B.y - 80, B.w + 160, B.h + 160);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.94;
  const cur = R.slides[S.boardSlide];
  if (S.boardGlitch > 0) {
    for (let i = 0; i < 6; i++) {
      const sy = (i * B.h) / 6;
      const off = (((i * 37 + Math.floor(t * 20)) % 7) - 3) * 3;
      ctx.drawImage(cur, 0, sy * rs, cur.width, (B.h / 6) * rs, B.x + off, B.y + sy, B.w, B.h / 6);
    }
  } else ctx.drawImage(cur, B.x, B.y, B.w, B.h);
  if (S.boardMix > 0) {
    ctx.globalAlpha = 0.94 * S.boardMix;
    ctx.drawImage(R.slides[S.boardNext], B.x, B.y, B.w, B.h);
  }
  const sy = B.y + ((t * 40) % (B.h + 20)) - 10;
  if (sy < B.y + B.h - 1) {
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#bfe6ff';
    ctx.fillRect(B.x, Math.max(B.y, sy), B.w, Math.min(6, B.y + B.h - sy));
  }
  ctx.globalAlpha = 1;
}

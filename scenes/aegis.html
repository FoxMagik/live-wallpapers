<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
// ============================================================================
// livewall runtime — copy this block unchanged into every scene.
//
// Scene contract:
//   * Self-contained single file. No network requests, no external assets.
//   * Draw in a virtual 1920x1080 space; the runtime scales it to "cover".
//   * Put ALL timing in update(dt) / sim-time timers (after/every). Never use
//     setTimeout/setInterval for animation — those keep running while paused
//     and break ?still rendering.
//   * Use rand() (seeded) instead of Math.random().
//
// URL params:  ?fps=30      frame cap (host passes 30; default 60)
//              ?seed=123    deterministic randomness
//              ?still=1&t=8 simulate 8s of scene time, draw one frame, stop
//                           (used to generate theme background stills)
// Host API:    window.livewall.pause() / resume() / paused
// ============================================================================
const LW = (() => {
  const params = new URLSearchParams(location.search);
  const VW = 1920, VH = 1080;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let seed = (Number(params.get('seed')) || (Date.now() % 2147483647)) >>> 0;
  function rand() { // mulberry32
    seed = (seed + 0x6D2B79F5) >>> 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const range = (a, b) => a + rand() * (b - a);
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];

  // sim-time scheduler
  let simTime = 0;
  const timers = [];
  function after(sec, fn) { timers.push({ at: simTime + sec, fn }); }
  function every(minSec, maxSec, fn) {
    const go = () => { fn(); after(range(minSec, maxSec), go); };
    after(range(minSec, maxSec), go);
  }
  function runTimers() {
    for (let i = timers.length - 1; i >= 0; i--) {
      if (timers[i].at <= simTime) { const t = timers.splice(i, 1)[0]; t.fn(); }
    }
  }

  const view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
  function resize() {
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);
    view.w = Math.round(innerWidth * view.dpr);
    view.h = Math.round(innerHeight * view.dpr);
    canvas.width = view.w; canvas.height = view.h;
    view.scale = Math.max(view.w / VW, view.h / VH);
    view.ox = (view.w - VW * view.scale) / 2;
    view.oy = (view.h - VH * view.scale) / 2;
    if (scene.resize) scene.resize(view);
    drawFrame();
  }

  let scene = null, paused = false, last = 0, raf = 0;
  const fps = Math.max(1, Number(params.get('fps')) || 60);
  const still = params.has('still');

  function step(dt) { simTime += dt; runTimers(); scene.update(dt, simTime); }
  function drawFrame() {
    if (!scene) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, view.w, view.h);
    ctx.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
    scene.draw(ctx, simTime);
  }
  function loop(now) {
    raf = 0;
    if (paused) return;
    raf = requestAnimationFrame(loop);
    if (!last) { last = now; return; }
    const elapsed = now - last;
    if (elapsed < 1000 / fps - 2) return;
    last = now;
    step(Math.min(elapsed / 1000, 0.1));
    drawFrame();
  }
  function pause() { paused = true; if (raf) cancelAnimationFrame(raf); raf = 0; }
  function resume() { if (still) return; paused = false; last = 0; if (!raf) raf = requestAnimationFrame(loop); }

  function start(s) {
    scene = s;
    if (scene.init) scene.init(view);
    addEventListener('resize', resize);
    resize();
    if (still) {
      const T = Number(params.get('t')) || 8;
      while (simTime < T) step(1 / 30);
      drawFrame();
      document.title += ' [still]';
      return;
    }
    document.addEventListener('visibilitychange', () => document.hidden ? pause() : resume());
    resume();
  }

  window.livewall = { pause, resume, get paused() { return paused; } };
  return { VW, VH, ctx, rand, range, pick, after, every, start, view,
           get time() { return simTime; } };
})();
// ============================== end runtime =================================

// ---- scene: Aegis — Futuristic Holographic Command & Telemetry HUD ---------
// Displays real-time Linux computer usage (CPU cores, RAM/cache/swap, disk,
// network RX/TX spectrum, thermal sensors, load average, and top processes)
// when fed by `livewall.py` via `window.livewall.pushStats()`, and seamlessly
// falls back to a deterministic seeded telemetry simulator in any browser,
// OBS source, or `?still=1` render.
const { VW, VH, rand, range, pick, after, every } = LW;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const F_DISP = '"ShureTechMono Nerd Font", "MonaspiceKr Nerd Font", "0xProto Nerd Font", monospace';
const F_MONO = '"MonaspiceKr Nerd Font", "ShureTechMono Nerd Font", "JetBrainsMono Nerd Font", monospace';

const C = {
  cyan: '#00f0ff',
  cyanDim: 'rgba(0,240,255,0.22)',
  cyanFaint: 'rgba(0,240,255,0.08)',
  azure: '#38bdf8',
  mint: '#00ffa3',
  amber: '#ffb800',
  coral: '#ff3b5c',
  text: '#d8f8ff',
  muted: '#5c8ca8',
};

const CX = 960, CY = 492;
let PS = 1;
const L = {};

function mk(w, h, s = PS) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * s));
  c.height = Math.max(1, Math.ceil(h * s));
  const g = c.getContext('2d');
  g.scale(s, s);
  return [c, g];
}

// ---------------------------------------------------------------------------
// Telemetry State (smoothly interpolated towards either live host stats or sim)
// ---------------------------------------------------------------------------
const CORE_COUNT = 8;
const HIST_LEN = 56;
const NET_BINS = 28;

const T = {
  live: false,
  lastPushSimTime: -999,
  host: 'AEGIS-01',
  kernel: '7.2.15',
  iface: 'wlo1',
  tasks: '2/648',
  uptimeBase: 513120,

  cpu: 28.4,
  cpuTarget: 28.4,
  cores: new Array(CORE_COUNT).fill(20),
  coreTargets: new Array(CORE_COUNT).fill(20),
  corePeaks: new Array(CORE_COUNT).fill(32),
  freqBars: new Array(32).fill(0.4),

  memPct: 36.8,
  memTarget: 36.8,
  memUsedGb: 5.6,
  memTotalGb: 15.2,
  cachePct: 68.4,
  cacheTarget: 68.4,
  swapPct: 4.2,
  swapTarget: 4.2,
  memCells: new Array(32).fill(0),

  diskPct: 24.4,
  diskUsedGb: 57.8,
  diskTotalGb: 236.5,

  rxKbs: 420.5,
  txKbs: 84.2,
  rxTarget: 420.5,
  txTarget: 84.2,
  rxBins: new Array(NET_BINS).fill(0.25),
  txBins: new Array(NET_BINS).fill(0.15),

  temps: { cpu: 51.0, gpu: 46.0, nvme: 36.5, sys: 38.0 },
  tempTargets: { cpu: 51.0, gpu: 46.0, nvme: 36.5, sys: 38.0 },

  load: [0.84, 0.62, 0.45],
  loadTargets: [0.84, 0.62, 0.45],

  cpuHist: new Array(HIST_LEN).fill(24),
  loadHist: new Array(HIST_LEN).fill(18),
  radialSpec: new Array(48).fill(0.3),

  procs: [
    { pid: 1842, name: 'hyprland', cpu: 8.4, mem: 2.8 },
    { pid: 2109, name: 'quickshell', cpu: 5.2, mem: 3.9 },
    { pid: 4412, name: 'livewall.py', cpu: 4.1, mem: 1.6 },
    { pid: 6830, name: 'chromium', cpu: 6.8, mem: 8.4 },
    { pid: 9120, name: 'ghostty', cpu: 2.3, mem: 1.9 },
    { pid: 1104, name: 'pipewire', cpu: 1.4, mem: 0.7 },
  ],

  scanY: 0,
  pulseRing: 0,
  sphereVerts: [],
  sphereEdges: [],
  motes: [],
};

// Hook for livewall.py desktop host to push real `/proc` & `/sys` usage
if (window.livewall) {
  window.livewall.pushStats = (data) => {
    if (!data) return;
    T.live = true;
    T.lastPushSimTime = LW.time;
    if (data.host) T.host = String(data.host).toUpperCase();
    if (data.kernel) T.kernel = String(data.kernel);
    if (data.tasks) T.tasks = String(data.tasks);
    if (typeof data.uptime === 'number') T.uptimeBase = data.uptime;
    if (typeof data.cpu === 'number') T.cpuTarget = clamp(data.cpu, 0, 100);

    if (Array.isArray(data.cores) && data.cores.length) {
      for (let i = 0; i < CORE_COUNT; i++) {
        const v = data.cores[i % data.cores.length] || 0;
        T.coreTargets[i] = clamp(v, 0, 100);
        if (v > T.corePeaks[i]) T.corePeaks[i] = clamp(v, 0, 100);
      }
    }
    if (data.mem) {
      T.memTarget = clamp(data.mem.pct || 0, 0, 100);
      T.memUsedGb = data.mem.usedGb ?? T.memUsedGb;
      T.memTotalGb = data.mem.totalGb ?? T.memTotalGb;
      T.cacheTarget = clamp(data.mem.cachePct || 0, 0, 100);
      T.swapTarget = clamp(data.mem.swapPct || 0, 0, 100);
    }
    if (data.disk) {
      T.diskPct = clamp(data.disk.pct || 0, 0, 100);
      T.diskUsedGb = data.disk.usedGb ?? T.diskUsedGb;
      T.diskTotalGb = data.disk.totalGb ?? T.diskTotalGb;
    }
    if (data.net) {
      T.rxTarget = Math.max(0, data.net.rxKbs || 0);
      T.txTarget = Math.max(0, data.net.txKbs || 0);
      if (data.net.iface) T.iface = data.net.iface;
    }
    if (data.temps) {
      if (data.temps.cpu) T.tempTargets.cpu = data.temps.cpu;
      if (data.temps.wifi) T.tempTargets.gpu = data.temps.wifi;
      if (data.temps.nvme) T.tempTargets.nvme = data.temps.nvme;
      if (data.temps.sys) T.tempTargets.sys = data.temps.sys;
    }
    if (Array.isArray(data.load) && data.load.length >= 3) {
      T.loadTargets = [data.load[0], data.load[1], data.load[2]];
    }
    if (Array.isArray(data.procs) && data.procs.length) {
      T.procs = data.procs.slice(0, 6);
    }
    // Push history sample
    T.cpuHist.shift();
    T.cpuHist.push(T.cpuTarget);
    T.loadHist.shift();
    T.loadHist.push(clamp((T.loadTargets[0] / CORE_COUNT) * 100, 2, 100));
  };
}

// ---------------------------------------------------------------------------
// 3D Geodesic Sphere Geometry (for the central holographic reactor core)
// ---------------------------------------------------------------------------
function buildSphere() {
  const verts = [];
  const edges = [];
  const latSteps = 6, lonSteps = 12;
  for (let i = 0; i <= latSteps; i++) {
    const lat = (i / latSteps - 0.5) * Math.PI;
    const y = Math.sin(lat), r = Math.cos(lat);
    for (let j = 0; j < lonSteps; j++) {
      const lon = (j / lonSteps) * TAU;
      verts.push([Math.cos(lon) * r, y, Math.sin(lon) * r]);
      const cur = i * lonSteps + j;
      const nextLon = i * lonSteps + ((j + 1) % lonSteps);
      if (i > 0 && i < latSteps) edges.push([cur, nextLon]);
      if (i < latSteps) {
        edges.push([cur, (i + 1) * lonSteps + j]);
        if ((i + j) % 2 === 0) edges.push([cur, (i + 1) * lonSteps + ((j + 1) % lonSteps)]);
      }
    }
  }
  T.sphereVerts = verts;
  T.sphereEdges = edges;
}

// ---------------------------------------------------------------------------
// Pre-rendered static holographic HUD chrome & background grid
// ---------------------------------------------------------------------------
function chamferRect(g, x, y, w, h, c) {
  g.beginPath();
  g.moveTo(x + c, y);
  g.lineTo(x + w - c, y);
  g.lineTo(x + w, y + c);
  g.lineTo(x + w, y + h - c);
  g.lineTo(x + w - c, y + h);
  g.lineTo(x + c, y + h);
  g.lineTo(x, y + h - c);
  g.lineTo(x, y + c);
  g.closePath();
}

function drawHudPanel(g, x, y, w, h, title, subtitle, tag) {
  const ch = 16;
  // Translucent dark-glass fill
  chamferRect(g, x, y, w, h, ch);
  const bg = g.createLinearGradient(x, y, x, y + h);
  bg.addColorStop(0, 'rgba(5, 17, 34, 0.78)');
  bg.addColorStop(0.5, 'rgba(3, 11, 24, 0.72)');
  bg.addColorStop(1, 'rgba(4, 15, 30, 0.80)');
  g.fillStyle = bg;
  g.fill();

  // Subtle internal coordinate grid
  g.save();
  g.clip();
  g.strokeStyle = 'rgba(0, 240, 255, 0.035)';
  g.lineWidth = 1;
  g.beginPath();
  for (let gx = x + 24; gx < x + w; gx += 24) {
    g.moveTo(gx, y + 34); g.lineTo(gx, y + h);
  }
  for (let gy = y + 34; gy < y + h; gy += 24) {
    g.moveTo(x, gy); g.lineTo(x + w, gy);
  }
  g.stroke();

  // Header band
  const hg = g.createLinearGradient(x, y, x + w, y);
  hg.addColorStop(0, 'rgba(0, 240, 255, 0.18)');
  hg.addColorStop(0.65, 'rgba(0, 168, 255, 0.06)');
  hg.addColorStop(1, 'rgba(0, 240, 255, 0.02)');
  g.fillStyle = hg;
  g.fillRect(x, y, w, 32);
  g.restore();

  // Outer chamfer border
  chamferRect(g, x, y, w, h, ch);
  g.strokeStyle = 'rgba(0, 240, 255, 0.32)';
  g.lineWidth = 1.3;
  g.stroke();

  // Header divider line
  g.strokeStyle = 'rgba(0, 240, 255, 0.28)';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(x, y + 32);
  g.lineTo(x + w, y + 32);
  g.stroke();

  // Glowing corner registration brackets
  g.strokeStyle = C.cyan;
  g.lineWidth = 2.2;
  const bl = 14;
  g.beginPath();
  // Top-left chamfer bracket
  g.moveTo(x, y + ch + bl); g.lineTo(x, y + ch); g.lineTo(x + ch, y); g.lineTo(x + ch + bl, y);
  // Top-right chamfer bracket
  g.moveTo(x + w - ch - bl, y); g.lineTo(x + w - ch, y); g.lineTo(x + w, y + ch); g.lineTo(x + w, y + ch + bl);
  // Bottom-left chamfer bracket
  g.moveTo(x, y + h - ch - bl); g.lineTo(x, y + h - ch); g.lineTo(x + ch, y + h); g.lineTo(x + ch + bl, y + h);
  // Bottom-right chamfer bracket
  g.moveTo(x + w - ch - bl, y + h); g.lineTo(x + w - ch, y + h); g.lineTo(x + w, y + h - ch); g.lineTo(x + w, y + h - ch - bl);
  g.stroke();

  // Header status square & titles
  g.fillStyle = C.cyan;
  g.fillRect(x + 16, y + 11, 6, 10);
  g.fillStyle = 'rgba(0, 240, 255, 0.45)';
  g.fillRect(x + 25, y + 11, 3, 10);

  g.font = `bold 13px ${F_DISP}`;
  g.fillStyle = C.text;
  g.textBaseline = 'middle';
  g.textAlign = 'left';
  g.fillText(title, x + 36, y + 16.5);

  if (subtitle) {
    g.font = `11px ${F_MONO}`;
    g.fillStyle = C.muted;
    g.textAlign = 'right';
    g.fillText(subtitle, x + w - (tag ? 68 : 16), y + 16.5);
  }
  if (tag) {
    const tw = 46;
    g.fillStyle = 'rgba(0, 255, 163, 0.14)';
    g.fillRect(x + w - tw - 12, y + 7, tw, 18);
    g.strokeStyle = 'rgba(0, 255, 163, 0.55)';
    g.lineWidth = 1;
    g.strokeRect(x + w - tw - 12, y + 7, tw, 18);
    g.font = `bold 10px ${F_MONO}`;
    g.fillStyle = C.mint;
    g.textAlign = 'center';
    g.fillText(tag, x + w - tw / 2 - 12, y + 16.5);
  }
}

function prerender() {
  PS = Math.min(2, Math.max(0.5, LW.view.scale || 1));
  const [c, g] = mk(VW, VH);

  // 1. Deep futuristic command-deck backdrop gradient
  const bg = g.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0.00, '#02060c');
  bg.addColorStop(0.35, '#04101f');
  bg.addColorStop(0.50, '#06172b');
  bg.addColorStop(0.65, '#04101f');
  bg.addColorStop(1.00, '#02050a');
  g.fillStyle = bg;
  g.fillRect(0, 0, VW, VH);

  // Volumetric cyan/teal ambient core blooms
  for (const [bx, by, br, col, al] of [
    [CX, CY, 520, '0, 210, 255', 0.16],
    [CX, CY, 260, '0, 255, 200', 0.10],
    [330, 520, 420, '0, 168, 255', 0.08],
    [1590, 520, 420, '0, 168, 255', 0.08],
  ]) {
    const rg = g.createRadialGradient(bx, by, 10, bx, by, br);
    rg.addColorStop(0, `rgba(${col},${al})`);
    rg.addColorStop(0.5, `rgba(${col},${al * 0.35})`);
    rg.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = rg;
    g.fillRect(bx - br, by - br, br * 2, br * 2);
  }

  // 2. Perspective floor & ceiling holographic grids
  g.save();
  g.strokeStyle = 'rgba(0, 240, 255, 0.075)';
  g.lineWidth = 1;
  // Floor perspective lines (y = 780..1080)
  const fy0 = 760;
  g.beginPath();
  for (let i = -24; i <= 24; i++) {
    const xTop = CX + i * 28;
    const xBot = CX + i * 115;
    g.moveTo(xTop, fy0);
    g.lineTo(xBot, VH);
  }
  for (let s = 1; s <= 10; s++) {
    const u = Math.pow(s / 10, 1.65);
    const y = fy0 + (VH - fy0) * u;
    g.moveTo(0, y);
    g.lineTo(VW, y);
  }
  // Ceiling perspective lines (y = 0..240)
  const cy0 = 240;
  for (let i = -24; i <= 24; i++) {
    const xBot = CX + i * 28;
    const xTop = CX + i * 115;
    g.moveTo(xBot, cy0);
    g.lineTo(xTop, 0);
  }
  for (let s = 1; s <= 8; s++) {
    const u = Math.pow(s / 8, 1.65);
    const y = cy0 - cy0 * u;
    g.moveTo(0, y);
    g.lineTo(VW, y);
  }
  g.stroke();

  // Fade out the inner edges of the floor/ceiling grids smoothly
  const fadeMask = g.createLinearGradient(0, 0, 0, VH);
  fadeMask.addColorStop(0.00, 'rgba(2,6,12,0)');
  fadeMask.addColorStop(0.18, 'rgba(4,16,31,0.85)');
  fadeMask.addColorStop(0.24, 'rgba(4,16,31,1)');
  fadeMask.addColorStop(0.70, 'rgba(4,16,31,1)');
  fadeMask.addColorStop(0.76, 'rgba(4,16,31,0.85)');
  fadeMask.addColorStop(1.00, 'rgba(2,5,10,0)');
  g.restore();

  // Subtle concentric range circles around the center core
  g.strokeStyle = 'rgba(0, 240, 255, 0.07)';
  g.lineWidth = 1;
  for (const r of [295, 330, 365]) {
    g.beginPath();
    g.arc(CX, CY, r, 0, TAU);
    g.stroke();
  }
  // Crosshair axis ticks through the center
  g.strokeStyle = 'rgba(0, 240, 255, 0.14)';
  g.beginPath();
  g.moveTo(CX - 345, CY); g.lineTo(CX - 275, CY);
  g.moveTo(CX + 275, CY); g.lineTo(CX + 345, CY);
  g.moveTo(CX, CY - 345); g.lineTo(CX, CY - 275);
  g.moveTo(CX, CY + 275); g.lineTo(CX, CY + 335);
  g.stroke();

  // 3. Top & bottom HUD framing rails
  g.strokeStyle = 'rgba(0, 240, 255, 0.35)';
  g.lineWidth = 1.4;
  g.beginPath();
  g.moveTo(64, 52); g.lineTo(640, 52); g.lineTo(662, 68); g.lineTo(1258, 68); g.lineTo(1280, 52); g.lineTo(VW - 64, 52);
  g.moveTo(64, 1026); g.lineTo(640, 1026); g.lineTo(662, 1012); g.lineTo(1258, 1012); g.lineTo(1280, 1026); g.lineTo(VW - 64, 1026);
  g.stroke();

  // Center top HUD title banner
  chamferRect(g, CX - 250, 40, 500, 34, 10);
  g.fillStyle = 'rgba(4, 16, 32, 0.88)';
  g.fill();
  g.strokeStyle = 'rgba(0, 240, 255, 0.48)';
  g.lineWidth = 1.4;
  g.stroke();
  g.font = `bold 13px ${F_DISP}`;
  g.fillStyle = C.cyan;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('AEGIS // HOLOGRAPHIC TELEMETRY INTERFACE', CX, 57);

  // 4. Left & Right Wing HUD Panels + Lower-Center Bridge Panels
  // Left Wing
  drawHudPanel(g, 64, 82, 524, 474, 'PROCESSOR // CORE BAR ARRAY', 'LOGICAL THREADS', 'LIVE');
  drawHudPanel(g, 64, 574, 524, 424, 'THERMAL & LOAD // WAVEFORM', '60S ROLLING TRACE', 'NOMINAL');

  // Right Wing
  drawHudPanel(g, 1332, 82, 524, 286, 'MEMORY // ALLOCATION MATRIX', 'RAM • CACHE • SWAP', 'DDR');
  drawHudPanel(g, 1332, 384, 524, 286, 'NETWORK // RX-TX SPECTRUM', 'DUPLEX THROUGHPUT', 'LINK');
  drawHudPanel(g, 1332, 686, 524, 312, 'SUBSYSTEMS // ACTIVE TASKS', 'TOP CPU / RSS', 'PROC');

  // Upper-Center Chrono & Core Bus Module (aligns with top of Left & Right wings at y=82)
  drawHudPanel(g, 612, 82, 696, 104, 'CHRONO // CORE TELEMETRY BUS', 'SYNCHRONIZED CLOCK & POWER RAIL', 'SYNC');

  // Lower-Center Telemetry Bridge (3 compact modules below the 3D core)
  drawHudPanel(g, 612, 816, 222, 182, 'LOAD AVG // QUEUE', null, null);
  drawHudPanel(g, 849, 816, 222, 182, 'SYSTEM // UPTIME', null, null);
  drawHudPanel(g, 1086, 816, 222, 182, 'STORAGE // I/O', null, null);

  // Soft edge vignette & scanline texture
  const vg = g.createRadialGradient(CX, CY, 420, CX, CY, 1180);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(1,4,10,0.58)');
  g.fillStyle = vg;
  g.fillRect(0, 0, VW, VH);

  g.fillStyle = 'rgba(0, 0, 0, 0.12)';
  for (let y = 0; y < VH; y += 3) g.fillRect(0, y, VW, 1);

  L.base = c;

  // Glow sprite for holographic nodes
  const [gc, gg] = mk(64, 64);
  const gr = gg.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(230,255,255,1)');
  gr.addColorStop(0.18, 'rgba(0,240,255,0.85)');
  gr.addColorStop(0.5, 'rgba(0,168,255,0.25)');
  gr.addColorStop(1, 'rgba(0,168,255,0)');
  gg.fillStyle = gr;
  gg.fillRect(0, 0, 64, 64);
  L.glow = gc;
}

// ---------------------------------------------------------------------------
// Reusable Holographic Segmented Bar Readout Renderer
// ---------------------------------------------------------------------------
function drawSegmentedBar(ctx, x, y, w, h, pct, segs, opts = {}) {
  const gap = opts.gap ?? 2.5;
  const sw = (w - gap * (segs - 1)) / segs;
  const activeSegs = ( clamp(pct, 0, 100) / 100 ) * segs;
  const peakSeg = opts.peak !== undefined ? Math.min(segs - 1, Math.floor((clamp(opts.peak, 0, 100) / 100) * segs)) : -1;
  const scheme = opts.scheme || 'cpu'; // 'cpu' | 'mem' | 'temp' | 'disk'

  for (let i = 0; i < segs; i++) {
    const sx = x + i * (sw + gap);
    const u = i / segs;
    let col = C.cyan;
    if (scheme === 'cpu' || scheme === 'temp') {
      if (u > 0.82) col = C.coral;
      else if (u > 0.64) col = C.amber;
      else if (u > 0.42) col = C.mint;
      else col = C.cyan;
    } else if (scheme === 'mem') {
      if (u > 0.85) col = C.amber;
      else if (u > 0.55) col = C.mint;
      else col = C.cyan;
    } else if (scheme === 'cache') {
      col = C.azure;
    } else if (scheme === 'disk') {
      col = u > 0.8 ? C.amber : C.mint;
    }

    if (i < Math.floor(activeSegs)) {
      ctx.fillStyle = col;
      ctx.fillRect(sx, y, sw, h);
    } else if (i < activeSegs) {
      const frac = activeSegs - i;
      ctx.fillStyle = 'rgba(0, 240, 255, 0.10)';
      ctx.fillRect(sx, y, sw, h);
      ctx.globalAlpha = 0.35 + 0.65 * frac;
      ctx.fillStyle = col;
      ctx.fillRect(sx, y, sw, h);
      ctx.globalAlpha = 1;
    } else if (i === peakSeg && peakSeg > 0) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx, y, sw, h);
    } else {
      ctx.fillStyle = 'rgba(0, 240, 255, 0.09)';
      ctx.fillRect(sx, y, sw, h);
    }
  }
}

// ---------------------------------------------------------------------------
// Procedural Telemetry Simulation (when not receiving live desktop stats)
// ---------------------------------------------------------------------------
function stepSimulatedTelemetry(t) {
  // Realistic multi-core workload waves with active bursts
  let sum = 0;
  const globalWave = 14 * Math.sin(t * 0.35) + 18 * Math.max(0, Math.sin(t * 0.19 + 0.8)) ** 2;
  for (let i = 0; i < CORE_COUNT; i++) {
    const base = 24 + globalWave + 22 * Math.sin(t * 0.55 + i * 0.9) + 14 * Math.cos(t * 1.25 + i * 1.6);
    const burst = Math.max(0, Math.sin(t * 0.29 + i * 0.65)) ** 3 * 42;
    const v = clamp(base + burst + range(-4, 4), 6, 98);
    T.coreTargets[i] = v;
    if (v > T.corePeaks[i]) T.corePeaks[i] = v;
    sum += v;
  }
  T.cpuTarget = sum / CORE_COUNT;
  T.memTarget = 38.4 + 4.5 * Math.sin(t * 0.08);
  T.memUsedGb = +(T.memTotalGb * T.memTarget / 100).toFixed(2);
  T.cacheTarget = 64.0 + 3.2 * Math.cos(t * 0.05);
  T.swapTarget = 4.2 + 0.6 * Math.sin(t * 0.03);

  T.rxTarget = Math.max(12, 380 + 340 * Math.sin(t * 0.6) + 520 * Math.max(0, Math.sin(t * 0.27 + 1.2)) ** 3 + range(-30, 30));
  T.txTarget = Math.max(6, 95 + 75 * Math.cos(t * 0.52) + 180 * Math.max(0, Math.sin(t * 0.31 + 2.4)) ** 3 + range(-12, 12));

  T.tempTargets.cpu = +(48 + T.cpuTarget * 0.28 + Math.sin(t * 0.2) * 1.5).toFixed(1);
  T.tempTargets.gpu = +(44 + T.cpuTarget * 0.18 + Math.cos(t * 0.17) * 1.2).toFixed(1);
  T.tempTargets.nvme = +(36.0 + Math.sin(t * 0.09) * 0.8).toFixed(1);
  T.tempTargets.sys = +(38.0 + Math.cos(t * 0.11) * 0.6).toFixed(1);

  const l1 = +(0.45 + (T.cpuTarget / 100) * 2.4).toFixed(2);
  const l5 = +(lerp(T.loadTargets[1], l1, 0.15)).toFixed(2);
  const l15 = +(lerp(T.loadTargets[2], l5, 0.08)).toFixed(2);
  T.loadTargets = [l1, l5, l15];

  T.cpuHist.shift();
  T.cpuHist.push(T.cpuTarget);
  T.loadHist.shift();
  T.loadHist.push(clamp((l1 / 4) * 100, 4, 96));

  // Jitter top process CPU percentages slightly
  const names = ['hyprland', 'quickshell', 'livewall.py', 'ghostty', 'chromium', 'btop'];
  const mems = [2.8, 3.9, 1.6, 1.9, 8.4, 0.8];
  T.procs = names.map((name, i) => ({
    pid: 1420 + i * 613,
    name,
    cpu: +(clamp(T.coreTargets[i % CORE_COUNT] * (0.28 - i * 0.035), 0.4, 45)).toFixed(1),
    mem: mems[i],
  })).sort((a, b) => b.cpu - a.cpu);
}

// ---------------------------------------------------------------------------
// Scene lifecycle
// ---------------------------------------------------------------------------
LW.start({
  init() {
    buildSphere();
    for (let i = 0; i < 32; i++) T.memCells[i] = rand();
    for (let i = 0; i < 45; i++) {
      T.motes.push({
        x: range(80, VW - 80), y: range(80, VH - 80),
        vx: range(-8, 8), vy: range(-14, -4),
        r: range(0.8, 2.0), ph: range(0, TAU),
      });
    }
    // Pre-fill history arrays so t=0 has rich waveforms
    for (let i = 0; i < HIST_LEN; i++) {
      stepSimulatedTelemetry(i * 0.5);
      T.rxBins[i % NET_BINS] = clamp(T.rxTarget / 1100, 0.06, 0.96);
      T.txBins[i % NET_BINS] = clamp(T.txTarget / 420, 0.05, 0.92);
    }

    every(0.45, 0.55, () => {
      if (!T.live || LW.time - T.lastPushSimTime > 2.5) {
        T.live = false;
        stepSimulatedTelemetry(LW.time);
      }
      // Shift network spectrum bars
      T.rxBins.shift();
      T.rxBins.push(clamp(Math.log10(1 + T.rxKbs) / 3.4, 0.06, 0.98));
      T.txBins.shift();
      T.txBins.push(clamp(Math.log10(1 + T.txKbs) / 3.0, 0.05, 0.95));
    });

    every(4.5, 9.0, () => { T.pulseRing = 0.001; });
    after(7.2, () => { T.pulseRing = 0.001; });
  },
  resize() { prerender(); },
  update(dt, t) {
    const k = clamp(dt * 5.5, 0, 1);
    T.cpu = lerp(T.cpu, T.cpuTarget, k);
    for (let i = 0; i < CORE_COUNT; i++) {
      T.cores[i] = lerp(T.cores[i], T.coreTargets[i], k);
      T.corePeaks[i] = Math.max(T.cores[i], T.corePeaks[i] - dt * 6.5);
    }
    for (let i = 0; i < T.freqBars.length; i++) {
      const cVal = T.cores[i % CORE_COUNT] / 100;
      const env = 0.25 + 0.55 * cVal + 0.28 * Math.abs(Math.sin(t * 2.4 + i * 0.38)) * Math.cos(t * 1.1 - i * 0.2);
      T.freqBars[i] = lerp(T.freqBars[i], clamp(env, 0.12, 0.96), clamp(dt * 8, 0, 1));
    }
    for (let i = 0; i < T.radialSpec.length; i++) {
      const cVal = T.cores[i % CORE_COUNT] / 100;
      const wave = 0.22 + 0.55 * cVal + 0.23 * Math.abs(Math.sin(t * 2.6 + i * 0.45));
      T.radialSpec[i] = lerp(T.radialSpec[i], clamp(wave, 0.08, 1), clamp(dt * 7, 0, 1));
    }

    T.memPct = lerp(T.memPct, T.memTarget, k);
    T.cachePct = lerp(T.cachePct, T.cacheTarget, k);
    T.swapPct = lerp(T.swapPct, T.swapTarget, k);
    T.rxKbs = lerp(T.rxKbs, T.rxTarget, k);
    T.txKbs = lerp(T.txKbs, T.txTarget, k);

    T.temps.cpu = lerp(T.temps.cpu, T.tempTargets.cpu, k);
    T.temps.gpu = lerp(T.temps.gpu, T.tempTargets.gpu, k);
    T.temps.nvme = lerp(T.temps.nvme, T.tempTargets.nvme, k);
    T.temps.sys = lerp(T.temps.sys, T.tempTargets.sys, k);

    for (let i = 0; i < 3; i++) T.load[i] = lerp(T.load[i], T.loadTargets[i], k);

    T.scanY = (t * 110) % VH;
    if (T.pulseRing > 0) {
      T.pulseRing += dt * 0.55;
      if (T.pulseRing >= 1) T.pulseRing = 0;
    }

    for (const m of T.motes) {
      m.x += (m.vx + Math.sin(t * 0.5 + m.ph) * 4) * dt;
      m.y += m.vy * dt;
      if (m.y < 60) { m.y = VH - 60; m.x = range(80, VW - 80); }
    }
  },
  draw(ctx, t) {
    ctx.drawImage(L.base, 0, 0, VW, VH);

    // Subtle horizontal holographic scan beam sweeping down the screen
    const sg = ctx.createLinearGradient(0, T.scanY - 40, 0, T.scanY + 40);
    sg.addColorStop(0, 'rgba(0, 240, 255, 0)');
    sg.addColorStop(0.5, 'rgba(0, 240, 255, 0.045)');
    sg.addColorStop(1, 'rgba(0, 240, 255, 0)');
    ctx.fillStyle = sg;
    ctx.fillRect(64, T.scanY - 40, VW - 128, 80);

    // Draw Left Wing, Center Core, Right Wing, and Framing Readouts
    drawLeftWing(ctx, t);
    drawCenterCore(ctx, t);
    drawRightWing(ctx, t);
    drawRailTelemetry(ctx, t);

    // Floating data motes
    ctx.globalCompositeOperation = 'lighter';
    for (const m of T.motes) {
      const a = 0.15 + 0.25 * (0.5 + 0.5 * Math.sin(t * 1.4 + m.ph));
      ctx.fillStyle = `rgba(0, 240, 255, ${a})`;
      ctx.fillRect(m.x - m.r, m.y - m.r, m.r * 2, m.r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  },
});

// ---------------------------------------------------------------------------
// Left Wing: Multi-Core Holographic Bar Array + Thermal & Waveform Panel
// ---------------------------------------------------------------------------
function drawLeftWing(ctx, t) {
  const px = 84, pw = 484;

  // --- Panel L1: Multi-Core Bar Readouts ---
  let y = 132;
  for (let i = 0; i < CORE_COUNT; i++) {
    const val = T.cores[i];
    const peak = T.corePeaks[i];

    ctx.font = `bold 12px ${F_MONO}`;
    ctx.fillStyle = val > 75 ? C.amber : C.cyan;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`C0${i}`, px, y + 8);

    // 26-segment holographic bar readout
    drawSegmentedBar(ctx, px + 40, y, pw - 102, 16, val, 26, {
      gap: 2.5,
      peak,
      scheme: 'cpu',
    });

    ctx.font = `bold 12px ${F_MONO}`;
    ctx.fillStyle = C.text;
    ctx.textAlign = 'right';
    ctx.fillText(`${val.toFixed(1).padStart(4, ' ')}%`, px + pw, y + 8);

    y += 32;
  }

  // Sub-divider inside Panel L1
  y += 6;
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px, y);
  ctx.lineTo(px + pw, y);
  ctx.stroke();

  ctx.font = `11px ${F_MONO}`;
  ctx.fillStyle = C.muted;
  ctx.textAlign = 'left';
  ctx.fillText('THREAD HARMONIC DISTRIBUTION // 32 CHANNELS', px, y + 16);
  ctx.fillStyle = C.cyan;
  ctx.textAlign = 'right';
  ctx.fillText(`AVG ${T.cpu.toFixed(1)}%`, px + pw, y + 16);

  // 32-column vertical holographic frequency/thread bar array
  const bx0 = px, by0 = y + 30, bw = pw, bh = 112;
  const cols = T.freqBars.length, gap = 3;
  const cw = (bw - gap * (cols - 1)) / cols;
  const vSegs = 10, vGap = 2, sh = (bh - vGap * (vSegs - 1)) / vSegs;
  for (let c = 0; c < cols; c++) {
    const active = T.freqBars[c] * vSegs;
    const cx = bx0 + c * (cw + gap);
    for (let s = 0; s < vSegs; s++) {
      const sy = by0 + bh - (s + 1) * sh - s * vGap;
      if (s < Math.floor(active)) {
        ctx.fillStyle = s >= 8 ? C.amber : s >= 5 ? C.mint : C.cyan;
      } else {
        ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
      }
      ctx.fillRect(cx, sy, cw, sh);
    }
  }

  // --- Panel L2: Thermal Bar Readouts & Rolling Load Waveform ---
  const tSensors = [
    ['CPU PKG', T.temps.cpu, 30, 95],
    ['WIFI PHY', T.temps.gpu, 25, 85],
    ['NVME SSD', T.temps.nvme, 25, 75],
    ['SYS PCH', T.temps.sys, 25, 80],
  ];
  let ty = 620;
  for (const [label, temp, minT, maxT] of tSensors) {
    const pct = ((temp - minT) / (maxT - minT)) * 100;
    ctx.font = `12px ${F_MONO}`;
    ctx.fillStyle = C.text;
    ctx.textAlign = 'left';
    ctx.fillText(label, px, ty + 7);

    drawSegmentedBar(ctx, px + 84, ty, pw - 150, 13, pct, 22, {
      gap: 2.2,
      scheme: 'temp',
    });

    ctx.font = `bold 12px ${F_MONO}`;
    ctx.fillStyle = temp > 75 ? C.amber : C.cyan;
    ctx.textAlign = 'right';
    ctx.fillText(`${temp.toFixed(1)}°C`, px + pw, ty + 7);
    ty += 28;
  }

  // Rolling 60s CPU & Load Dual-Trace Graph
  const gx = px, gy = 748, gw = pw, gh = 228;
  ctx.fillStyle = 'rgba(2, 8, 18, 0.65)';
  ctx.fillRect(gx, gy, gw, gh);
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.22)';
  ctx.lineWidth = 1;
  ctx.strokeRect(gx, gy, gw, gh);

  // Graph grid lines
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.07)';
  ctx.beginPath();
  for (let i = 1; i < 4; i++) {
    const ly = gy + (gh * i) / 4;
    ctx.moveTo(gx, ly); ctx.lineTo(gx + gw, ly);
  }
  for (let i = 1; i < 8; i++) {
    const lx = gx + (gw * i) / 8;
    ctx.moveTo(lx, gy); ctx.lineTo(lx, gy + gh);
  }
  ctx.stroke();

  const plotTrace = (arr, strokeCol, fillTop, fillBot) => {
    ctx.beginPath();
    for (let i = 0; i < arr.length; i++) {
      const x = gx + (i / (arr.length - 1)) * gw;
      const y = gy + gh - (clamp(arr[i], 0, 100) / 100) * (gh - 24) - 6;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.lineTo(gx + gw, gy + gh);
    ctx.lineTo(gx, gy + gh);
    ctx.closePath();
    const fg = ctx.createLinearGradient(0, gy, 0, gy + gh);
    fg.addColorStop(0, fillTop);
    fg.addColorStop(1, fillBot);
    ctx.fillStyle = fg;
    ctx.fill();
  };

  plotTrace(T.loadHist, C.mint, 'rgba(0, 255, 163, 0.22)', 'rgba(0, 255, 163, 0.0)');
  plotTrace(T.cpuHist, C.cyan, 'rgba(0, 240, 255, 0.30)', 'rgba(0, 240, 255, 0.0)');

  // Legend inside graph
  ctx.font = `11px ${F_MONO}`;
  ctx.textAlign = 'left';
  ctx.fillStyle = C.cyan;
  ctx.fillText(`■ CPU UTIL (${T.cpu.toFixed(1)}%)`, gx + 12, gy + 16);
  ctx.fillStyle = C.mint;
  ctx.fillText(`■ SYS LOAD (${T.load[0].toFixed(2)})`, gx + 185, gy + 16);
}

// ---------------------------------------------------------------------------
// Centerpiece: 3D Geodesic Reactor Core, Dual Arc Bar Gauges & Lower Bridge
// ---------------------------------------------------------------------------
function drawCenterCore(ctx, t) {
  // --- Upper-Center Chrono & Core Telemetry Bus (612..1308, y = 82..186) ---
  {
    const ux = 630, uw = 660;
    const freqGhz = (3.4 + (T.cpu / 100) * 1.7).toFixed(2);
    const pwrPct = clamp(28 + T.cpu * 0.68, 12, 98);

    // Left block: Core Clock Frequency
    ctx.font = `11px ${F_MONO}`;
    ctx.fillStyle = C.muted;
    ctx.textAlign = 'left';
    ctx.fillText('CLOCK // FREQ', ux, 130);
    ctx.font = `bold 13px ${F_MONO}`;
    ctx.fillStyle = C.cyan;
    ctx.fillText(`${freqGhz} GHz`, ux + 102, 130);
    drawSegmentedBar(ctx, ux, 144, 190, 14, ((Number(freqGhz) - 2.4) / 2.8) * 100, 16, {
      gap: 2.2,
      scheme: 'cpu',
    });

    // Center block: Synchronized Mission / System Clock
    const secTot = Math.floor(16 * 3600 + 42 * 60 + t);
    const hh = String(Math.floor(secTot / 3600) % 24).padStart(2, '0');
    const mm = String(Math.floor((secTot % 3600) / 60)).padStart(2, '0');
    const ss = String(secTot % 60).padStart(2, '0');
    const ms = String(Math.floor((t % 1) * 100)).padStart(2, '0');

    chamferRect(ctx, CX - 118, 120, 236, 52, 8);
    ctx.fillStyle = 'rgba(2, 9, 20, 0.78)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.36)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.font = `bold 22px ${F_DISP}`;
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText(`${hh}:${mm}:${ss}.${ms}`, CX, 142);
    ctx.font = `10px ${F_MONO}`;
    ctx.fillStyle = C.mint;
    ctx.fillText(`TELEMETRY BUS // ${T.live ? 'LIVE HARDWARE' : 'ACTIVE SIM'}`, CX, 160);

    // Right block: Power & Bus Load
    const rx0 = ux + uw - 190;
    ctx.font = `11px ${F_MONO}`;
    ctx.fillStyle = C.muted;
    ctx.textAlign = 'left';
    ctx.fillText('POWER // TDP', rx0, 130);
    ctx.font = `bold 13px ${F_MONO}`;
    ctx.fillStyle = C.mint;
    ctx.textAlign = 'right';
    ctx.fillText(`${pwrPct.toFixed(0)}%`, ux + uw, 130);
    drawSegmentedBar(ctx, rx0, 144, 190, 14, pwrPct, 16, {
      gap: 2.2,
      scheme: 'mem',
    });
  }

  ctx.save();
  ctx.translate(CX, CY);

  // Expanding sonar pulse ring
  if (T.pulseRing > 0) {
    const pr = 110 + T.pulseRing * 220;
    ctx.strokeStyle = `rgba(0, 240, 255, ${(1 - T.pulseRing) * 0.45})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, pr, 0, TAU);
    ctx.stroke();
  }

  // 1. Outer rotating azimuth ring (r = 258)
  ctx.save();
  ctx.rotate(-t * 0.045);
  const R_OUT = 258;
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.32)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(0, 0, R_OUT, 0, TAU);
  ctx.stroke();

  for (let i = 0; i < 72; i++) {
    const a = (i / 72) * TAU;
    const major = i % 6 === 0;
    const r0 = R_OUT - (major ? 10 : 5);
    ctx.strokeStyle = major ? C.cyan : 'rgba(0, 240, 255, 0.35)';
    ctx.lineWidth = major ? 1.8 : 1;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
    ctx.lineTo(Math.cos(a) * R_OUT, Math.sin(a) * R_OUT);
    ctx.stroke();
  }
  ctx.restore();

  // 2. Dual Segmented Circular Arc Bar Gauges (r = 216..234)
  // Left Arc: CPU Load % (from bottom-left 128° to top-left 232°)
  // Right Arc: Memory % (from bottom-right 52° to top-right -52°)
  const arcSegs = 28;
  const drawArcGauge = (aStart, aEnd, pct, scheme) => {
    const active = (clamp(pct, 0, 100) / 100) * arcSegs;
    const step = (aEnd - aStart) / arcSegs;
    const pad = step * 0.22;
    for (let i = 0; i < arcSegs; i++) {
      const a0 = aStart + i * step + pad * 0.5;
      const a1 = aStart + (i + 1) * step - pad * 0.5;
      const u = i / arcSegs;
      let col = C.cyan;
      if (scheme === 'cpu') {
        col = u > 0.82 ? C.coral : u > 0.62 ? C.amber : u > 0.38 ? C.mint : C.cyan;
      } else {
        col = u > 0.82 ? C.amber : u > 0.45 ? C.mint : C.cyan;
      }
      ctx.beginPath();
      ctx.arc(0, 0, 224, a0, a1, aEnd < aStart);
      ctx.strokeStyle = i < active ? col : 'rgba(0, 240, 255, 0.10)';
      ctx.lineWidth = 14;
      ctx.stroke();
    }
  };

  drawArcGauge((128 * Math.PI) / 180, (232 * Math.PI) / 180, T.cpu, 'cpu');
  drawArcGauge((52 * Math.PI) / 180, (-52 * Math.PI) / 180, T.memPct, 'mem');

  // Arc gauge callout labels
  ctx.font = `bold 13px ${F_DISP}`;
  ctx.fillStyle = C.cyan;
  ctx.textAlign = 'center';
  ctx.fillText(`CPU LOAD // ${T.cpu.toFixed(1)}%`, 0, -276);
  ctx.fillStyle = C.mint;
  ctx.fillText(`MEM ALLOC // ${T.memPct.toFixed(1)}%`, 0, 282);

  // 3. Counter-rotating inner gimbal rings (r = 186, r = 162)
  ctx.save();
  ctx.rotate(t * 0.12);
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.42)';
  ctx.lineWidth = 2;
  for (let k = 0; k < 4; k++) {
    const a = (k * Math.PI) / 2;
    ctx.beginPath();
    ctx.arc(0, 0, 186, a + 0.12, a + 1.15);
    ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.rotate(-t * 0.18);
  ctx.setLineDash([6, 8]);
  ctx.strokeStyle = 'rgba(0, 255, 163, 0.38)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, 162, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // 4. Radial 48-bar Holographic Spectrum Analyzer around the 3D sphere (r = 118..150)
  const nSpec = T.radialSpec.length;
  for (let i = 0; i < nSpec; i++) {
    const a = (i / nSpec) * TAU - Math.PI / 2;
    const len = 6 + T.radialSpec[i] * 26;
    const r0 = 118, r1 = r0 + len;
    ctx.strokeStyle = T.radialSpec[i] > 0.72 ? C.mint : C.cyan;
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
    ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.stroke();
  }

  // 5. 3D Wireframe Geodesic Sphere Core (r = 104)
  const R_SPH = 104;
  const ry = t * 0.32, rx = 0.38 + Math.sin(t * 0.15) * 0.12;
  const cy = Math.cos(ry), sy = Math.sin(ry);
  const cx = Math.cos(rx), sx = Math.sin(rx);

  const proj = T.sphereVerts.map(([vx, vy, vz]) => {
    const x1 = vx * cy - vz * sy;
    const z1 = vx * sy + vz * cy;
    const y2 = vy * cx - z1 * sx;
    const z2 = vy * sx + z1 * cx;
    const persp = 1 / (1 - z2 * 0.22);
    return [x1 * R_SPH * persp, y2 * R_SPH * persp, z2];
  });

  // Back hemisphere edges
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(0, 180, 255, 0.16)';
  ctx.beginPath();
  for (const [i, j] of T.sphereEdges) {
    if (proj[i][2] + proj[j][2] < 0) {
      ctx.moveTo(proj[i][0], proj[i][1]);
      ctx.lineTo(proj[j][0], proj[j][1]);
    }
  }
  ctx.stroke();

  // Glowing core nucleus
  ctx.globalCompositeOperation = 'lighter';
  const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 88);
  cg.addColorStop(0, 'rgba(180, 255, 255, 0.42)');
  cg.addColorStop(0.45, 'rgba(0, 240, 255, 0.18)');
  cg.addColorStop(1, 'rgba(0, 168, 255, 0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(0, 0, 88, 0, TAU);
  ctx.fill();

  // Front hemisphere edges & vertices
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.58)';
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  for (const [i, j] of T.sphereEdges) {
    if (proj[i][2] + proj[j][2] >= 0) {
      ctx.moveTo(proj[i][0], proj[i][1]);
      ctx.lineTo(proj[j][0], proj[j][1]);
    }
  }
  ctx.stroke();

  for (const [px, py, pz] of proj) {
    if (pz > 0.15) {
      ctx.fillStyle = 'rgba(200, 255, 255, 0.85)';
      ctx.fillRect(px - 1.5, py - 1.5, 3, 3);
    }
  }

  // Center digital readout overlay inside the sphere
  ctx.globalCompositeOperation = 'source-over';
  chamferRect(ctx, -64, -24, 128, 48, 8);
  ctx.fillStyle = 'rgba(2, 10, 22, 0.82)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.65)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  ctx.font = `bold 20px ${F_DISP}`;
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`${T.cpu.toFixed(0)}%`, 0, -4);
  ctx.font = `10px ${F_MONO}`;
  ctx.fillStyle = C.cyan;
  ctx.fillText('CORE UTILIZATION', 0, 14);

  ctx.restore();

  // --- Lower-Center 3 Telemetry Bridge Modules (y = 816..998) ---
  // Module 1: Load Average (612..834)
  {
    const mx = 628, my = 860, mw = 190;
    const labels = ['1M', '5M', '15M'];
    for (let i = 0; i < 3; i++) {
      const ry = my + i * 32;
      const lv = T.load[i];
      const pct = clamp((lv / (CORE_COUNT * 0.75)) * 100, 3, 100);
      ctx.font = `bold 11px ${F_MONO}`;
      ctx.fillStyle = C.muted;
      ctx.textAlign = 'left';
      ctx.fillText(labels[i], mx, ry + 7);
      drawSegmentedBar(ctx, mx + 34, ry, 104, 13, pct, 12, { gap: 2, scheme: 'cpu' });
      ctx.fillStyle = C.text;
      ctx.textAlign = 'right';
      ctx.fillText(lv.toFixed(2), mx + mw, ry + 7);
    }
    ctx.font = `11px ${F_MONO}`;
    ctx.fillStyle = C.mint;
    ctx.textAlign = 'left';
    ctx.fillText(`TASKS // ${T.tasks}`, mx, 972);
  }

  // Module 2: System Uptime & Node Info (849..1071)
  {
    const mx = 865, mw = 190;
    const up = Math.floor(T.uptimeBase + t);
    const d = Math.floor(up / 86400);
    const h = Math.floor((up % 86400) / 3600);
    const m = Math.floor((up % 3600) / 60);
    const s = up % 60;
    const pad2 = (n) => String(n).padStart(2, '0');

    ctx.font = `bold 18px ${F_DISP}`;
    ctx.fillStyle = C.cyan;
    ctx.textAlign = 'center';
    ctx.fillText(`${pad2(d)}D ${pad2(h)}:${pad2(m)}:${pad2(s)}`, 960, 876);

    ctx.font = `11px ${F_MONO}`;
    ctx.fillStyle = C.text;
    ctx.textAlign = 'left';
    ctx.fillText(`HOST   // ${T.host}`, mx, 912);
    ctx.fillText(`KERNEL // ${T.kernel}`, mx, 934);
    ctx.fillStyle = T.live ? C.mint : C.cyan;
    ctx.fillText(`SOURCE // ${T.live ? 'LIVE /PROC' : 'SIM-ENGINE'}`, mx, 956);
    drawSegmentedBar(ctx, mx, 970, mw, 8, ((t * 18) % 100), 18, { gap: 2, scheme: 'mem' });
  }

  // Module 3: Root Storage & I/O (1086..1308)
  {
    const mx = 1102, mw = 190;
    ctx.font = `11px ${F_MONO}`;
    ctx.fillStyle = C.text;
    ctx.textAlign = 'left';
    ctx.fillText('ROOT FS (/)', mx, 868);
    ctx.fillStyle = C.mint;
    ctx.textAlign = 'right';
    ctx.fillText(`${T.diskPct.toFixed(1)}%`, mx + mw, 868);

    drawSegmentedBar(ctx, mx, 882, mw, 16, T.diskPct, 18, { gap: 2.2, scheme: 'disk' });

    ctx.font = `11px ${F_MONO}`;
    ctx.fillStyle = C.muted;
    ctx.textAlign = 'left';
    ctx.fillText(`USED:  ${T.diskUsedGb.toFixed(1)} GB`, mx, 922);
    ctx.fillText(`TOTAL: ${T.diskTotalGb.toFixed(1)} GB`, mx, 942);
    ctx.fillStyle = C.cyan;
    ctx.fillText('NVME // GEN4 X4 OK', mx, 972);
  }
}

// ---------------------------------------------------------------------------
// Right Wing: Memory Matrix, Network Spectrum & Process Telemetry Table
// ---------------------------------------------------------------------------
function drawRightWing(ctx, t) {
  const px = 1352, pw = 484;

  // --- Panel R1: Memory & Cache Segmented Bars + Page Allocation Matrix ---
  const memRows = [
    ['PHYSICAL RAM', `${T.memUsedGb.toFixed(2)} / ${T.memTotalGb.toFixed(1)} GB`, T.memPct, 'mem'],
    ['BUFFER / CACHE', `${(T.memTotalGb * T.cachePct / 100).toFixed(1)} GB CACHED`, T.cachePct, 'cache'],
    ['VIRTUAL SWAP', `${T.swapPct.toFixed(1)}% ALLOCATED`, T.swapPct, 'disk'],
  ];
  let my = 132;
  for (const [label, sub, pct, scheme] of memRows) {
    ctx.font = `bold 11px ${F_MONO}`;
    ctx.fillStyle = C.text;
    ctx.textAlign = 'left';
    ctx.fillText(label, px, my);
    ctx.fillStyle = C.muted;
    ctx.fillText(sub, px + 145, my);
    ctx.fillStyle = C.cyan;
    ctx.textAlign = 'right';
    ctx.fillText(`${pct.toFixed(1)}%`, px + pw, my);

    drawSegmentedBar(ctx, px, my + 10, pw, 14, pct, 30, { gap: 2.5, scheme });
    my += 48;
  }

  // 32-cell Holographic Memory Bank Block Visualization
  ctx.font = `11px ${F_MONO}`;
  ctx.fillStyle = C.muted;
  ctx.textAlign = 'left';
  ctx.fillText('PAGE BANK MATRIX // ACTIVE & CACHED BLOCKS', px, my + 8);
  const usedCells = Math.round((T.memPct / 100) * 32);
  const cacheCells = Math.min(32 - usedCells, Math.round((T.cachePct / 100) * 16));
  const cellW = (pw - 31 * 3) / 32;
  for (let i = 0; i < 32; i++) {
    const cx = px + i * (cellW + 3);
    const cy = my + 20;
    if (i < usedCells) {
      const pulse = 0.75 + 0.25 * Math.sin(t * 3 + i * 0.5);
      ctx.fillStyle = `rgba(0, 240, 255, ${pulse})`;
    } else if (i < usedCells + cacheCells) {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.38)';
    } else {
      ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
    }
    ctx.fillRect(cx, cy, cellW, 24);
  }

  // --- Panel R2: Network RX/TX Mirrored Spectrum Bar Readout ---
  const ny = 434;
  const fmtRate = (kbs) => (kbs >= 1024 ? `${(kbs / 1024).toFixed(2)} MB/S` : `${kbs.toFixed(1)} KB/S`);

  ctx.font = `bold 12px ${F_MONO}`;
  ctx.textAlign = 'left';
  ctx.fillStyle = C.cyan;
  ctx.fillText(`▼ RX DOWNLINK: ${fmtRate(T.rxKbs)}`, px, ny);
  ctx.fillStyle = C.mint;
  ctx.fillText(`▲ TX UPLINK:   ${fmtRate(T.txKbs)}`, px + 230, ny);
  ctx.fillStyle = C.muted;
  ctx.textAlign = 'right';
  ctx.fillText(`[${T.iface.toUpperCase()}]`, px + pw, ny);

  // Bidirectional 28-column segmented holographic spectrum equalizer
  const sx0 = px, sy0 = ny + 18, sw = pw, sh = 196;
  const midY = sy0 + sh / 2;
  ctx.fillStyle = 'rgba(2, 8, 18, 0.65)';
  ctx.fillRect(sx0, sy0, sw, sh);
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.22)';
  ctx.lineWidth = 1;
  ctx.strokeRect(sx0, sy0, sw, sh);

  // Zero-axis center line
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.45)';
  ctx.beginPath();
  ctx.moveTo(sx0, midY);
  ctx.lineTo(sx0 + sw, midY);
  ctx.stroke();

  const bCols = NET_BINS, bGap = 3.5;
  const bWidth = (sw - 16 - bGap * (bCols - 1)) / bCols;
  const halfSegs = 8, sGap = 2, segH = (sh / 2 - 10 - sGap * (halfSegs - 1)) / halfSegs;

  for (let i = 0; i < bCols; i++) {
    const bx = sx0 + 8 + i * (bWidth + bGap);
    const rxAct = T.rxBins[i] * halfSegs;
    const txAct = T.txBins[i] * halfSegs;
    // Upper RX bars (cyan)
    for (let s = 0; s < halfSegs; s++) {
      const by = midY - 4 - (s + 1) * segH - s * sGap;
      ctx.fillStyle = s < rxAct
        ? (s >= 6 ? C.mint : C.cyan)
        : 'rgba(0, 240, 255, 0.07)';
      ctx.fillRect(bx, by, bWidth, segH);
    }
    // Lower TX bars (mint/amber)
    for (let s = 0; s < halfSegs; s++) {
      const by = midY + 4 + s * (segH + sGap);
      ctx.fillStyle = s < txAct
        ? (s >= 6 ? C.amber : C.mint)
        : 'rgba(0, 255, 163, 0.06)';
      ctx.fillRect(bx, by, bWidth, segH);
    }
  }

  // --- Panel R3: Active Subsystems / Process Telemetry Table ---
  let py = 738;
  ctx.font = `bold 11px ${F_MONO}`;
  ctx.fillStyle = C.muted;
  ctx.textAlign = 'left';
  ctx.fillText('PID', px, py);
  ctx.fillText('SUBSYSTEM', px + 68, py);
  ctx.textAlign = 'right';
  ctx.fillText('CPU%', px + 258, py);
  ctx.fillText('MEM%', px + 322, py);
  ctx.textAlign = 'left';
  ctx.fillText('ACTIVITY BAR', px + 342, py);

  ctx.strokeStyle = 'rgba(0, 240, 255, 0.20)';
  ctx.beginPath();
  ctx.moveTo(px, py + 10);
  ctx.lineTo(px + pw, py + 10);
  ctx.stroke();

  py += 30;
  for (let i = 0; i < Math.min(6, T.procs.length); i++) {
    const p = T.procs[i];
    if (i % 2 === 0) {
      ctx.fillStyle = 'rgba(0, 240, 255, 0.04)';
      ctx.fillRect(px - 4, py - 13, pw + 8, 26);
    }
    ctx.font = `12px ${F_MONO}`;
    ctx.fillStyle = C.muted;
    ctx.textAlign = 'left';
    ctx.fillText(String(p.pid).padStart(5, ' '), px, py);

    ctx.fillStyle = C.text;
    ctx.fillText(String(p.name).slice(0, 14), px + 68, py);

    ctx.fillStyle = p.cpu > 15 ? C.amber : C.cyan;
    ctx.textAlign = 'right';
    ctx.fillText(`${Number(p.cpu).toFixed(1)}%`, px + 258, py);

    ctx.fillStyle = C.mint;
    ctx.fillText(`${Number(p.mem).toFixed(1)}%`, px + 322, py);

    drawSegmentedBar(ctx, px + 342, py - 6, pw - 342, 12, clamp(p.cpu * 2.5 + p.mem * 3, 6, 100), 12, {
      gap: 2,
      scheme: 'cpu',
    });

    py += 36;
  }
}

// ---------------------------------------------------------------------------
// Top & Bottom Framing Rail Telemetry
// ---------------------------------------------------------------------------
function drawRailTelemetry(ctx, t) {
  ctx.font = `11px ${F_MONO}`;
  ctx.textBaseline = 'middle';

  // Top-left & top-right rail readouts
  ctx.fillStyle = C.cyan;
  ctx.textAlign = 'left';
  ctx.fillText(`SYS.NODE // ${T.host} [OMARCHY // HYPRLAND]`, 74, 40);
  ctx.textAlign = 'right';
  ctx.fillStyle = T.live ? C.mint : C.cyan;
  ctx.fillText(`TELEMETRY // ${T.live ? 'LIVE KERNEL STREAM' : 'AUTONOMOUS SIM-LINK'}`, VW - 74, 40);

  // Bottom rail hex stream & coordinates
  const hex = ((Math.floor(t * 30) * 0x45d9f3b) >>> 0).toString(16).toUpperCase().padStart(8, '0');
  ctx.fillStyle = C.muted;
  ctx.textAlign = 'left';
  ctx.fillText(`MEM.ADDR // 0x${hex}  •  SYNC // 60.0 HZ`, 74, 1042);
  ctx.textAlign = 'right';
  ctx.fillText('AEGIS TACTICAL DISPLAY // REV 4.2', VW - 74, 1042);
}

<!doctype html>

<canvas id="scene"></canvas>
<script>
// ============================================================================
// livewall runtime — copy this block unchanged into every scene.
//
// Scene contract:
//   * Self-contained single file. No network requests, no external assets.
//   * Draw in a virtual 1920x1080 space; the runtime scales it to "cover".
//   * Put ALL timing in update(dt) / sim-time timers (after/every). Never use
//     setTimeout/setInterval for animation — those keep running while paused
//     and break ?still rendering.
//   * Use rand() (seeded) instead of Math.random().
//
// URL params:  ?fps=30      frame cap (host passes 30; default 60)
//              ?seed=123    deterministic randomness
//              ?still=1&t=8 simulate 8s of scene time, draw one frame, stop
//                           (used to generate theme background stills)
// Host API:    window.livewall.pause() / resume() / paused
// ============================================================================
const LW = (() => {
  const params = new URLSearchParams(location.search);
  const VW = 1920, VH = 1080;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let seed = (Number(params.get('seed')) || (Date.now() % 2147483647)) >>> 0;
  function rand() { // mulberry32
    seed = (seed + 0x6D2B79F5) >>> 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const range = (a, b) => a + rand() * (b - a);
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];

  // sim-time scheduler
  let simTime = 0;
  const timers = [];
  function after(sec, fn) { timers.push({ at: simTime + sec, fn }); }
  function every(minSec, maxSec, fn) {
    const go = () => { fn(); after(range(minSec, maxSec), go); };
    after(range(minSec, maxSec), go);
  }
  function runTimers() {
    for (let i = timers.length - 1; i >= 0; i--) {
      if (timers[i].at <= simTime) { const t = timers.splice(i, 1)[0]; t.fn(); }
    }
  }

  const view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
  function resize() {
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);
    view.w = Math.round(innerWidth * view.dpr);
    view.h = Math.round(innerHeight * view.dpr);
    canvas.width = view.w; canvas.height = view.h;
    view.scale = Math.max(view.w / VW, view.h / VH);
    view.ox = (view.w - VW * view.scale) / 2;
    view.oy = (view.h - VH * view.scale) / 2;
    if (scene.resize) scene.resize(view);
    drawFrame();
  }

  let scene = null, paused = false, last = 0, raf = 0;
  const fps = Math.max(1, Number(params.get('fps')) || 60);
  const still = params.has('still');

  function step(dt) { simTime += dt; runTimers(); scene.update(dt, simTime); }
  function drawFrame() {
    if (!scene) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, view.w, view.h);
    ctx.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
    scene.draw(ctx, simTime);
  }
  function loop(now) {
    raf = 0;
    if (paused) return;
    raf = requestAnimationFrame(loop);
    if (!last) { last = now; return; }
    const elapsed = now - last;
    if (elapsed < 1000 / fps - 2) return;
    last = now;
    step(Math.min(elapsed / 1000, 0.1));
    drawFrame();
  }
  function pause() { paused = true; if (raf) cancelAnimationFrame(raf); raf = 0; }
  function resume() { if (still) return; paused = false; last = 0; if (!raf) raf = requestAnimationFrame(loop); }

  function start(s) {
    scene = s;
    if (scene.init) scene.init(view);
    addEventListener('resize', resize);
    resize();
    if (still) {
      const T = Number(params.get('t')) || 8;
      while (simTime < T) step(1 / 30);
      drawFrame();
      document.title += ' [still]';
      return;
    }
    document.addEventListener('visibilitychange', () => document.hidden ? pause() : resume());
    resume();
  }

  window.livewall = { pause, resume, get paused() { return paused; } };
  return { VW, VH, ctx, rand, range, pick, after, every, start, view,
           get time() { return simTime; } };
})();
// ============================== end runtime =================================

// ---- scene: Helldivers — Orbital Super Destroyer Squadron ------------------
// Scaled for vast orbital depth (elements 30-45% smaller), richly textured
// multi-bevel hull plating with Aztek greebles, and dynamic Super Destroyers +
// Eagle/Pelican dropships warping and flying in and out of the combat zone.
const { VW, VH, rand, range, pick, after, every } = LW;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

function mkRng(s) {
  s >>>= 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}
function poly(g, pts) {
  g.beginPath();
  g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.closePath();
}

// Fine-scale craggy planetary ridgelines (lower profile for deeper orbital scale)
const jagged = (x, s) =>
  Math.sin(x * 0.015 + s) * 0.52 +
  Math.sin(x * 0.036 + s * 2.1) * 0.28 +
  Math.abs(Math.cos(x * 0.062 + s * 3.7)) * 0.20 +
  Math.sin(x * 0.12 + s * 1.3) * 0.08;

const distMesa = (x) =>
  818 - 26 * Math.exp(-(((x - 310) / 180) ** 2))
      - 34 * Math.exp(-(((x - 1540) / 220) ** 2))
      - 18 * Math.exp(-(((x - 890) / 150) ** 2))
      + 15 * jagged(x, 0.8);

const farRidge = (x) =>
  856 - 28 * Math.exp(-(((x - 640) / 160) ** 2))
      - 24 * Math.exp(-(((x - 1340) / 140) ** 2))
      + 16 * jagged(x, 2.4);

const midRidge = (x) =>
  898 - 22 * Math.exp(-(((x - 230) / 150) ** 2))
      - 26 * Math.exp(-(((x - 1690) / 170) ** 2))
      + 14 * jagged(x, 4.1);

const nearRidge = (x) =>
  946 - 32 * Math.exp(-(((x - 95) / 135) ** 2))
      - 38 * Math.exp(-(((x - 1835) / 145) ** 2))
      + 11 * jagged(x, 5.7);

//Ringed planet in upper-left sky (reduced ~38% for vast orbital scale)
const PLANET = { x: 300, y: 235, r: 92, tilt: -0.24 };

// Flagship Super Destroyer (reduced ~42% from k=0.88 to k=0.52)
const SHIP = { x: 810, y: 128, k: 0.52, ox: 50, oy: 70 };
const shipPt = (px, py, bob = 0, sObj = SHIP) => [
  sObj.x + (px - SHIP.ox) * sObj.k,
  sObj.y + (py - SHIP.oy) * sObj.k + bob,
];
const EMIT = [468, 286];
const POD_BAYS = [[360, 238], [414, 240], [468, 242]];
const ENGINES = [
  [54, 152, 1.15],
  [50, 170, 1.0],
  [48, 200, 1.15],
  [52, 232, 1.0],
  [56, 250, 0.9],
];
const LIGHTS = [
  { p: [188, 76], c: '130,205,255', rate: 0.55, ph: 0.0 },
  { p: [338, 70], c: '130,205,255', rate: 0.42, ph: 1.7 },
  { p: [565, 86], c: '130,205,255', rate: 0.48, ph: 0.9 },
  { p: [288, 92], c: '255,75,60', rate: 0.85, ph: 0.4 },
  { p: [425, 82], c: '255,75,60', rate: 0.75, ph: 2.2 },
  { p: [1238, 86], c: '255,75,60', rate: 0.68, ph: 1.4 },
];
const PORTS = [
  [218, 174], [220, 238],
  [526, 194], [526, 254],
];

const layers = {};

// ---------------------------------------------------------------------------
// High-Detail Textured Super Destroyer Renderer
// Multi-faceted 3/4 perspective armor plates, Aztek hull paneling, embossed
// rivet/seam lines, recessed trenches, glowing deck ports, and weathering.
// ---------------------------------------------------------------------------
const HULL_SIL = {
  neck: [195, 112, 315, 108, 315, 258, 205, 250],
  midTop: [275, 108, 345, 92, 540, 104, 575, 118, 575, 175, 270, 165],
  midBay: [262, 160, 560, 172, 552, 266, 480, 282, 320, 272, 252, 236],
  rearUpper: [548, 114, 1246, 152, 1258, 166, 1256, 210, 548, 182],
  rearLower: [548, 178, 1272, 204, 1270, 240, 1185, 244, 690, 216, 548, 208],
  prowTop: [96, 94, 242, 98, 198, 184, 52, 178],
  prowNose: [46, 177, 224, 184, 224, 228, 46, 219],
  prowBot: [56, 218, 200, 226, 262, 306, 132, 294],
};

function drawShipSilhouette(g, fn) {
  for (const [k, pts] of Object.entries(HULL_SIL)) fn(k, pts);
}

// Procedural Aztek armor plating & embossed seam generator inside a clipped hull section
function paintArmorTexture(g, x0, y0, w, h, seed, tilt = 0.04) {
  const R = mkRng(seed);
  g.save();
  // 1. Subtle multi-tone Aztek gunmetal armor patches
  const nPatches = Math.floor((w * h) / 750);
  for (let i = 0; i < nPatches; i++) {
    const px = x0 + R() * w;
    const py = y0 + R() * h;
    const pw = 14 + R() * 48;
    const ph = 6 + R() * 18;
    const dy = pw * tilt;
    const light = R() < 0.45;
    g.fillStyle = light
      ? `rgba(215, 225, 235, ${0.025 + R() * 0.045})`
      : `rgba(8, 10, 13, ${0.08 + R() * 0.14})`;
    poly(g, [px, py, px + pw, py + dy, px + pw - 2, py + ph + dy, px - 2, py + ph]);
    g.fill();
  }

  // 2. Embossed transverse hull ribs (1px dark groove + 1px light bevel)
  const stepX = 28 + Math.floor(R() * 12);
  for (let x = x0 + 16; x < x0 + w - 12; x += stepX) {
    const sl = (R() - 0.5) * 8;
    g.strokeStyle = 'rgba(0, 0, 0, 0.45)';
    g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(x, y0); g.lineTo(x + sl, y0 + h); g.stroke();
    g.strokeStyle = 'rgba(200, 210, 220, 0.11)';
    g.lineWidth = 0.9;
    g.beginPath(); g.moveTo(x + 1.3, y0); g.lineTo(x + sl + 1.3, y0 + h); g.stroke();
  }

  // 3. Longitudinal armor seam lines
  const rows = Math.max(2, Math.floor(h / 18));
  for (let r = 1; r < rows; r++) {
    const ry = y0 + (h * r) / rows;
    g.strokeStyle = 'rgba(0, 0, 0, 0.38)';
    g.lineWidth = 1.1;
    g.beginPath(); g.moveTo(x0, ry); g.lineTo(x0 + w, ry + w * tilt); g.stroke();
    g.strokeStyle = 'rgba(210, 220, 230, 0.10)';
    g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(x0, ry + 1.2); g.lineTo(x0 + w, ry + w * tilt + 1.2); g.stroke();
  }
  g.restore();
}

function renderShip(scale) {
  // Render at high internal resolution so scaled-down ships stay razor-sharp
  const S = Math.max(0.85, SHIP.k * scale * 1.35);
  const X0 = 30, Y0 = 55, W = 1310, H = 295;
  const c = mk(W * S, H * S), g = c.getContext('2d');
  g.setTransform(S, 0, 0, S, -X0 * S, -Y0 * S);
  g.lineJoin = 'round';
  g.lineCap = 'round';

  const vGrad = (y0, y1, stops) => {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    for (const [p, col] of stops) gr.addColorStop(p, col);
    return gr;
  };

  // --- 1. Dorsal bridge wing, sensor masts & open truss gantry ---
  poly(g, [326, 70, 478, 75, 492, 98, 318, 96]);
  g.fillStyle = vGrad(70, 98, [[0, '#4a5058'], [0.4, '#32373d'], [1, '#1a1d21']]);
  g.fill();
  g.strokeStyle = 'rgba(200,210,220,0.32)'; g.lineWidth = 1; g.stroke();

  // Masts & whips
  g.strokeStyle = '#525860'; g.lineWidth = 1.3;
  for (const [x, y0, y1] of [
    [188, 96, 72], [202, 96, 80], [248, 102, 78], [272, 102, 82],
    [338, 92, 66], [352, 92, 74], [565, 114, 84], [1206, 148, 92], [1238, 150, 84],
  ]) {
    g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke();
  }

  // Detailed 3D dorsal lattice gantry along the main boom
  const spineTop = (x) => 114 + (x - 560) * (36 / 680);
  g.strokeStyle = '#1e2125'; g.lineWidth = 3.0;
  g.beginPath();
  g.moveTo(596, spineTop(596) - 16);
  g.lineTo(1238, spineTop(1238) - 15);
  g.stroke();
  g.strokeStyle = '#484e56'; g.lineWidth = 1.3;
  g.beginPath();
  g.moveTo(596, spineTop(596) - 16.5);
  g.lineTo(1238, spineTop(1238) - 15.5);
  g.moveTo(596, spineTop(596) - 9.5);
  g.lineTo(1238, spineTop(1238) - 8.5);
  g.stroke();
  for (let x = 602; x <= 1230; x += 26) {
    const y = spineTop(x);
    g.strokeStyle = '#33383e'; g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(x, y - 16); g.lineTo(x, y + 1);
    g.moveTo(x, y - 15); g.lineTo(x + 26, y - 5);
    g.moveTo(x + 13, y - 15.5); g.lineTo(x, y - 4);
    g.stroke();
  }

  // Twin stern vertical stabilizer fins with bevelled leading edges
  for (const [fx, fy, fw, fh] of [[1198, 94, 11, 64], [1232, 86, 13, 76]]) {
    g.fillStyle = '#202428'; g.fillRect(fx, fy, fw, fh);
    g.fillStyle = '#4a5058'; g.fillRect(fx, fy, 3, fh);
    g.fillStyle = '#141619'; g.fillRect(fx + fw - 2.5, fy, 2.5, fh);
  }

  // --- 2. Recessed armored neck & mechanical conduits ---
  poly(g, HULL_SIL.neck);
  g.fillStyle = vGrad(108, 258, [[0, '#252a30'], [0.5, '#171a1e'], [1, '#0e1013']]);
  g.fill();
  g.save(); g.clip();
  paintArmorTexture(g, 195, 108, 120, 150, 1101, 0.02);
  // Hydraulic pistons & ribbed docking conduits in neck
  for (const y of [122, 144, 166, 206, 226, 242]) {
    g.fillStyle = '#0b0d0f'; g.fillRect(202, y, 82, 5);
    g.fillStyle = '#383e46'; g.fillRect(202, y, 82, 1.6);
  }
  g.restore();

  // Ventral observation bay (armored blue-tinted glass canopy & steel ribs)
  poly(g, [550, 200, 728, 212, 716, 248, 594, 244, 550, 224]);
  g.fillStyle = vGrad(200, 248, [[0, '#091820'], [0.45, '#193b4d'], [0.75, '#102632'], [1, '#071015']]);
  g.fill();
  g.strokeStyle = 'rgba(110,185,220,0.35)'; g.lineWidth = 1.1; g.stroke();
  g.strokeStyle = '#101519'; g.lineWidth = 2.4;
  for (const x of [582, 612, 642, 672, 702]) {
    g.beginPath(); g.moveTo(x, 203); g.lineTo(x - 6, 246); g.stroke();
  }
  // Ventral chin sensor pod & twin orbital cannon battery
  poly(g, [532, 242, 654, 251, 638, 268, 546, 264]);
  g.fillStyle = vGrad(242, 268, [[0, '#2c3137'], [1, '#14171a']]); g.fill();
  poly(g, [438, 270, 518, 273, 506, 294, 450, 292]);
  g.fillStyle = vGrad(270, 294, [[0, '#262a2f'], [1, '#121417']]); g.fill();
  g.strokeStyle = '#454b52'; g.lineWidth = 2.8;
  g.beginPath();
  g.moveTo(492, 288); g.lineTo(526, 313);
  g.moveTo(478, 290); g.lineTo(512, 315);
  g.stroke();

  // Ventral heavy gun / missile pods under the rear boom
  for (const [x, y, s] of [[758, 217, 1], [848, 223, 0.94], [932, 227, 0.86], [1012, 231, 0.78]]) {
    g.save(); g.translate(x, y); g.scale(s, s);
    poly(g, [-24, -2, 24, 0, 18, 21, -17, 19]);
    g.fillStyle = vGrad(-2, 21, [[0, '#2a2f35'], [1, '#121417']]); g.fill();
    g.strokeStyle = 'rgba(180,190,200,0.22)'; g.lineWidth = 1; g.stroke();
    g.strokeStyle = '#3d434b'; g.lineWidth = 3.0;
    g.beginPath();
    g.moveTo(-9, 14); g.lineTo(-23, 32);
    g.moveTo(4, 15); g.lineTo(-10, 34);
    g.stroke();
    g.restore();
  }

  // --- 3. Rear Spine / Main Boom (3D multi-plane shading + Aztek armor plates) ---
  // Lower bevelled chine of boom
  poly(g, HULL_SIL.rearLower);
  g.fillStyle = vGrad(178, 244, [[0, '#32373e'], [0.4, '#22262b'], [1, '#111316']]);
  g.fill();
  g.save(); g.clip();
  paintArmorTexture(g, 548, 178, 725, 68, 2202, 0.048);
  g.restore();

  // Main upper side hull of boom
  poly(g, HULL_SIL.rearUpper);
  g.fillStyle = vGrad(114, 210, [[0, '#5a6068'], [0.22, '#474c53'], [0.7, '#32363c'], [1, '#22252a']]);
  g.fill();
  g.save(); g.clip();
  paintArmorTexture(g, 548, 114, 710, 96, 3303, 0.052);
  // Recessed dark longitudinal equipment trench along the boom chine
  poly(g, [552, 166, 1255, 200, 1255, 210, 552, 178]);
  g.fillStyle = '#181b1f'; g.fill();
  g.strokeStyle = 'rgba(210,220,230,0.25)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(552, 166); g.lineTo(1255, 200); g.stroke();
  g.restore();
  g.strokeStyle = 'rgba(200,208,216,0.32)'; g.lineWidth = 1.1; g.stroke();

  // Sloped top dorsal armor deck plate of rear boom
  poly(g, [548, 114, 1246, 152, 1236, 165, 548, 129]);
  g.fillStyle = vGrad(114, 165, [[0, '#6a7078'], [1, '#494e55']]);
  g.fill();
  g.save(); g.clip();
  paintArmorTexture(g, 548, 114, 700, 52, 4404, 0.054);
  g.restore();

  // Forward bow tip & sensor prongs
  poly(g, [1238, 152, 1266, 158, 1276, 192, 1274, 240, 1236, 242]);
  g.fillStyle = vGrad(152, 242, [[0, '#383d44'], [0.5, '#22262b'], [1, '#121417']]);
  g.fill();
  g.strokeStyle = '#626a74'; g.lineWidth = 1.6;
  for (const [py, len] of [[196, 18], [212, 24], [234, 15]]) {
    g.beginPath(); g.moveTo(1272, py); g.lineTo(1272 + len, py + 1); g.stroke();
  }

  // Yellow "SES SUPER EARTH" hull livery & 3-bar insignia
  g.save();
  g.translate(675, 147);
  g.rotate(0.052);
  g.fillStyle = '#d4be58';
  g.font = 'italic 800 14.5px system-ui, sans-serif';
  g.fillText('SES SUPER EARTH', 0, 0);
  for (let i = 0; i < 3; i++) {
    const y = -10.5 + i * 4.4;
    poly(g, [148 + i * 6, y, 286 - i * 8, y, 282 - i * 8, y + 2.5, 146 + i * 6, y + 2.5]);
    g.fill();
  }
  g.restore();

  // Clusters of glowing white/cyan micro-viewports along the boom trench
  g.fillStyle = 'rgba(220, 240, 255, 0.88)';
  for (const [x, cnt] of [[575, 3], [625, 4], [690, 5], [775, 3], [845, 4], [925, 3], [1010, 4], [1095, 3], [1175, 4]]) {
    for (let k = 0; k < cnt; k++) {
      const px = x + k * 7;
      const py = 171 + (px - 560) * 0.048;
      g.fillRect(px, py, 4.2, 1.7);
    }
  }

  // --- 4. Mid-Hull Command & Hangar Section ---
  poly(g, HULL_SIL.midTop);
  g.fillStyle = vGrad(92, 175, [[0, '#5e646c'], [0.35, '#464b52'], [1, '#2b2f35']]);
  g.fill();
  g.save(); g.clip();
  paintArmorTexture(g, 270, 92, 305, 84, 5505, 0.03);
  g.restore();

  // Upper mid-hull bevelled deck highlight & yellow trim stripe
  poly(g, [275, 108, 345, 92, 540, 104, 540, 117, 275, 118]);
  g.fillStyle = '#686e76'; g.fill();
  g.strokeStyle = '#d4be58'; g.lineWidth = 2.2;
  g.beginPath(); g.moveTo(306, 124); g.lineTo(544, 134); g.stroke();

  // Armored command bridge + glowing red tactical viewport slits
  poly(g, [290, 92, 462, 87, 470, 106, 282, 108]);
  g.fillStyle = vGrad(87, 108, [[0, '#3c4148'], [1, '#202327']]); g.fill();
  g.strokeStyle = 'rgba(200,210,220,0.28)'; g.lineWidth = 1; g.stroke();
  g.fillStyle = 'rgba(255, 85, 65, 0.95)';
  for (const x of [298, 310, 322, 362, 376, 390, 418, 430]) g.fillRect(x, 96.5, 7.5, 2.8);

  // Broadside lower hull
  poly(g, HULL_SIL.midBay);
  g.fillStyle = vGrad(160, 282, [[0, '#444950'], [0.45, '#2b2f35'], [0.8, '#1a1d21'], [1, '#101215']]);
  g.fill();
  g.save(); g.clip();
  paintArmorTexture(g, 252, 160, 310, 122, 6606, 0.03);
  // Lower chine shadow bevel on mid-hull
  poly(g, [252, 236, 552, 248, 552, 266, 480, 282, 320, 272]);
  g.fillStyle = 'rgba(8, 10, 12, 0.55)'; g.fill();
  g.restore();
  g.strokeStyle = 'rgba(185,192,200,0.26)'; g.lineWidth = 1.1; g.stroke();

  // Row of white service lights above the 3 broadside bays + red warning lights on left
  g.fillStyle = 'rgba(220,240,255,0.88)';
  for (let x = 336; x <= 482; x += 11) g.fillRect(x, 165 + (x - 336) * 0.03, 5, 1.6);

function renderUnderlight(scale) {
  const S = Math.max(0.85, SHIP.k * scale * 1.35);
  const X0 = 30, Y0 = 55, W = 1310, H = 295;
  const c = mk(W * S, H * S), g = c.getContext('2d');
  g.setTransform(S, 0, 0, S, -X0 * S, -Y0 * S);
  const gr = g.createLinearGradient(0, 155, 0, 315);
  gr.addColorStop(0, 'rgba(255,60,40,0)');
  gr.addColorStop(0.55, 'rgba(255,70,45,0.28)');
  gr.addColorStop(1, 'rgba(255,95,60,0.85)');
  g.fillStyle = gr;
  drawShipSilhouette(g, (n, pts) => { poly(g, pts); g.fill(); });
  return c;
}

function renderBackdrop(scale) {
  const c = mk(VW * scale, VH * scale), g = c.getContext('2d');
  g.setTransform(scale, 0, 0, scale, 0, 0);
  const R = mkRng(104729);

  // Deep orbital space to war-torn horizon gradient
  const sky = g.createLinearGradient(0, 0, 0, 940);
  sky.addColorStop(0.00, '#030306');
  sky.addColorStop(0.38, '#080608');
  sky.addColorStop(0.65, '#160a0a');
  sky.addColorStop(0.82, '#31110e');
  sky.addColorStop(0.93, '#5a1e13');
  sky.addColorStop(1.00, '#822c17');
  g.fillStyle = sky;
  g.fillRect(0, 0, VW, VH);

  for (const [cx, cy, rx, ry, col, a] of [
    [960, 810, 960, 220, '215,65,28', 0.24],
    [PLANET.x, PLANET.y, 280, 160, '115,52,34', 0.11],
    [1480, 220, 460, 170, '85,32,42', 0.09],
  ]) {
    g.save();
    g.translate(cx, cy);
    g.scale(rx / 100, ry / 100);
    const rg = g.createRadialGradient(0, 0, 0, 0, 0, 100);
    rg.addColorStop(0, `rgba(${col},${a})`);
    rg.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = rg;
    g.fillRect(-100, -100, 200, 200);
    g.restore();
  }

  const { x: px, y: py, r: pr, tilt: ringTilt } = PLANET;

  // Starfield
  for (let i = 0; i < 640; i++) {
    const x = R() * VW, y = R() * 830;
    if (Math.hypot(x - px, y - py) < pr - 1) continue;
    const hFade = 1 - 0.78 * smooth((y - 420) / 430);
    const a = (0.14 + R() * 0.65) * hFade;
    const warm = R() < 0.35;
    const sz = R() < 0.07 ? 1.8 : R() < 0.24 ? 1.3 : 0.9;
    g.fillStyle = warm ? `rgba(255,225,195,${a})` : `rgba(215,230,255,${a})`;
    g.fillRect(x, y, sz, sz);
  }

  const drawRings = (front) => {
    g.save();
    g.translate(px, py);
    g.rotate(ringTilt);
    g.scale(1, 0.26);
    const a0 = front ? 0 : Math.PI;
    const a1 = front ? Math.PI : TAU;
    const bands = [
      [pr * 1.30, 4.5, 'rgba(215,150,95,0.14)'],
      [pr * 1.42, 8.5, 'rgba(235,175,115,0.26)'],
      [pr * 1.54, 3.2, 'rgba(160,105,70,0.13)'],
      [pr * 1.66, 10.5, 'rgba(210,145,95,0.20)'],
      [pr * 1.80, 4.0, 'rgba(175,115,80,0.10)'],
    ];
    for (const [r, w, col] of bands) {
      g.strokeStyle = col;
      g.lineWidth = w;
      g.beginPath();
      g.arc(0, 0, r, a0, a1);
      g.stroke();
    }
    if (!front) {
      g.globalCompositeOperation = 'source-atop';
      const sg = g.createRadialGradient(34, -12, pr * 0.2, 34, -12, pr * 1.2);
      sg.addColorStop(0, 'rgba(5,4,6,0.9)');
      sg.addColorStop(1, 'rgba(5,4,6,0)');
      g.fillStyle = sg;
      g.fillRect(-pr * 2, -pr * 2, pr * 4, pr * 4);
    }
    g.restore();
  };

  drawRings(false);

  // Soft sunlit crescent glow on upper-left limb
  const halo = g.createRadialGradient(px - 22, py - 22, pr * 0.5, px - 16, py - 16, pr * 1.25);
  halo.addColorStop(0, 'rgba(240,145,75,0.15)');
  halo.addColorStop(0.65, 'rgba(220,105,45,0.05)');
  halo.addColorStop(1, 'rgba(220,100,45,0)');
  g.fillStyle = halo;
  g.fillRect(px - pr * 1.6, py - pr * 1.6, pr * 3.2, pr * 3.2);

  // Planet sphere
  g.save();
  g.beginPath(); g.arc(px, py, pr, 0, TAU); g.clip();
  const pg = g.createRadialGradient(px - 42, py - 38, 10, px + 14, py + 14, pr * 1.08);
  pg.addColorStop(0.00, '#634335');
  pg.addColorStop(0.36, '#3b2721');
  pg.addColorStop(0.68, '#170f0e');
  pg.addColorStop(1.00, '#060405');
  g.fillStyle = pg;
  g.fillRect(px - pr, py - pr, pr * 2, pr * 2);

  g.save();
  g.translate(px, py);
  g.rotate(ringTilt * 0.7);
  for (let i = -6; i <= 6; i++) {
    const by = i * 13 + (R() - 0.5) * 4;
    const bh = 3 + R() * 7;
    g.fillStyle = i % 2 ? 'rgba(130,82,60,0.09)' : 'rgba(12,6,6,0.18)';
    g.fillRect(-pr, by, pr * 2, bh);
  }
  g.restore();

  const term = g.createLinearGradient(px - pr * 0.5, py - pr * 0.5, px + pr * 0.75, py + pr * 0.75);
  term.addColorStop(0, 'rgba(0,0,0,0)');
  term.addColorStop(0.45, 'rgba(5,3,4,0.25)');
  term.addColorStop(0.8, 'rgba(5,3,4,0.85)');
  term.addColorStop(1, 'rgba(5,3,4,0.96)');
  g.fillStyle = term;
  g.fillRect(px - pr, py - pr, pr * 2, pr * 2);

  g.strokeStyle = 'rgba(255,175,100,0.55)';
  g.lineWidth = 2.2;
  g.beginPath(); g.arc(px, py, pr - 0.8, Math.PI * 0.88, Math.PI * 1.62); g.stroke();
  g.strokeStyle = 'rgba(210,65,35,0.22)';
  g.lineWidth = 1.8;
  g.beginPath(); g.arc(px, py, pr - 0.8, Math.PI * 0.15, Math.PI * 0.58); g.stroke();
  g.restore();

  drawRings(true);

  const hz = g.createLinearGradient(0, 700, 0, 920);
  hz.addColorStop(0.0, 'rgba(140,40,20,0)');
  hz.addColorStop(0.6, 'rgba(195,60,28,0.34)');
  hz.addColorStop(1.0, 'rgba(245,100,38,0.55)');
  g.fillStyle = hz;
  g.fillRect(0, 700, VW, 220);

  return c;
}

function renderRidge(scale, fn, yMin, topCol, botCol, edgeCol, valleyMistCol) {
  const c = mk(VW * scale, VH * scale), g = c.getContext('2d');
  g.setTransform(scale, 0, 0, scale, 0, 0);
  g.beginPath();
  g.moveTo(0, VH);
  for (let x = 0; x <= VW; x += 4) g.lineTo(x, fn(x));
  g.lineTo(VW, VH);
  g.closePath();
  const gr = g.createLinearGradient(0, yMin, 0, VH);
  gr.addColorStop(0, topCol);
  gr.addColorStop(1, botCol);
  g.fillStyle = gr;
  g.fill();

  if (edgeCol) {
    g.strokeStyle = edgeCol;
    g.lineWidth = 1.3;
    g.beginPath();
    for (let x = 0; x <= VW; x += 4) x ? g.lineTo(x, fn(x)) : g.moveTo(x, fn(x));
    g.stroke();
  }

  if (valleyMistCol) {
    const mg = g.createLinearGradient(0, yMin + 8, 0, yMin + 88);
    mg.addColorStop(0, 'rgba(0,0,0,0)');
    mg.addColorStop(0.55, valleyMistCol);
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = mg;
    g.fillRect(0, yMin + 8, VW, 85);
  }
  return c;
}

function renderSmokeBand(scale) {
  const c = mk(2400 * scale, 180 * scale), g = c.getContext('2d');
  g.setTransform(scale, 0, 0, scale, 0, 0);
  const R = mkRng(5512);
  for (let i = 0; i < 55; i++) {
    const x = R() * 2400, y = 90 + (R() - 0.5) * 65, r = 55 + R() * 115;
    for (const ox of [-2400, 0, 2400]) {
      const gr = g.createRadialGradient(x + ox, y, 0, x + ox, y, r);
      gr.addColorStop(0, 'rgba(210,85,45,0.085)');
      gr.addColorStop(1, 'rgba(120,35,20,0)');
      g.fillStyle = gr;
      g.save();
      g.translate(x + ox, y);
      g.scale(1, 0.35);
      g.translate(-(x + ox), -y);
      g.fillRect(x + ox - r, y - r, r * 2, r * 2);
      g.restore();
    }
  }
  return c;
}

// ---------------------------------------------------------------------------
// Dynamic State: Main Beam, Transiting Super Destroyers, Dropships & Combat
// ---------------------------------------------------------------------------
const st = {
  beam: { phase: 'on', t: 0, len: 1, I: 1, flick: 1, tx: 1020, ty: 944, glow: 0.95, onFor: 11 },
  fleet: [],       // Super Destroyers warping in, holding orbit, and warping out
  craft: [],       // Eagle / Pelican dropships flying between destroyers and surface
  blueBeacons: [],
  fleetBeams: [],
  pods: [],
  impacts: [],
  twinkles: [],
  booms: [],
  tracers: [],
  dust: [],
  embers: [],
  shipBob: 0,
};

// Spawn a Super Destroyer that either starts on-station or warps in from offscreen,
// cruises in low orbit, deploys a strike, and then accelerates / warps out!
function spawnFleetDestroyer(mode = 'warp-in', customSlot = null) {
  if (st.fleet.length >= 5) return;
  const slots = [
    { x: 470, y: 315, k: 0.22 },
    { x: 1410, y: 265, k: 0.25 },
    { x: 1140, y: 385, k: 0.15 },
    { x: 140, y: 410, k: 0.17 },
    { x: 640, y: 210, k: 0.14 },
  ];
  const slot = customSlot || pick(slots);
  const k = slot.k * range(0.92, 1.08);
  const holdDur = range(11, 22);
  const ship = {
    x: mode === 'warp-in' ? -420 : slot.x,
    y: slot.y + range(-14, 14),
    targetX: slot.x + range(-35, 35),
    startX: -450,
    exitX: VW + 450,
    k,
    state: mode === 'warp-in' ? 'arrive' : 'hold',
    t: mode === 'hold' ? range(1, holdDur * 0.5) : 0,
    arriveDur: range(1.1, 1.6),
    holdDur,
    departDur: range(1.3, 1.9),
    driftVx: range(6, 14) * (k / 0.2),
    phase: range(0, TAU),
    warpFlash: 0,
    fired: false,
  };
  st.fleet.push(ship);
  return ship;
}

// Spawn a Pelican dropship or Eagle fighter flying between orbit and surface
function spawnDropship(initialProgress = 0) {
  if (st.craft.length >= 4) return;
  const descending = rand() < 0.6;
  const parent = rand() < 0.55 || !st.fleet.length ? SHIP : pick(st.fleet);
  const [hx, hy] = shipPt(414, 252, 0, parent);
  const gx = clamp(hx + range(-340, 340), 140, VW - 140);
  const gy = farRidge(gx) + 6;

  const x0 = descending ? hx : gx;
  const y0 = descending ? hy : gy;
  const x1 = descending ? gx : hx;
  const y1 = descending ? gy : hy;
  const cx = (x0 + x1) / 2 + range(-160, 160);
  const cy = (y0 + y1) / 2 + range(-60, 40);
  const dur = range(4.5, 7.5);

  st.craft.push({
    x0, y0, cx, cy, x1, y1,
    t: initialProgress * dur,
    dur,
    size: clamp(parent.k * 2.2, 0.45, 1.0),
    descending,
  });
}

function scheduleBeam(delay) { after(delay, igniteBeam); }
function igniteBeam() {
  const b = st.beam;
  b.phase = 'ignite'; b.t = 0; b.len = 0;
  b.tx = range(910, 1110);
  b.ty = nearRidge(b.tx) + 3;
  b.onFor = range(9, 14);
  after(range(2.2, 4.0), () => dropPod(true));
  after(range(6.5, 8.2), () => dropPod(true));
}

function dropPod(onTarget = true) {
  if (st.beam.phase !== 'on' && st.beam.phase !== 'ignite') return;
  const bay = pick(POD_BAYS);
  const [sx, sy] = shipPt(bay[0], bay[1], st.shipBob);
  const offset = onTarget ? range(-5, 5) : range(-110, 110);
  const tx = st.beam.tx + offset;
  const ty = (onTarget ? nearRidge(tx) : midRidge(tx)) + 3;
  const dur = range(0.95, 1.25);
  st.pods.push({ sx, sy, tx, ty, t: 0, dur, main: onTarget });
}

function podImpact(p) {
  const sc = p.main ? 0.65 : 0.42;
  st.impacts.push({ t: 0, x: p.tx, y: p.ty, scale: sc });
  const cnt = p.main ? 36 : 20;
  for (let i = 0; i < cnt; i++) {
    const a = -Math.PI / 2 + range(-1.3, 1.3), sp = range(65, 310) * sc;
    st.dust.push({
      x: p.tx, y: p.ty,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: range(0.6, 1.5), age: 0, r: range(1.2, 3.0), hot: rand() < 0.6,
    });
  }
  if (p.main && st.beam.t > st.beam.onFor - 2.5) {
    after(range(1.2, 2.2), () => {
      if (st.beam.phase === 'on') { st.beam.phase = 'shutdown'; st.beam.t = 0; }
    });
  }
}

function spawnFleetStrike(ship = null, initialProgress = 0) {
  const candidates = st.fleet.filter((s) => s.state === 'hold' && s.x > 120 && s.x < VW - 220);
  const f = ship || (candidates.length ? pick(candidates) : null);
  if (!f) return;
  const [sx, sy] = shipPt(EMIT[0], EMIT[1], 0, f);
  const tx = clamp(sx + range(-110, 150), 160, VW - 160);
  const ty = distMesa(tx) + 3;
  const dur = range(3.2, 5.0);
  st.fleetBeams.push({ ship: f, sx, sy, tx, ty, t: initialProgress * dur, dur });
  after(0.55, () => {
    st.booms.push({ x: tx, y: ty, t: 0, life: 2.3, size: range(38, 62), plume: true });
  });
}

function spawnBlueBeacon(initialProgress = 0) {
  if (st.blueBeacons.length >= 2) return;
  let x = range(220, 440);
  if (st.blueBeacons.length === 1) x = range(1620, 1810);
  const y = midRidge(x) + 2;
  const dur = range(7, 12);
  st.blueBeacons.push({ x, y, t: initialProgress * dur, dur });
}

function farBoom() {
  let x = range(140, 1780);
  if (Math.abs(x - st.beam.tx) < 130) x += 240;
  const big = rand() < 0.40;
  const useMid = rand() < 0.45;
  const y = (useMid ? farRidge(x) : distMesa(x)) + range(-2, 6);
  st.booms.push({
    x, y, t: 0,
    life: big ? range(2.0, 2.9) : range(1.2, 1.8),
    size: big ? range(45, 74) : range(22, 42),
    plume: big,
  });
}

function tracerBurst() {
  const automaton = rand() < 0.62;
  const x0 = range(160, 1760);
  const y0 = (rand() < 0.5 ? farRidge(x0) : midRidge(x0)) - 2;
  const ang = automaton ? range(-0.95, -0.35) : range(-2.6, -1.9);
  const sp = range(380, 620);
  const n = 4 + Math.floor(rand() * 5);
  for (let i = 0; i < n; i++) {
    after(i * range(0.06, 0.14), () => {
      const a = ang + range(-0.06, 0.06);
      st.tracers.push({
        x: x0 + range(-14, 14), y: y0,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        t: 0, life: range(0.6, 1.05),
        c: automaton ? '255,65,55' : '255,215,95',
      });
    });
  }
}

LW.start({
  init() {
    for (let i = 0; i < 65; i++) {
      st.twinkles.push({
        x: range(0, VW), y: range(25, 740),
        ph: range(0, TAU), rate: range(0.4, 1.7), s: range(0.9, 1.9),
      });
    }

    // Initial squadron in orbit + scheduled FTL arrivals/departures
    spawnFleetDestroyer('hold', { x: 470, y: 310, k: 0.22 });
    spawnFleetDestroyer('hold', { x: 1380, y: 265, k: 0.25 });
    spawnFleetDestroyer('hold', { x: 1120, y: 385, k: 0.15 });
    spawnDropship(0.35);
    spawnDropship(0.68);

    igniteBeam();
    st.beam.phase = 'on'; st.beam.len = 1; st.beam.I = 1; st.beam.glow = 0.95;
    spawnBlueBeacon(0.15);
    spawnFleetStrike(st.fleet[0], 0.1);
    for (let i = 0; i < 4; i++) farBoom();

    // Guaranteed dynamic events around t=8 for still renders
    after(7.1, () => spawnFleetDestroyer('warp-in', { x: 140, y: 395, k: 0.18 }));
    after(6.0, () => spawnDropship(0));
    after(7.45, () => dropPod(true));
    after(6.8, () => spawnFleetStrike(null, 0));
    after(6.5, () => spawnBlueBeacon(0));

    every(1.8, 4.8, farBoom);
    every(2.5, 7.0, tracerBurst);
    every(4.5, 9.5, () => spawnFleetStrike(null, 0));
    every(6.0, 12.0, () => spawnBlueBeacon(0));
    every(4.0, 8.5, () => spawnDropship(0));
    every(5.5, 11.0, () => spawnFleetDestroyer('warp-in'));
  },
  resize(view) {
    const s = Math.min(2, Math.max(0.5, view.scale));
    layers.backdrop = renderBackdrop(s);
    layers.mesa = renderRidge(s, distMesa, 760, '#2e1410', '#180a09', 'rgba(225,85,42,0.34)', 'rgba(215,75,35,0.15)');
    layers.far = renderRidge(s, farRidge, 810, '#220f0d', '#120808', 'rgba(185,68,36,0.38)', 'rgba(185,60,30,0.13)');
    layers.mid = renderRidge(s, midRidge, 855, '#150b0a', '#0a0606', 'rgba(135,48,28,0.42)', 'rgba(140,42,22,0.11)');
    layers.near = renderRidge(s, nearRidge, 900, '#0a0606', '#030202', 'rgba(95,35,22,0.52)', null);
    layers.smoke = renderSmokeBand(s);
    layers.ship = renderShip(s);
    layers.under = renderUnderlight(s);
  },
  update(dt, t) {
    const b = st.beam;
    st.shipBob = Math.sin(t * 0.32) * 2.2 + Math.sin(t * 0.13 + 1.1) * 1.2;
    b.t += dt;
    if (b.phase === 'ignite') {
      b.len = 1 - Math.pow(1 - clamp(b.t / 0.42, 0, 1), 3);
      b.I = 1.35;
      if (b.t >= 0.42) { b.phase = 'on'; b.t = 0; }
    } else if (b.phase === 'on') {
      b.len = 1;
      if (rand() < dt * 2.2) b.flick = range(0.62, 0.88);
      else b.flick = Math.min(1, b.flick + dt * 4);
      b.I = (0.88 + 0.12 * Math.sin(t * TAU * 1.4)) * b.flick;
      if (b.t > b.onFor + 4 && !st.pods.length) { b.phase = 'shutdown'; b.t = 0; }
    } else if (b.phase === 'shutdown') {
      const p = clamp(b.t / 0.48, 0, 1);
      b.I = (1 - p) * (Math.floor(b.t * 30) % 2 ? range(0.2, 1) : 1);
      if (p >= 1) { b.phase = 'off'; b.I = 0; b.len = 0; scheduleBeam(range(1.6, 3.8)); }
    }
    const target = b.len >= 1 ? b.I : 0;
    b.glow += (target - b.glow) * clamp(dt * (target > b.glow ? 8 : 2.4), 0, 1);

    // Update dynamic fleet Super Destroyers (FTL warp-in -> orbital cruise -> FTL warp-out)
    for (let i = st.fleet.length - 1; i >= 0; i--) {
      const f = st.fleet[i];
      f.t += dt;
      if (f.state === 'arrive') {
        const u = clamp(f.t / f.arriveDur, 0, 1);
        const ease = 1 - Math.pow(1 - u, 4); // sharp FTL deceleration
        f.x = lerp(f.startX, f.targetX, ease);
        f.warpFlash = Math.sin(Math.PI * clamp(u * 1.4, 0, 1)) * (1 - u * 0.7);
        if (u >= 1) {
          f.state = 'hold';
          f.t = 0;
          f.warpFlash = 0;
        }
      } else if (f.state === 'hold') {
        f.x += f.driftVx * dt;
        if (!f.fired && f.t > 1.8 && rand() < dt * 0.35) {
          f.fired = true;
          spawnFleetStrike(f, 0);
        }
        if (f.t >= f.holdDur) {
          f.state = 'depart';
          f.t = 0;
          f.startX = f.x;
        }
      } else if (f.state === 'depart') {
        const u = clamp(f.t / f.departDur, 0, 1);
        const ease = Math.pow(u, 3.5); // FTL spool-up & jump acceleration
        f.x = lerp(f.startX, f.exitX, ease);
        f.warpFlash = Math.sin(Math.PI * u);
        if (u >= 1) st.fleet.splice(i, 1);
      }
    }

    // Update Pelican / Eagle dropships
    for (let i = st.craft.length - 1; i >= 0; i--) {
      const c = st.craft[i];
      c.t += dt;
      if (c.t >= c.dur) st.craft.splice(i, 1);
    }

    for (let i = st.pods.length - 1; i >= 0; i--) {
      const p = st.pods[i];
      p.t += dt;
      if (p.t >= p.dur) { st.pods.splice(i, 1); podImpact(p); }
    }
    for (let i = st.impacts.length - 1; i >= 0; i--) {
      st.impacts[i].t += dt;
      if (st.impacts[i].t > 2.2) st.impacts.splice(i, 1);
    }
    for (let i = st.fleetBeams.length - 1; i >= 0; i--) {
      const fb = st.fleetBeams[i];
      fb.t += dt;
      if (fb.ship) {
        const [sx, sy] = shipPt(EMIT[0], EMIT[1], 0, fb.ship);
        fb.sx = sx; fb.sy = sy;
      }
      if (fb.t >= fb.dur) st.fleetBeams.splice(i, 1);
    }
    for (let i = st.blueBeacons.length - 1; i >= 0; i--) {
      st.blueBeacons[i].t += dt;
      if (st.blueBeacons[i].t >= st.blueBeacons[i].dur) st.blueBeacons.splice(i, 1);
    }
    for (const d of st.dust) {
      d.age += dt; d.vy += 420 * dt; d.vx *= 1 - dt * 1.4;
      d.x += d.vx * dt; d.y += d.vy * dt;
    }
    st.dust = st.dust.filter((d) => d.age < d.life && d.y < nearRidge(d.x) + 18);
    for (const m of st.booms) m.t += dt;
    st.booms = st.booms.filter((m) => m.t < m.life);
    for (const r of st.tracers) {
      r.t += dt; r.vy += 80 * dt; r.x += r.vx * dt; r.y += r.vy * dt;
    }
    st.tracers = st.tracers.filter((r) => r.t < r.life);

    if (b.glow > 0.3 && rand() < dt * 14) {
      st.embers.push({
        x: b.tx + range(-42, 42), y: b.ty - range(0, 8),
        vx: range(-14, 14), vy: -range(22, 62),
        age: 0, life: range(1.4, 3.2),
      });
    }
    for (const e of st.embers) {
      e.age += dt;
      e.x += (e.vx + Math.sin(e.age * 3 + e.x) * 10) * dt;
      e.y += e.vy * dt;
    }
    st.embers = st.embers.filter((e) => e.age < e.life);
  },
  draw(ctx, t) {
    const b = st.beam, bob = st.shipBob;
    const L = layers.ship;
    ctx.drawImage(layers.backdrop, 0, 0, VW, VH);

    // Twinkling stars
    ctx.globalCompositeOperation = 'lighter';
    for (const s of st.twinkles) {
      if (Math.hypot(s.x - PLANET.x, s.y - PLANET.y) < PLANET.r + 3) continue;
      const a = 0.25 + 0.75 * Math.max(0, Math.sin(t * s.rate + s.ph)) ** 3;
      ctx.fillStyle = `rgba(255,235,215,${a * 0.75})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }

    // Dynamic Fleet Super Destroyers (sorted far-to-near by scale)
    ctx.globalCompositeOperation = 'source-over';
    const sortedFleet = st.fleet.slice().sort((a, b) => a.k - b.k);
    for (const f of sortedFleet) {
      const fbob = Math.sin(t * 0.28 + f.phase) * 1.4;
      const fx = f.x + (L.x - SHIP.ox) * f.k;
      const fy = f.y + (L.y - SHIP.oy) * f.k + fbob;
      const fw = L.w * f.k, fh = L.h * f.k;

      // FTL Warp Jump light streak during arrival / departure (trailing from stern on the left)
      if (f.warpFlash > 0.01) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const wy = f.y + (200 - SHIP.oy) * f.k + fbob;
        const streakLen = (280 + 520 * f.warpFlash) * (f.k / 0.2);
        const sx0 = fx + fw * 0.08;
        const sg = ctx.createLinearGradient(sx0, wy, sx0 - streakLen, wy);
        sg.addColorStop(0, `rgba(200, 240, 255, ${0.85 * f.warpFlash})`);
        sg.addColorStop(0.3, `rgba(90, 175, 255, ${0.45 * f.warpFlash})`);
        sg.addColorStop(1, 'rgba(40, 110, 255, 0)');
        ctx.fillStyle = sg;
        ctx.fillRect(sx0 - streakLen, wy - 16 * f.k, streakLen, 32 * f.k);
        ctx.restore();
      }

      ctx.save();
      ctx.globalAlpha = clamp(0.62 + f.k * 1.3, 0.65, 0.96);
      ctx.drawImage(L.canvas, fx, fy, fw, fh);
      ctx.restore();

      // Fleet ship engine plumes (on the left/stern end with the panels)
      ctx.globalCompositeOperation = 'lighter';
      for (const eyOff of [162, 200, 238]) {
        const [ex0, ey0] = shipPt(50, eyOff, fbob, f);
        const pLen = (68 + f.warpFlash * 140) * f.k;
        const eg = ctx.createLinearGradient(ex0, ey0, ex0 - pLen, ey0);
        eg.addColorStop(0, `rgba(205,242,255,${0.88 + f.warpFlash * 0.12})`);
        eg.addColorStop(0.35, 'rgba(100,185,255,0.55)');
        eg.addColorStop(1, 'rgba(60,130,255,0)');
        ctx.fillStyle = eg;
        ctx.fillRect(ex0 - pLen, ey0 - 4.5 * f.k, pLen, 9 * f.k);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // Pelican Dropships & Eagle Fighters flying along curved trajectories
    for (const c of st.craft) {
      const u = clamp(c.t / c.dur, 0, 1);
      const inv = 1 - u;
      const x = inv * inv * c.x0 + 2 * inv * u * c.cx + u * u * c.x1;
      const y = inv * inv * c.y0 + 2 * inv * u * c.cy + u * u * c.y1;
      const dx = 2 * inv * (c.cx - c.x0) + 2 * u * (c.x1 - c.cx);
      const dy = 2 * inv * (c.cy - c.y0) + 2 * u * (c.y1 - c.cy);
      const ang = Math.atan2(dy, dx);
      const fade = smooth(u / 0.12) * (1 - smooth((u - 0.85) / 0.15));
      const sc = c.size * (c.descending ? lerp(0.85, 0.55, u) : lerp(0.55, 0.85, u));

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      ctx.scale(sc, sc);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = fade;

      // Twin engine plasma trail behind dropship
      const tg = ctx.createLinearGradient(-44, 0, -6, 0);
      tg.addColorStop(0, 'rgba(100,190,255,0)');
      tg.addColorStop(1, 'rgba(190,235,255,0.85)');
      ctx.fillStyle = tg;
      ctx.fillRect(-44, -2.5, 38, 2);
      ctx.fillRect(-44, 0.5, 38, 2);

      // Thruster core glow
      const rg = ctx.createRadialGradient(-7, 0, 0, -7, 0, 9);
      rg.addColorStop(0, 'rgba(220,248,255,0.95)');
      rg.addColorStop(1, 'rgba(80,165,255,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(-16, -9, 18, 18);

      // Pelican / Eagle angular silhouette
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#242930';
      poly(ctx, [-8, -3.5, 6, -2.5, 12, 0, 6, 2.5, -8, 3.5, -5, 0]);
      ctx.fill();
      ctx.fillStyle = '#d4be58';
      ctx.fillRect(-2, -1.2, 6, 0.9);
      ctx.restore();
    }

    // Fleet orbital laser beams
    ctx.globalCompositeOperation = 'lighter';
    for (const fb of st.fleetBeams) {
      const p = fb.t / fb.dur;
      const a = smooth(p / 0.15) * (1 - smooth((p - 0.75) / 0.25));
      for (const [w, al] of [[9, 0.08], [4, 0.24], [1.4, 0.70]]) {
        ctx.strokeStyle = `rgba(255,90,55,${al * a})`;
        ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(fb.sx, fb.sy); ctx.lineTo(fb.tx, fb.ty); ctx.stroke();
      }
    }

    // Distant explosions & artillery flashes (scaled down)
    for (const m of st.booms) {
      const p = m.t / m.life;
      const flash = Math.max(0, 1 - p * 2.2);
      const glow = Math.sin(Math.PI * Math.min(1, p * 1.35));
      const r = m.size * (0.55 + p * 0.85);
      const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, r * 2.4);
      g.addColorStop(0, `rgba(255,${220 - 85 * p},130,${0.95 * flash + 0.3 * glow})`);
      g.addColorStop(0.32, `rgba(240,105,35,${0.42 * glow})`);
      g.addColorStop(1, 'rgba(130,35,15,0)');
      ctx.fillStyle = g;
      ctx.fillRect(m.x - r * 2.4, m.y - r * 2.4, r * 4.8, r * 4.8);
      if (m.plume && p < 0.75) {
        const domeR = r * (0.4 + p * 1.05);
        ctx.strokeStyle = `rgba(255,190,120,${(1 - p / 0.75) * 0.42})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(m.x, m.y, domeR, Math.PI, TAU);
        ctx.stroke();
      }
    }

    // AA / Automaton laser crossfire
    for (const r of st.tracers) {
      const a = 1 - r.t / r.life;
      ctx.strokeStyle = `rgba(${r.c},${a * 0.32})`;
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx * 0.048, r.y - r.vy * 0.048); ctx.stroke();
      ctx.strokeStyle = `rgba(${r.c},${a})`;
      ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx * 0.048, r.y - r.vy * 0.048); ctx.stroke();
    }

    // Rank 0 & 1 ridges + drifting war smoke
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(layers.mesa, 0, 0, VW, VH);
    const smx = -((t * 12) % 2400);
    ctx.drawImage(layers.smoke, smx, 735, 2400, 180);
    ctx.drawImage(layers.smoke, smx + 2400, 735, 2400, 180);
    ctx.drawImage(layers.far, 0, 0, VW, VH);

    // Secondary blue support-weapon stratagem beacons on mid ridge
    ctx.globalCompositeOperation = 'lighter';
    for (const bb of st.blueBeacons) {
      const p = bb.t / bb.dur;
      const a = smooth(p / 0.12) * (1 - smooth((p - 0.82) / 0.18));
      const bg = ctx.createLinearGradient(bb.x, bb.y, bb.x, bb.y - 240);
      bg.addColorStop(0, `rgba(90,205,255,${0.82 * a})`);
      bg.addColorStop(0.45, `rgba(60,165,255,${0.24 * a})`);
      bg.addColorStop(1, 'rgba(60,165,255,0)');
      ctx.strokeStyle = bg;
      ctx.lineWidth = 4.2;
      ctx.beginPath(); ctx.moveTo(bb.x, bb.y); ctx.lineTo(bb.x, bb.y - 240); ctx.stroke();
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = `rgba(210,245,255,${0.8 * a})`;
      ctx.beginPath(); ctx.moveTo(bb.x, bb.y); ctx.lineTo(bb.x, bb.y - 185); ctx.stroke();
      const rg = ctx.createRadialGradient(bb.x, bb.y, 0, bb.x, bb.y, 38);
      rg.addColorStop(0, `rgba(110,215,255,${0.55 * a})`);
      rg.addColorStop(1, 'rgba(50,140,255,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(bb.x - 38, bb.y - 38, 76, 76);
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(layers.mid, 0, 0, VW, VH);

    // Main red stratagem orbital beam (scaled down to match flagship)
    const [ex, ey] = shipPt(EMIT[0], EMIT[1], bob);
    ctx.globalCompositeOperation = 'lighter';
    if (b.len > 0 && b.I > 0.01) {
      const x2 = lerp(ex, b.tx, b.len), y2 = lerp(ey, b.ty, b.len), I = clamp(b.I, 0, 1.4);
      ctx.lineCap = 'round';
      for (const [w, a, col] of [
        [38, 0.06, '220,45,30'],
        [20, 0.12, '240,55,40'],
        [9, 0.28, '255,75,55'],
        [3.6, 0.65, '255,140,110'],
        [1.5, 0.96, '255,235,220'],
      ]) {
        ctx.strokeStyle = `rgba(${col},${a * I})`;
        ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(x2, y2); ctx.stroke();
      }
      const eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, 48);
      eg.addColorStop(0, `rgba(255,150,120,${0.85 * I})`);
      eg.addColorStop(0.4, `rgba(255,65,45,${0.35 * I})`);
      eg.addColorStop(1, 'rgba(255,50,35,0)');
      ctx.fillStyle = eg;
      ctx.fillRect(ex - 48, ey - 48, 96, 96);
    }

    // Ground glow behind near ridge
    if (b.glow > 0.01) {
      const gg = ctx.createRadialGradient(b.tx, b.ty, 0, b.tx, b.ty, 185);
      gg.addColorStop(0, `rgba(255,105,75,${0.80 * b.glow})`);
      gg.addColorStop(0.32, `rgba(235,60,40,${0.32 * b.glow})`);
      gg.addColorStop(1, 'rgba(160,25,15,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(b.tx - 185, b.ty - 185, 370, 370);
    }

    // Hellpods streaking down from the flagship (tapered plasma wake, scaled down)
    for (const pod of st.pods) {
      const p = pod.t / pod.dur, e = p * p;
      const px = lerp(pod.sx, pod.tx, e), py = lerp(pod.sy, pod.ty, e);
      const tl = 0.20 + 0.26 * p;
      const qx = lerp(pod.sx, pod.tx, Math.max(0, e - tl));
      const qy = lerp(pod.sy, pod.ty, Math.max(0, e - tl));
      const dx = px - qx, dy = py - qy, L0 = Math.hypot(dx, dy) || 1;
      const nx = -dy / L0, ny = dx / L0;
      const wHead = pod.main ? 3.2 : 2.2;

      const tg = ctx.createLinearGradient(qx, qy, px, py);
      tg.addColorStop(0, 'rgba(240,95,30,0)');
      tg.addColorStop(0.55, 'rgba(255,155,55,0.55)');
      tg.addColorStop(1, 'rgba(255,240,185,0.98)');
      ctx.fillStyle = tg;
      ctx.beginPath();
      ctx.moveTo(qx, qy);
      ctx.lineTo(px + nx * wHead, py + ny * wHead);
      ctx.lineTo(px - nx * wHead, py - ny * wHead);
      ctx.closePath();
      ctx.fill();

      const hr = pod.main ? 24 : 16;
      const hg = ctx.createRadialGradient(px, py, 0, px, py, hr);
      hg.addColorStop(0, 'rgba(255,250,225,1)');
      hg.addColorStop(0.32, 'rgba(255,180,75,0.78)');
      hg.addColorStop(1, 'rgba(255,90,25,0)');
      ctx.fillStyle = hg;
      ctx.fillRect(px - hr, py - hr, hr * 2, hr * 2);
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(layers.near, 0, 0, VW, VH);

    // Foreground ground lighting, impacts, debris & embers
    ctx.globalCompositeOperation = 'lighter';
    if (b.glow > 0.01) {
      ctx.save();
      ctx.translate(b.tx, b.ty);
      ctx.scale(1, 0.26);
      const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, 125);
      sg.addColorStop(0, `rgba(255,135,100,${0.60 * b.glow})`);
      sg.addColorStop(1, 'rgba(255,60,40,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(-125, -125, 250, 250);
      ctx.restore();
    }

    for (const imp of st.impacts) {
      const k = imp.t, fl = Math.max(0, 1 - k * 2.4) * imp.scale;
      if (fl > 0) {
        const R0 = 320 * imp.scale;
        const fg = ctx.createRadialGradient(imp.x, imp.y, 0, imp.x, imp.y, R0);
        fg.addColorStop(0, `rgba(255,245,210,${fl})`);
        fg.addColorStop(0.25, `rgba(255,155,65,${0.55 * fl})`);
        fg.addColorStop(1, 'rgba(255,75,25,0)');
        ctx.fillStyle = fg;
        ctx.fillRect(imp.x - R0, imp.y - R0, R0 * 2, R0 * 2);
      }
      const rr = (22 + k * 340) * imp.scale;
      const ra = Math.max(0, 0.55 - k * 0.45) * imp.scale;
      ctx.strokeStyle = `rgba(255,180,115,${ra})`;
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.ellipse(imp.x, imp.y, rr, rr * 0.18, 0, 0, TAU); ctx.stroke();
    }

    for (const d of st.dust) {
      const a = 1 - d.age / d.life;
      ctx.fillStyle = d.hot ? `rgba(255,180,85,${a})` : `rgba(180,115,95,${a * 0.6})`;
      ctx.fillRect(d.x, d.y, d.r, d.r);
    }
    for (const e of st.embers) {
      const a = Math.sin(Math.PI * e.age / e.life);
      ctx.fillStyle = `rgba(255,150,75,${a * 0.9})`;
      ctx.fillRect(e.x, e.y, 1.6, 1.6);
    }

    // Flagship Super Destroyer (drawn over beam origin)
    ctx.globalCompositeOperation = 'source-over';
    const [sx, sy] = shipPt(L.x, L.y, bob);
    ctx.drawImage(L.canvas, sx, sy, L.w * SHIP.k, L.h * SHIP.k);

    // Red underlight reflection on flagship hull
    ctx.globalCompositeOperation = 'lighter';
    const ul = clamp(b.I * (b.len > 0 ? 1 : 0), 0, 1) * 0.58 +
      (st.impacts.length ? Math.max(0, 0.42 - st.impacts[0].t * 0.4) : 0);
    if (ul > 0.01) {
      ctx.globalAlpha = ul;
      ctx.drawImage(layers.under, sx, sy, L.w * SHIP.k, L.h * SHIP.k);
      ctx.globalAlpha = 1;
    }

    // Flagship ion engine plumes (at the stern end with the angled armor panels)
    for (const [i, e] of ENGINES.entries()) {
      const [x, y] = shipPt(e[0], e[1], bob);
      const f = (0.78 + 0.22 * Math.sin(t * 24 + i * 1.9) * Math.sin(t * 7.5 + i)) * e[2];
      const len = 56 * f;
      const g = ctx.createLinearGradient(x, y, x - len, y);
      g.addColorStop(0, `rgba(220,245,255,${0.95 * f})`);
      g.addColorStop(0.28, `rgba(120,195,255,${0.7 * f})`);
      g.addColorStop(1, 'rgba(50,130,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x, y - 2.2 * e[2]);
      ctx.lineTo(x - len, y);
      ctx.lineTo(x, y + 2.2 * e[2]);
      ctx.closePath();
      ctx.fill();

      const r = ctx.createRadialGradient(x, y, 0, x, y, 16 * e[2]);
      r.addColorStop(0, `rgba(165,220,255,${0.78 * f})`);
      r.addColorStop(1, 'rgba(60,140,255,0)');
      ctx.fillStyle = r;
      ctx.fillRect(x - 17, y - 17, 34, 34);
    }

    // Glowing blue circular RCS thruster ports on flagship
    for (const p of PORTS) {
      const [x, y] = shipPt(p[0], p[1], bob);
      const r = ctx.createRadialGradient(x, y, 0, x, y, 7);
      r.addColorStop(0, 'rgba(210,245,255,0.95)');
      r.addColorStop(0.35, 'rgba(100,195,255,0.65)');
      r.addColorStop(1, 'rgba(50,130,255,0)');
      ctx.fillStyle = r;
      ctx.fillRect(x - 7, y - 7, 14, 14);
    }

    // Blinking navigation & mast strobes
    for (const l of LIGHTS) {
      const on = (t * l.rate + l.ph) % 1 < 0.22;
      if (!on) continue;
      const [x, y] = shipPt(l.p[0], l.p[1], bob);
      const r = ctx.createRadialGradient(x, y, 0, x, y, 8.5);
      r.addColorStop(0, `rgba(${l.c},1)`);
      r.addColorStop(1, `rgba(${l.c},0)`);
      ctx.fillStyle = r;
      ctx.fillRect(x - 9, y - 9, 18, 18);
    }
    ctx.globalCompositeOperation = 'source-over';
  },
});
</script>
</body>
</html>

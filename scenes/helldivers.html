<!doctype html>

<canvas id="scene"></canvas>
<script>
// ============================================================================
// livewall runtime — copy this block unchanged into every scene.
//
// Scene contract:
//   * Self-contained single file. No network requests, no external assets.
//   * Draw in a virtual 1920x1080 space; the runtime scales it to "cover".
//   * Put ALL timing in update(dt) / sim-time timers (after/every). Never use
//     setTimeout/setInterval for animation — those keep running while paused
//     and break ?still rendering.
//   * Use rand() (seeded) instead of Math.random().
//
// URL params:  ?fps=30      frame cap (host passes 30; default 60)
//              ?seed=123    deterministic randomness
//              ?still=1&t=8 simulate 8s of scene time, draw one frame, stop
//                           (used to generate theme background stills)
// Host API:    window.livewall.pause() / resume() / paused
// ============================================================================
const LW = (() => {
  const params = new URLSearchParams(location.search);
  const VW = 1920, VH = 1080;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let seed = (Number(params.get('seed')) || (Date.now() % 2147483647)) >>> 0;
  function rand() { // mulberry32
    seed = (seed + 0x6D2B79F5) >>> 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const range = (a, b) => a + rand() * (b - a);
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];

  // sim-time scheduler
  let simTime = 0;
  const timers = [];
  function after(sec, fn) { timers.push({ at: simTime + sec, fn }); }
  function every(minSec, maxSec, fn) {
    const go = () => { fn(); after(range(minSec, maxSec), go); };
    after(range(minSec, maxSec), go);
  }
  function runTimers() {
    for (let i = timers.length - 1; i >= 0; i--) {
      if (timers[i].at <= simTime) { const t = timers.splice(i, 1)[0]; t.fn(); }
    }
  }

  const view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
  function resize() {
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);
    view.w = Math.round(innerWidth * view.dpr);
    view.h = Math.round(innerHeight * view.dpr);
    canvas.width = view.w; canvas.height = view.h;
    view.scale = Math.max(view.w / VW, view.h / VH);
    view.ox = (view.w - VW * view.scale) / 2;
    view.oy = (view.h - VH * view.scale) / 2;
    if (scene.resize) scene.resize(view);
    drawFrame();
  }

  let scene = null, paused = false, last = 0, raf = 0;
  const fps = Math.max(1, Number(params.get('fps')) || 60);
  const still = params.has('still');

  function step(dt) { simTime += dt; runTimers(); scene.update(dt, simTime); }
  function drawFrame() {
    if (!scene) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, view.w, view.h);
    ctx.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
    scene.draw(ctx, simTime);
  }
  function loop(now) {
    raf = 0;
    if (paused) return;
    raf = requestAnimationFrame(loop);
    if (!last) { last = now; return; }
    const elapsed = now - last;
    if (elapsed < 1000 / fps - 2) return;
    last = now;
    step(Math.min(elapsed / 1000, 0.1));
    drawFrame();
  }
  function pause() { paused = true; if (raf) cancelAnimationFrame(raf); raf = 0; }
  function resume() { if (still) return; paused = false; last = 0; if (!raf) raf = requestAnimationFrame(loop); }

  function start(s) {
    scene = s;
    if (scene.init) scene.init(view);
    addEventListener('resize', resize);
    resize();
    if (still) {
      const T = Number(params.get('t')) || 8;
      while (simTime < T) step(1 / 30);
      drawFrame();
      document.title += ' [still]';
      return;
    }
    document.addEventListener('visibilitychange', () => document.hidden ? pause() : resume());
    resume();
  }

  window.livewall = { pause, resume, get paused() { return paused; } };
  return { VW, VH, ctx, rand, range, pick, after, every, start, view,
           get time() { return simTime; } };
})();
// ============================== end runtime =================================

// ---- scene: Helldivers — Super Destroyer squadron over an embattled world ---
const { VW, VH, rand, range, pick, after, every } = LW;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

function mkRng(s) {
  s >>>= 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}
function poly(g, pts) {
  g.beginPath();
  g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.closePath();
}

// Craggy volcanic/rocky planetary ridgelines with sharp peaks & mesas
const jagged = (x, s) =>
  Math.sin(x * 0.012 + s) * 0.55 +
  Math.sin(x * 0.029 + s * 2.1) * 0.28 +
  Math.abs(Math.cos(x * 0.047 + s * 3.7)) * 0.22 +
  Math.sin(x * 0.095 + s * 1.3) * 0.08;

const distMesa = (x) =>
  754 - 44 * Math.exp(-(((x - 280) / 210) ** 2))
      - 58 * Math.exp(-(((x - 1560) / 260) ** 2))
      - 28 * Math.exp(-(((x - 840) / 170) ** 2))
      + 24 * jagged(x, 0.8);

const farRidge = (x) =>
  806 - 48 * Math.exp(-(((x - 630) / 180) ** 2))
      - 38 * Math.exp(-(((x - 1340) / 150) ** 2))
      + 26 * jagged(x, 2.4);

const midRidge = (x) =>
  862 - 36 * Math.exp(-(((x - 220) / 160) ** 2))
      - 42 * Math.exp(-(((x - 1710) / 190) ** 2))
      + 22 * jagged(x, 4.1);

const nearRidge = (x) =>
  922 - 54 * Math.exp(-(((x - 95) / 145) ** 2))
      - 62 * Math.exp(-(((x - 1835) / 155) ** 2))
      + 18 * jagged(x, 5.7);

// Main Super Destroyer placement (reference space 1400x360)
const SHIP = { x: 675, y: 84, k: 0.88, ox: 50, oy: 70 };
const shipPt = (px, py, bob = 0) => [
  SHIP.x + (px - SHIP.ox) * SHIP.k,
  SHIP.y + (py - SHIP.oy) * SHIP.k + bob,
];
const EMIT = [468, 286];               // ventral orbital strike emitter
const POD_BAYS = [[360, 238], [414, 240], [468, 242]];
const ENGINES = [
  [1274, 198, 1.2],
  [1274, 214, 1.05],
  [1274, 232, 0.9],
  [1252, 206, 0.72],
  [1252, 224, 0.72],
];
const LIGHTS = [
  { p: [188, 76], c: '130,205,255', rate: 0.55, ph: 0.0 },
  { p: [338, 70], c: '130,205,255', rate: 0.42, ph: 1.7 },
  { p: [565, 86], c: '130,205,255', rate: 0.48, ph: 0.9 },
  { p: [288, 92], c: '255,75,60', rate: 0.85, ph: 0.4 },
  { p: [425, 82], c: '255,75,60', rate: 0.75, ph: 2.2 },
  { p: [1238, 86], c: '255,75,60', rate: 0.68, ph: 1.4 },
];
const PORTS = [
  [218, 174], [220, 238], // twin bow shield thrusters
  [526, 194], [526, 254], // mid-hull maneuvering ports
];

// Secondary fleet ships in orbit (positioned cleanly away from the planet disc)
const FLEET = [
  { x: 1410, y: 315, k: 0.25, phase: 1.2, emit: [468, 286], canFire: true },
  { x: 540, y: 365, k: 0.17, phase: 3.7, emit: [468, 286], canFire: true },
  { x: 1180, y: 415, k: 0.12, phase: 5.1, emit: [468, 286], canFire: false },
];

const layers = {};

// ---------------------------------------------------------------------------
// Detailed Super Destroyer renderer
// ---------------------------------------------------------------------------
const HULL_SIL = {
  neck: [195, 112, 315, 108, 315, 258, 205, 250],
  midTop: [275, 108, 345, 92, 540, 104, 575, 118, 575, 175, 270, 165],
  midBay: [262, 160, 560, 172, 552, 266, 480, 282, 320, 272, 252, 236],
  rearUpper: [548, 114, 1246, 152, 1258, 166, 1256, 210, 548, 182],
  rearLower: [548, 178, 1272, 204, 1270, 240, 1185, 244, 690, 216, 548, 208],
  prowTop: [96, 94, 242, 98, 198, 184, 52, 178],
  prowNose: [50, 178, 224, 184, 224, 228, 50, 218],
  prowBot: [56, 218, 200, 226, 262, 306, 132, 294],
};

function drawShipSilhouette(g, fn) {
  for (const [k, pts] of Object.entries(HULL_SIL)) fn(k, pts);
}

function renderShip(scale) {
  const S = SHIP.k * scale, X0 = 30, Y0 = 55, W = 1310, H = 295;
  const c = mk(W * S, H * S), g = c.getContext('2d');
  g.setTransform(S, 0, 0, S, -X0 * S, -Y0 * S);
  g.lineJoin = 'round';
  g.lineCap = 'round';

  const vGrad = (y0, y1, c0, c1, c2) => {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, c0);
    if (c2) { gr.addColorStop(0.55, c1); gr.addColorStop(1, c2); }
    else gr.addColorStop(1, c1);
    return gr;
  };

  // --- 1. Dorsal bridge wing & communication masts (behind hull) ---
  poly(g, [328, 72, 476, 76, 488, 98, 322, 96]);
  g.fillStyle = vGrad(72, 98, '#3d4247', '#202327');
  g.fill();
  g.strokeStyle = 'rgba(180,185,190,0.28)'; g.lineWidth = 1; g.stroke();

  // Antenna array
  g.strokeStyle = '#484d52'; g.lineWidth = 1.4;
  for (const [x, y0, y1] of [[188, 96, 76], [248, 102, 80], [272, 102, 84], [338, 92, 70], [565, 114, 86], [1206, 148, 94], [1238, 150, 86]]) {
    g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke();
  }

  // Long dorsal gantry lattice along the spine
  const spineTop = (x) => 114 + (x - 560) * (36 / 680);
  g.strokeStyle = '#25282c'; g.lineWidth = 2.6;
  g.beginPath();
  g.moveTo(600, spineTop(600) - 15);
  g.lineTo(1235, spineTop(1235) - 14);
  g.stroke();
  g.strokeStyle = '#383c42'; g.lineWidth = 1.3;
  g.beginPath();
  g.moveTo(600, spineTop(600) - 9);
  g.lineTo(1235, spineTop(1235) - 8);
  g.stroke();
  for (let x = 608; x <= 1228; x += 34) {
    const y = spineTop(x);
    g.beginPath();
    g.moveTo(x, y - 15); g.lineTo(x, y + 1);
    g.moveTo(x, y - 14); g.lineTo(x + 34, y - 6);
    g.stroke();
  }
  // Twin stern vertical stabilizers / gantry towers
  g.fillStyle = '#262a2e';
  g.fillRect(1200, 96, 10, 62);
  g.fillRect(1232, 88, 12, 74);
  g.fillStyle = '#3d4248';
  g.fillRect(1200, 96, 3, 62);
  g.fillRect(1232, 88, 3, 74);

  // --- 2. Recessed neck & mechanical structure between bow shields and mid-hull ---
  poly(g, HULL_SIL.neck);
  g.fillStyle = vGrad(108, 258, '#23272c', '#121417');
  g.fill();
  // Neck structural ribs & airlock bay
  g.fillStyle = '#1b1f23';
  g.fillRect(212, 134, 62, 34);
  g.fillRect(216, 198, 56, 38);
  g.strokeStyle = '#343940'; g.lineWidth = 2;
  for (const y of [124, 152, 180, 212, 236]) {
    g.beginPath(); g.moveTo(205, y); g.lineTo(278, y + 2); g.stroke();
  }

  // Ventral dark observation bay / bridge under-hang (tinted armored glass)
  poly(g, [550, 200, 725, 212, 715, 248, 595, 244, 550, 224]);
  g.fillStyle = vGrad(200, 248, '#0b1c24', '#16313f', '#091318');
  g.fill();
  g.strokeStyle = 'rgba(90,150,180,0.28)'; g.lineWidth = 1; g.stroke();
  g.strokeStyle = '#111619'; g.lineWidth = 2;
  for (const x of [595, 638, 680]) {
    g.beginPath(); g.moveTo(x, 204); g.lineTo(x - 6, 245); g.stroke();
  }
  // Ventral sensor dome & chin turret under mid-hull
  poly(g, [535, 244, 650, 252, 636, 268, 548, 264]);
  g.fillStyle = '#23272b'; g.fill();
  poly(g, [440, 272, 515, 274, 505, 294, 452, 292]);
  g.fillStyle = '#1b1e22'; g.fill();
  g.strokeStyle = '#383d42'; g.lineWidth = 2.6;
  g.beginPath();
  g.moveTo(492, 288); g.lineTo(524, 312);
  g.moveTo(478, 290); g.lineTo(510, 314);
  g.stroke();

  // Hanging ordnance / turret batteries under the rear spine
  for (const [x, y, s] of [[760, 218, 1], [855, 224, 0.95], [935, 228, 0.85]]) {
    g.save(); g.translate(x, y); g.scale(s, s);
    poly(g, [-22, -2, 22, 0, 16, 20, -16, 18]);
    g.fillStyle = '#1e2125'; g.fill();
    g.strokeStyle = '#34393f'; g.lineWidth = 3.2;
    g.beginPath();
    g.moveTo(-8, 14); g.lineTo(-22, 32);
    g.moveTo(4, 15); g.lineTo(-10, 34);
    g.stroke();
    g.restore();
  }

  // --- 3. Rear Spine / Main Boom (SES Super Earth Ship) ---
  poly(g, HULL_SIL.rearLower);
  g.fillStyle = vGrad(178, 244, '#2b2f34', '#181a1d');
  g.fill();

  poly(g, HULL_SIL.rearUpper);
  g.fillStyle = vGrad(114, 210, '#4a4f55', '#34383d', '#24272b');
  g.fill();
  g.strokeStyle = 'rgba(185,190,195,0.28)'; g.lineWidth = 1; g.stroke();

  poly(g, [548, 114, 1246, 152, 1236, 164, 548, 128]);
  g.fillStyle = '#575c63'; g.fill();

  // Panel seams along rear spine
  g.strokeStyle = 'rgba(0,0,0,0.48)'; g.lineWidth = 1.1;
  for (let x = 610; x < 1230; x += 62) {
    const yt = spineTop(x);
    g.beginPath(); g.moveTo(x, yt + 12); g.lineTo(x - 4, yt + 84); g.stroke();
  }
  g.beginPath();
  g.moveTo(555, 168); g.lineTo(1254, 202);
  g.moveTo(555, 184); g.lineTo(1268, 216);
  g.stroke();

  // Yellow "SES" hull livery & 3-stripe Helldivers insignia
  g.save();
  g.translate(680, 146);
  g.rotate(0.052);
  g.fillStyle = '#c8b456';
  g.font = 'italic 800 15px system-ui, sans-serif';
  g.fillText('SES SUPER EARTH', 0, 0);
  for (let i = 0; i < 3; i++) {
    const y = -11 + i * 4.5;
    poly(g, [152 + i * 6, y, 290 - i * 8, y, 286 - i * 8, y + 2.6, 150 + i * 6, y + 2.6]);
    g.fill();
  }
  g.restore();

  // Small white hull LED strip dots along spine
  g.fillStyle = 'rgba(215,235,255,0.75)';
  for (const x of [618, 690, 704, 835, 960, 1085, 1190]) {
    const y = 171 + (x - 560) * 0.048;
    g.fillRect(x, y, 6, 1.8);
  }

  // --- 4. Mid-Hull Block (Bridge + 3 Broadside Drop Bays + Louvered Thruster Pod) ---
  poly(g, HULL_SIL.midTop);
  g.fillStyle = vGrad(92, 175, '#50555b', '#33373c');
  g.fill();
  poly(g, [275, 108, 345, 92, 540, 104, 540, 116, 275, 118]);
  g.fillStyle = '#5c6168'; g.fill();
  g.strokeStyle = '#c5b152'; g.lineWidth = 2.2;
  g.beginPath(); g.moveTo(310, 124); g.lineTo(542, 134); g.stroke();

  // Bridge superstructure + glowing red bridge windows
  poly(g, [292, 92, 460, 88, 468, 106, 284, 108]);
  g.fillStyle = '#2d3136'; g.fill();
  g.fillStyle = 'rgba(255,85,65,0.92)';
  for (const x of [302, 314, 326, 368, 382, 418]) g.fillRect(x, 97, 7, 2.8);

  // Broadside lower hull
  poly(g, HULL_SIL.midBay);
  g.fillStyle = vGrad(160, 282, '#3a3e44', '#222529', '#141619');
  g.fill();
  g.strokeStyle = 'rgba(170,175,180,0.22)'; g.lineWidth = 1; g.stroke();

  // Three prominent broadside drop-bay pods
  for (let i = 0; i < 3; i++) {
    const bx = 334 + i * 54, by = 188 + i * 2;
    poly(g, [bx + 4, by - 22, bx + 48, by - 20, bx + 44, by, bx, by - 2]);
    g.fillStyle = '#43484e'; g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 1; g.stroke();
    g.fillStyle = '#17191c';
    g.fillRect(bx, by, 46, 44);
    g.strokeStyle = '#c5b152'; g.lineWidth = 1.8;
    g.strokeRect(bx + 2, by + 2, 42, 40);
    g.fillStyle = '#24282d';
    g.fillRect(bx + 6, by + 7, 34, 28);
    g.fillStyle = '#d8c35c';
    g.fillRect(bx + 17, by + 20, 12, 3);
    g.fillStyle = 'rgba(210,235,255,0.85)';
    g.fillRect(bx + 8, by + 37, 6, 2);
    g.fillRect(bx + 32, by + 37, 6, 2);
  }

  // Aft mid-hull louvered radiator & thruster block
  poly(g, [500, 174, 558, 176, 550, 264, 496, 262]);
  g.fillStyle = '#262a2f'; g.fill();
  g.strokeStyle = '#c5b152'; g.lineWidth = 2.4;
  g.beginPath(); g.moveTo(498, 200); g.lineTo(496, 246); g.stroke();
  g.strokeStyle = '#0e1012'; g.lineWidth = 2.2;
  for (let y = 202; y <= 244; y += 5) {
    g.beginPath(); g.moveTo(504, y); g.lineTo(544, y - 2); g.stroke();
  }
  for (const [px, py] of [[526, 194], [526, 254]]) {
    g.fillStyle = '#121417';
    g.beginPath(); g.arc(px, py, 7.5, 0, TAU); g.fill();
    g.strokeStyle = '#4c525a'; g.lineWidth = 1.5; g.stroke();
  }

  // --- 5. Iconic Twin-Winged Bow Armor Shields (Prow) ---
  poly(g, HULL_SIL.prowNose);
  g.fillStyle = vGrad(178, 228, '#282c30', '#15171a');
  g.fill();
  g.strokeStyle = '#0c0d0f'; g.lineWidth = 2.2;
  for (let y = 188; y <= 216; y += 5.5) {
    g.beginPath(); g.moveTo(58, y); g.lineTo(178, y + 3); g.stroke();
  }
  g.fillStyle = '#2d3237';
  g.fillRect(190, 184, 28, 42);
  g.strokeStyle = '#121417'; g.lineWidth = 1.8;
  for (let y = 188; y <= 222; y += 4.5) {
    g.beginPath(); g.moveTo(193, y); g.lineTo(215, y); g.stroke();
  }

  // Upper Bow Shield
  poly(g, HULL_SIL.prowTop);
  g.fillStyle = vGrad(94, 184, '#585e66', '#3d4248', '#2a2e33');
  g.fill();
  g.strokeStyle = 'rgba(200,205,210,0.35)'; g.lineWidth = 1.2; g.stroke();
  g.fillStyle = 'rgba(18,20,23,0.42)';
  poly(g, [122, 134, 164, 135, 146, 172, 102, 170]); g.fill();
  poly(g, [170, 135, 198, 136, 180, 173, 152, 172]); g.fill();
  poly(g, [224, 98, 242, 98, 198, 184, 180, 184]);
  g.fillStyle = '#23262a'; g.fill();
  g.strokeStyle = '#d4be58'; g.lineWidth = 3.6;
  g.beginPath(); g.moveTo(234, 100); g.lineTo(191, 182); g.stroke();

  // Lower Bow Shield
  poly(g, HULL_SIL.prowBot);
  g.fillStyle = vGrad(218, 306, '#383c42', '#23262b', '#16181c');
  g.fill();
  g.strokeStyle = 'rgba(160,165,170,0.25)'; g.lineWidth = 1; g.stroke();
  g.fillStyle = 'rgba(10,12,14,0.48)';
  poly(g, [106, 232, 152, 235, 178, 272, 132, 268]); g.fill();
  poly(g, [158, 236, 186, 238, 214, 276, 184, 273]); g.fill();
  g.strokeStyle = '#d4be58'; g.lineWidth = 3.4;
  g.beginPath(); g.moveTo(193, 228); g.lineTo(255, 303); g.stroke();

  for (const [px, py] of [[218, 174], [220, 238]]) {
    g.fillStyle = '#101215';
    g.beginPath(); g.arc(px, py, 8.5, 0, TAU); g.fill();
    g.strokeStyle = '#585e66'; g.lineWidth = 1.6; g.stroke();
  }

  return { canvas: c, x: X0, y: Y0, w: W, h: H };
}

function renderUnderlight(scale) {
  const S = SHIP.k * scale, X0 = 30, Y0 = 55, W = 1310, H = 295;
  const c = mk(W * S, H * S), g = c.getContext('2d');
  g.setTransform(S, 0, 0, S, -X0 * S, -Y0 * S);
  const gr = g.createLinearGradient(0, 155, 0, 315);
  gr.addColorStop(0, 'rgba(255,60,40,0)');
  gr.addColorStop(0.55, 'rgba(255,70,45,0.28)');
  gr.addColorStop(1, 'rgba(255,95,60,0.85)');
  g.fillStyle = gr;
  drawShipSilhouette(g, (n, pts) => { poly(g, pts); g.fill(); });
  return c;
}

function renderBackdrop(scale) {
  const c = mk(VW * scale, VH * scale), g = c.getContext('2d');
  g.setTransform(scale, 0, 0, scale, 0, 0);
  const R = mkRng(104729);

  // Rich war-torn orbital sky gradient
  const sky = g.createLinearGradient(0, 0, 0, 920);
  sky.addColorStop(0.00, '#040407');
  sky.addColorStop(0.32, '#0a0709');
  sky.addColorStop(0.58, '#190b0b');
  sky.addColorStop(0.78, '#36130f');
  sky.addColorStop(0.92, '#632114');
  sky.addColorStop(1.00, '#8c3119');
  g.fillStyle = sky;
  g.fillRect(0, 0, VW, VH);

  // Subtle upper-space nebula & war-smoke glow
  for (const [cx, cy, rx, ry, col, a] of [
    [980, 760, 980, 260, '220,70,30', 0.25],
    [325, 275, 420, 220, '120,55,35', 0.12],
    [1480, 240, 520, 200, '90,35,45', 0.10],
  ]) {
    g.save();
    g.translate(cx, cy);
    g.scale(rx / 100, ry / 100);
    const rg = g.createRadialGradient(0, 0, 0, 0, 0, 100);
    rg.addColorStop(0, `rgba(${col},${a})`);
    rg.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = rg;
    g.fillRect(-100, -100, 200, 200);
    g.restore();
  }

  // Ringed planet geometry
  const px = 320, py = 275, pr = 148, ringTilt = -0.24;

  // Starfield (excluding planet disc)
  for (let i = 0; i < 580; i++) {
    const x = R() * VW, y = R() * 790;
    if (Math.hypot(x - px, y - py) < pr - 2) continue;
    const hFade = 1 - 0.75 * smooth((y - 350) / 450);
    const a = (0.14 + R() * 0.65) * hFade;
    const warm = R() < 0.35;
    const sz = R() < 0.08 ? 2.1 : R() < 0.25 ? 1.4 : 1.0;
    g.fillStyle = warm ? `rgba(255,225,195,${a})` : `rgba(215,230,255,${a})`;
    g.fillRect(x, y, sz, sz);
  }

  const drawRings = (front) => {
    g.save();
    g.translate(px, py);
    g.rotate(ringTilt);
    g.scale(1, 0.26);
    const a0 = front ? 0 : Math.PI;
    const a1 = front ? Math.PI : TAU;
    const bands = [
      [pr * 1.30, 7, 'rgba(215,150,95,0.14)'],
      [pr * 1.42, 13, 'rgba(235,175,115,0.26)'],
      [pr * 1.54, 5, 'rgba(160,105,70,0.13)'],
      [pr * 1.66, 16, 'rgba(210,145,95,0.20)'],
      [pr * 1.80, 6, 'rgba(175,115,80,0.10)'],
    ];
    for (const [r, w, col] of bands) {
      g.strokeStyle = col;
      g.lineWidth = w;
      g.beginPath();
      g.arc(0, 0, r, a0, a1);
      g.stroke();
    }
    if (!front) {
      g.globalCompositeOperation = 'source-atop';
      const sg = g.createRadialGradient(50, -18, pr * 0.2, 50, -18, pr * 1.2);
      sg.addColorStop(0, 'rgba(5,4,6,0.88)');
      sg.addColorStop(1, 'rgba(5,4,6,0)');
      g.fillStyle = sg;
      g.fillRect(-pr * 2, -pr * 2, pr * 4, pr * 4);
    }
    g.restore();
  };

  drawRings(false);

  // Soft sunlit crescent glow on upper-left limb (no hard clip circle)
  const halo = g.createRadialGradient(px - 35, py - 35, pr * 0.5, px - 25, py - 25, pr * 1.25);
  halo.addColorStop(0, 'rgba(240,145,75,0.16)');
  halo.addColorStop(0.65, 'rgba(220,105,45,0.05)');
  halo.addColorStop(1, 'rgba(220,100,45,0)');
  g.fillStyle = halo;
  g.fillRect(px - pr * 1.6, py - pr * 1.6, pr * 3.2, pr * 3.2);

  // Planet body + surface bands + terminator
  g.save();
  g.beginPath(); g.arc(px, py, pr, 0, TAU); g.clip();

  const pg = g.createRadialGradient(px - 68, py - 62, 14, px + 24, py + 24, pr * 1.08);
  pg.addColorStop(0.00, '#634335');
  pg.addColorStop(0.36, '#3b2721');
  pg.addColorStop(0.68, '#170f0e');
  pg.addColorStop(1.00, '#060405');
  g.fillStyle = pg;
  g.fillRect(px - pr, py - pr, pr * 2, pr * 2);

  g.save();
  g.translate(px, py);
  g.rotate(ringTilt * 0.7);
  for (let i = -6; i <= 6; i++) {
    const by = i * 20 + (R() - 0.5) * 7;
    const bh = 5 + R() * 11;
    g.fillStyle = i % 2 ? 'rgba(130,82,60,0.09)' : 'rgba(12,6,6,0.18)';
    g.fillRect(-pr, by, pr * 2, bh);
  }
  g.restore();

  // Re-apply terminator shadow over the surface bands so night side is pitch dark
  const term = g.createLinearGradient(px - pr * 0.5, py - pr * 0.5, px + pr * 0.75, py + pr * 0.75);
  term.addColorStop(0, 'rgba(0,0,0,0)');
  term.addColorStop(0.45, 'rgba(5,3,4,0.25)');
  term.addColorStop(0.8, 'rgba(5,3,4,0.85)');
  term.addColorStop(1, 'rgba(5,3,4,0.96)');
  g.fillStyle = term;
  g.fillRect(px - pr, py - pr, pr * 2, pr * 2);

  // Crisp sunlit crescent rim on top-left
  g.strokeStyle = 'rgba(255,175,100,0.55)';
  g.lineWidth = 3.2;
  g.beginPath(); g.arc(px, py, pr - 1, Math.PI * 0.88, Math.PI * 1.62); g.stroke();
  // Subtle red warzone bounce light on bottom edge
  g.strokeStyle = 'rgba(210,65,35,0.22)';
  g.lineWidth = 2.5;
  g.beginPath(); g.arc(px, py, pr - 1, Math.PI * 0.15, Math.PI * 0.58); g.stroke();
  g.restore();

  drawRings(true);

  // Fiery warzone horizon haze
  const hz = g.createLinearGradient(0, 640, 0, 880);
  hz.addColorStop(0.0, 'rgba(140,40,20,0)');
  hz.addColorStop(0.6, 'rgba(195,60,28,0.35)');
  hz.addColorStop(1.0, 'rgba(245,100,38,0.58)');
  g.fillStyle = hz;
  g.fillRect(0, 640, VW, 240);

  return c;
}

function renderRidge(scale, fn, yMin, topCol, botCol, edgeCol, valleyMistCol) {
  const c = mk(VW * scale, VH * scale), g = c.getContext('2d');
  g.setTransform(scale, 0, 0, scale, 0, 0);
  g.beginPath();
  g.moveTo(0, VH);
  for (let x = 0; x <= VW; x += 4) g.lineTo(x, fn(x));
  g.lineTo(VW, VH);
  g.closePath();
  const gr = g.createLinearGradient(0, yMin, 0, VH);
  gr.addColorStop(0, topCol);
  gr.addColorStop(1, botCol);
  g.fillStyle = gr;
  g.fill();

  if (edgeCol) {
    g.strokeStyle = edgeCol;
    g.lineWidth = 1.6;
    g.beginPath();
    for (let x = 0; x <= VW; x += 4) x ? g.lineTo(x, fn(x)) : g.moveTo(x, fn(x));
    g.stroke();
  }

  // Smooth backlit warzone mist rising from the valley behind the NEXT ridge
  if (valleyMistCol) {
    const mg = g.createLinearGradient(0, yMin + 10, 0, yMin + 115);
    mg.addColorStop(0, 'rgba(0,0,0,0)');
    mg.addColorStop(0.55, valleyMistCol);
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = mg;
    g.fillRect(0, yMin + 10, VW, 110);
  }
  return c;
}

function renderSmokeBand(scale) {
  const c = mk(2400 * scale, 220 * scale), g = c.getContext('2d');
  g.setTransform(scale, 0, 0, scale, 0, 0);
  const R = mkRng(5512);
  for (let i = 0; i < 55; i++) {
    const x = R() * 2400, y = 110 + (R() - 0.5) * 80, r = 70 + R() * 140;
    for (const ox of [-2400, 0, 2400]) {
      const gr = g.createRadialGradient(x + ox, y, 0, x + ox, y, r);
      gr.addColorStop(0, 'rgba(210,85,45,0.09)');
      gr.addColorStop(1, 'rgba(120,35,20,0)');
      g.fillStyle = gr;
      g.save();
      g.translate(x + ox, y);
      g.scale(1, 0.36);
      g.translate(-(x + ox), -y);
      g.fillRect(x + ox - r, y - r, r * 2, r * 2);
      g.restore();
    }
  }
  return c;
}

// ---- dynamic state ----------------------------------------------------------
const st = {
  beam: { phase: 'on', t: 0, len: 1, I: 1, flick: 1, tx: 1035, ty: 918, glow: 0.95, onFor: 11 },
  blueBeacons: [],
  fleetBeams: [],
  pods: [],
  impacts: [],
  twinkles: [],
  booms: [],
  tracers: [],
  dust: [],
  embers: [],
  shipBob: 0,
};

function scheduleBeam(delay) { after(delay, igniteBeam); }
function igniteBeam() {
  const b = st.beam;
  b.phase = 'ignite'; b.t = 0; b.len = 0;
  b.tx = range(940, 1160);
  b.ty = nearRidge(b.tx) + 4;
  b.onFor = range(9, 14);
  after(range(2.2, 4.0), () => dropPod(true));
  after(range(6.5, 8.2), () => dropPod(true));
}

function dropPod(onTarget = true, customProgress = 0) {
  if (st.beam.phase !== 'on' && st.beam.phase !== 'ignite') return;
  const bay = pick(POD_BAYS);
  const [sx, sy] = shipPt(bay[0], bay[1], st.shipBob);
  const offset = onTarget ? range(-6, 6) : range(-140, 140);
  const tx = st.beam.tx + offset;
  const ty = (onTarget ? nearRidge(tx) : midRidge(tx)) + 4;
  const dur = range(0.95, 1.25);
  st.pods.push({ sx, sy, tx, ty, t: customProgress * dur, dur, main: onTarget });
}

function podImpact(p) {
  st.impacts.push({ t: 0, x: p.tx, y: p.ty, scale: p.main ? 1 : 0.65 });
  const cnt = p.main ? 52 : 28;
  for (let i = 0; i < cnt; i++) {
    const a = -Math.PI / 2 + range(-1.35, 1.35), sp = range(90, 440) * (p.main ? 1 : 0.75);
    st.dust.push({
      x: p.tx, y: p.ty,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: range(0.65, 1.7), age: 0, r: range(1.5, 4.2), hot: rand() < 0.6,
    });
  }
  if (p.main && st.beam.t > st.beam.onFor - 2.5) {
    after(range(1.2, 2.2), () => {
      if (st.beam.phase === 'on') { st.beam.phase = 'shutdown'; st.beam.t = 0; }
    });
  }
}

function spawnFleetStrike(initialProgress = 0) {
  const f = pick(FLEET.filter((s) => s.canFire));
  if (!f) return;
  const sx = f.x + (f.emit[0] - SHIP.ox) * f.k;
  const sy = f.y + (f.emit[1] - SHIP.oy) * f.k;
  const tx = clamp(sx + range(-140, 190), 180, VW - 180);
  const ty = distMesa(tx) + 4;
  const dur = range(3.5, 5.5);
  st.fleetBeams.push({ sx, sy, tx, ty, t: initialProgress * dur, dur });
  after(0.6, () => {
    st.booms.push({ x: tx, y: ty, t: 0, life: 2.5, size: range(60, 95), plume: true });
  });
}

function spawnBlueBeacon(initialProgress = 0) {
  if (st.blueBeacons.length >= 2) return;
  let x = range(220, 420);
  if (st.blueBeacons.length === 1) x = range(1740, 1840);
  const y = midRidge(x) + 3;
  const dur = range(7, 12);
  st.blueBeacons.push({ x, y, t: initialProgress * dur, dur });
}

function farBoom() {
  let x = range(140, 1780);
  if (Math.abs(x - st.beam.tx) < 160) x += 300;
  const big = rand() < 0.42;
  const useMid = rand() < 0.45;
  const y = (useMid ? farRidge(x) : distMesa(x)) + range(-2, 8);
  st.booms.push({
    x, y, t: 0,
    life: big ? range(2.2, 3.2) : range(1.4, 2.0),
    size: big ? range(72, 118) : range(34, 62),
    plume: big,
  });
}

function tracerBurst() {
  const automaton = rand() < 0.62;
  const x0 = range(160, 1760);
  const y0 = (rand() < 0.5 ? farRidge(x0) : midRidge(x0)) - 2;
  const ang = automaton ? range(-0.95, -0.35) : range(-2.6, -1.9);
  const sp = range(460, 740);
  const n = 4 + Math.floor(rand() * 5);
  for (let i = 0; i < n; i++) {
    after(i * range(0.06, 0.14), () => {
      const a = ang + range(-0.06, 0.06);
      st.tracers.push({
        x: x0 + range(-18, 18), y: y0,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        t: 0, life: range(0.65, 1.15),
        c: automaton ? '255,65,55' : '255,215,95',
      });
    });
  }
}

LW.start({
  init() {
    for (let i = 0; i < 55; i++) {
      st.twinkles.push({
        x: range(0, VW), y: range(30, 680),
        ph: range(0, TAU), rate: range(0.4, 1.7), s: range(1, 2.3),
      });
    }
    igniteBeam();
    st.beam.phase = 'on'; st.beam.len = 1; st.beam.I = 1; st.beam.glow = 0.95;
    spawnBlueBeacon(0.15);
    spawnFleetStrike(0.1);
    for (let i = 0; i < 4; i++) farBoom();
    // Ensure a pod is mid-flight around t=8 and another impacts around t=4
    after(7.45, () => dropPod(true));
    after(6.8, () => spawnFleetStrike(0));
    after(6.5, () => spawnBlueBeacon(0));

    every(1.8, 5.2, farBoom);
    every(2.5, 7.5, tracerBurst);
    every(5.0, 11.0, () => spawnFleetStrike(0));
    every(6.0, 13.0, () => spawnBlueBeacon(0));
  },
  resize(view) {
    const s = Math.min(2, Math.max(0.5, view.scale));
    layers.backdrop = renderBackdrop(s);
    layers.mesa = renderRidge(s, distMesa, 700, '#2e1410', '#180a09', 'rgba(225,85,42,0.36)', 'rgba(215,75,35,0.16)');
    layers.far = renderRidge(s, farRidge, 760, '#220f0d', '#120808', 'rgba(185,68,36,0.40)', 'rgba(185,60,30,0.14)');
    layers.mid = renderRidge(s, midRidge, 820, '#150b0a', '#0a0606', 'rgba(135,48,28,0.44)', 'rgba(140,42,22,0.12)');
    layers.near = renderRidge(s, nearRidge, 870, '#0a0606', '#030202', 'rgba(95,35,22,0.55)', null);
    layers.smoke = renderSmokeBand(s);
    layers.ship = renderShip(s);
    layers.under = renderUnderlight(s);
  },
  update(dt, t) {
    const b = st.beam;
    st.shipBob = Math.sin(t * 0.32) * 3.5 + Math.sin(t * 0.13 + 1.1) * 2;
    b.t += dt;
    if (b.phase === 'ignite') {
      b.len = 1 - Math.pow(1 - clamp(b.t / 0.42, 0, 1), 3);
      b.I = 1.35;
      if (b.t >= 0.42) { b.phase = 'on'; b.t = 0; }
    } else if (b.phase === 'on') {
      b.len = 1;
      if (rand() < dt * 2.2) b.flick = range(0.62, 0.88);
      else b.flick = Math.min(1, b.flick + dt * 4);
      b.I = (0.88 + 0.12 * Math.sin(t * TAU * 1.4)) * b.flick;
      if (b.t > b.onFor + 4 && !st.pods.length) { b.phase = 'shutdown'; b.t = 0; }
    } else if (b.phase === 'shutdown') {
      const p = clamp(b.t / 0.48, 0, 1);
      b.I = (1 - p) * (Math.floor(b.t * 30) % 2 ? range(0.2, 1) : 1);
      if (p >= 1) { b.phase = 'off'; b.I = 0; b.len = 0; scheduleBeam(range(1.6, 3.8)); }
    }
    const target = b.len >= 1 ? b.I : 0;
    b.glow += (target - b.glow) * clamp(dt * (target > b.glow ? 8 : 2.4), 0, 1);

    for (let i = st.pods.length - 1; i >= 0; i--) {
      const p = st.pods[i];
      p.t += dt;
      if (p.t >= p.dur) { st.pods.splice(i, 1); podImpact(p); }
    }
    for (let i = st.impacts.length - 1; i >= 0; i--) {
      st.impacts[i].t += dt;
      if (st.impacts[i].t > 2.4) st.impacts.splice(i, 1);
    }
    for (let i = st.fleetBeams.length - 1; i >= 0; i--) {
      st.fleetBeams[i].t += dt;
      if (st.fleetBeams[i].t >= st.fleetBeams[i].dur) st.fleetBeams.splice(i, 1);
    }
    for (let i = st.blueBeacons.length - 1; i >= 0; i--) {
      st.blueBeacons[i].t += dt;
      if (st.blueBeacons[i].t >= st.blueBeacons[i].dur) st.blueBeacons.splice(i, 1);
    }
    for (const d of st.dust) {
      d.age += dt; d.vy += 520 * dt; d.vx *= 1 - dt * 1.4;
      d.x += d.vx * dt; d.y += d.vy * dt;
    }
    st.dust = st.dust.filter((d) => d.age < d.life && d.y < nearRidge(d.x) + 24);
    for (const m of st.booms) m.t += dt;
    st.booms = st.booms.filter((m) => m.t < m.life);
    for (const r of st.tracers) {
      r.t += dt; r.vy += 90 * dt; r.x += r.vx * dt; r.y += r.vy * dt;
    }
    st.tracers = st.tracers.filter((r) => r.t < r.life);

    if (b.glow > 0.3 && rand() < dt * 16) {
      st.embers.push({
        x: b.tx + range(-65, 65), y: b.ty - range(0, 12),
        vx: range(-18, 18), vy: -range(28, 78),
        age: 0, life: range(1.5, 3.6),
      });
    }
    for (const e of st.embers) {
      e.age += dt;
      e.x += (e.vx + Math.sin(e.age * 3 + e.x) * 14) * dt;
      e.y += e.vy * dt;
    }
    st.embers = st.embers.filter((e) => e.age < e.life);
  },
  draw(ctx, t) {
    const b = st.beam, bob = st.shipBob;
    const L = layers.ship;
    ctx.drawImage(layers.backdrop, 0, 0, VW, VH);

    // Twinkling stars
    ctx.globalCompositeOperation = 'lighter';
    for (const s of st.twinkles) {
      if (Math.hypot(s.x - 320, s.y - 275) < 152) continue;
      const a = 0.25 + 0.75 * Math.max(0, Math.sin(t * s.rate + s.ph)) ** 3;
      ctx.fillStyle = `rgba(255,235,215,${a * 0.75})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }

    // Distant fleet Super Destroyers in background orbit
    ctx.globalCompositeOperation = 'source-over';
    for (const f of FLEET) {
      const fbob = Math.sin(t * 0.26 + f.phase) * 2;
      const fx = f.x, fy = f.y + fbob;
      ctx.save();
      ctx.globalAlpha = 0.58 + f.k * 1.1;
      ctx.drawImage(L.canvas, fx, fy, L.w * f.k, L.h * f.k);
      ctx.restore();
      ctx.globalCompositeOperation = 'lighter';
      const ex = fx + (1274 - SHIP.ox) * f.k, ey = fy + (214 - SHIP.oy) * f.k;
      const eg = ctx.createLinearGradient(ex, ey, ex + 80 * f.k, ey);
      eg.addColorStop(0, 'rgba(160,215,255,0.75)');
      eg.addColorStop(1, 'rgba(70,140,255,0)');
      ctx.fillStyle = eg;
      ctx.fillRect(ex, ey - 5 * f.k, 80 * f.k, 10 * f.k);
      ctx.globalCompositeOperation = 'source-over';
    }

    // Fleet orbital laser beams
    ctx.globalCompositeOperation = 'lighter';
    for (const fb of st.fleetBeams) {
      const p = fb.t / fb.dur;
      const a = smooth(p / 0.15) * (1 - smooth((p - 0.75) / 0.25));
      for (const [w, al] of [[14, 0.08], [6, 0.22], [2, 0.65]]) {
        ctx.strokeStyle = `rgba(255,90,55,${al * a})`;
        ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(fb.sx, fb.sy); ctx.lineTo(fb.tx, fb.ty); ctx.stroke();
      }
    }

    // Distant 500kg explosions & artillery flashes
    for (const m of st.booms) {
      const p = m.t / m.life;
      const flash = Math.max(0, 1 - p * 2.2);
      const glow = Math.sin(Math.PI * Math.min(1, p * 1.35));
      const r = m.size * (0.55 + p * 0.85);
      const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, r * 2.5);
      g.addColorStop(0, `rgba(255,${220 - 85 * p},130,${0.95 * flash + 0.3 * glow})`);
      g.addColorStop(0.32, `rgba(240,105,35,${0.42 * glow})`);
      g.addColorStop(1, 'rgba(130,35,15,0)');
      ctx.fillStyle = g;
      ctx.fillRect(m.x - r * 2.5, m.y - r * 2.5, r * 5, r * 5);
      if (m.plume && p < 0.75) {
        const domeR = r * (0.4 + p * 1.1);
        ctx.strokeStyle = `rgba(255,190,120,${(1 - p / 0.75) * 0.45})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(m.x, m.y, domeR, Math.PI, TAU);
        ctx.stroke();
      }
    }

    // AA / Automaton laser crossfire
    for (const r of st.tracers) {
      const a = 1 - r.t / r.life;
      ctx.strokeStyle = `rgba(${r.c},${a * 0.35})`;
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx * 0.055, r.y - r.vy * 0.055); ctx.stroke();
      ctx.strokeStyle = `rgba(${r.c},${a})`;
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx * 0.055, r.y - r.vy * 0.055); ctx.stroke();
    }

    // Rank 0 & 1 ridges + drifting war smoke
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(layers.mesa, 0, 0, VW, VH);
    const smx = -((t * 14) % 2400);
    ctx.drawImage(layers.smoke, smx, 665, 2400, 220);
    ctx.drawImage(layers.smoke, smx + 2400, 665, 2400, 220);
    ctx.drawImage(layers.far, 0, 0, VW, VH);

    // Secondary blue support-weapon stratagem beacons on mid ridge
    ctx.globalCompositeOperation = 'lighter';
    for (const bb of st.blueBeacons) {
      const p = bb.t / bb.dur;
      const a = smooth(p / 0.12) * (1 - smooth((p - 0.82) / 0.18));
      const bg = ctx.createLinearGradient(bb.x, bb.y, bb.x, bb.y - 340);
      bg.addColorStop(0, `rgba(90,205,255,${0.85 * a})`);
      bg.addColorStop(0.45, `rgba(60,165,255,${0.25 * a})`);
      bg.addColorStop(1, 'rgba(60,165,255,0)');
      ctx.strokeStyle = bg;
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(bb.x, bb.y); ctx.lineTo(bb.x, bb.y - 340); ctx.stroke();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = `rgba(210,245,255,${0.8 * a})`;
      ctx.beginPath(); ctx.moveTo(bb.x, bb.y); ctx.lineTo(bb.x, bb.y - 260); ctx.stroke();
      const rg = ctx.createRadialGradient(bb.x, bb.y, 0, bb.x, bb.y, 55);
      rg.addColorStop(0, `rgba(110,215,255,${0.6 * a})`);
      rg.addColorStop(1, 'rgba(50,140,255,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(bb.x - 55, bb.y - 55, 110, 110);
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(layers.mid, 0, 0, VW, VH);

    // Main red stratagem orbital beam
    const [ex, ey] = shipPt(EMIT[0], EMIT[1], bob);
    ctx.globalCompositeOperation = 'lighter';
    if (b.len > 0 && b.I > 0.01) {
      const x2 = lerp(ex, b.tx, b.len), y2 = lerp(ey, b.ty, b.len), I = clamp(b.I, 0, 1.4);
      ctx.lineCap = 'round';
      for (const [w, a, col] of [
        [68, 0.06, '220,45,30'],
        [36, 0.12, '240,55,40'],
        [16, 0.28, '255,75,55'],
        [6, 0.65, '255,140,110'],
        [2.4, 0.96, '255,235,220'],
      ]) {
        ctx.strokeStyle = `rgba(${col},${a * I})`;
        ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(x2, y2); ctx.stroke();
      }
      const eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, 85);
      eg.addColorStop(0, `rgba(255,150,120,${0.85 * I})`);
      eg.addColorStop(0.4, `rgba(255,65,45,${0.35 * I})`);
      eg.addColorStop(1, 'rgba(255,50,35,0)');
      ctx.fillStyle = eg;
      ctx.fillRect(ex - 85, ey - 85, 170, 170);
    }

    // Ground glow behind near ridge
    if (b.glow > 0.01) {
      const gg = ctx.createRadialGradient(b.tx, b.ty, 0, b.tx, b.ty, 290);
      gg.addColorStop(0, `rgba(255,105,75,${0.82 * b.glow})`);
      gg.addColorStop(0.32, `rgba(235,60,40,${0.35 * b.glow})`);
      gg.addColorStop(1, 'rgba(160,25,15,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(b.tx - 290, b.ty - 290, 580, 580);
    }

    // Hellpods streaking down from the destroyer (tapered plasma wake)
    for (const pod of st.pods) {
      const p = pod.t / pod.dur, e = p * p;
      const px = lerp(pod.sx, pod.tx, e), py = lerp(pod.sy, pod.ty, e);
      const tl = 0.22 + 0.30 * p;
      const qx = lerp(pod.sx, pod.tx, Math.max(0, e - tl));
      const qy = lerp(pod.sy, pod.ty, Math.max(0, e - tl));
      const dx = px - qx, dy = py - qy, L0 = Math.hypot(dx, dy) || 1;
      const nx = -dy / L0, ny = dx / L0;
      const wHead = pod.main ? 5.5 : 3.8;

      const tg = ctx.createLinearGradient(qx, qy, px, py);
      tg.addColorStop(0, 'rgba(240,95,30,0)');
      tg.addColorStop(0.55, 'rgba(255,155,55,0.55)');
      tg.addColorStop(1, 'rgba(255,240,185,0.98)');
      ctx.fillStyle = tg;
      ctx.beginPath();
      ctx.moveTo(qx, qy);
      ctx.lineTo(px + nx * wHead, py + ny * wHead);
      ctx.lineTo(px - nx * wHead, py - ny * wHead);
      ctx.closePath();
      ctx.fill();

      const hr = pod.main ? 42 : 28;
      const hg = ctx.createRadialGradient(px, py, 0, px, py, hr);
      hg.addColorStop(0, 'rgba(255,250,225,1)');
      hg.addColorStop(0.32, 'rgba(255,180,75,0.78)');
      hg.addColorStop(1, 'rgba(255,90,25,0)');
      ctx.fillStyle = hg;
      ctx.fillRect(px - hr, py - hr, hr * 2, hr * 2);
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(layers.near, 0, 0, VW, VH);

    // Foreground ground lighting, impacts, debris & embers
    ctx.globalCompositeOperation = 'lighter';
    if (b.glow > 0.01) {
      ctx.save();
      ctx.translate(b.tx, b.ty);
      ctx.scale(1, 0.28);
      const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, 190);
      sg.addColorStop(0, `rgba(255,135,100,${0.62 * b.glow})`);
      sg.addColorStop(1, 'rgba(255,60,40,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(-190, -190, 380, 380);
      ctx.restore();
    }

    for (const imp of st.impacts) {
      const k = imp.t, fl = Math.max(0, 1 - k * 2.4) * imp.scale;
      if (fl > 0) {
        const R0 = 400 * imp.scale;
        const fg = ctx.createRadialGradient(imp.x, imp.y, 0, imp.x, imp.y, R0);
        fg.addColorStop(0, `rgba(255,245,210,${fl})`);
        fg.addColorStop(0.25, `rgba(255,155,65,${0.55 * fl})`);
        fg.addColorStop(1, 'rgba(255,75,25,0)');
        ctx.fillStyle = fg;
        ctx.fillRect(imp.x - R0, imp.y - R0, R0 * 2, R0 * 2);
      }
      const rr = (32 + k * 440) * imp.scale;
      const ra = Math.max(0, 0.55 - k * 0.45) * imp.scale;
      ctx.strokeStyle = `rgba(255,180,115,${ra})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(imp.x, imp.y, rr, rr * 0.18, 0, 0, TAU); ctx.stroke();
    }

    for (const d of st.dust) {
      const a = 1 - d.age / d.life;
      ctx.fillStyle = d.hot ? `rgba(255,180,85,${a})` : `rgba(180,115,95,${a * 0.6})`;
      ctx.fillRect(d.x, d.y, d.r, d.r);
    }
    for (const e of st.embers) {
      const a = Math.sin(Math.PI * e.age / e.life);
      ctx.fillStyle = `rgba(255,150,75,${a * 0.9})`;
      ctx.fillRect(e.x, e.y, 2.2, 2.2);
    }

    // Main Super Destroyer (drawn over beam origin)
    ctx.globalCompositeOperation = 'source-over';
    const [sx, sy] = shipPt(L.x, L.y, bob);
    ctx.drawImage(L.canvas, sx, sy, L.w * SHIP.k, L.h * SHIP.k);

    // Red underlight reflection on hull
    ctx.globalCompositeOperation = 'lighter';
    const ul = clamp(b.I * (b.len > 0 ? 1 : 0), 0, 1) * 0.58 +
      (st.impacts.length ? Math.max(0, 0.42 - st.impacts[0].t * 0.4) : 0);
    if (ul > 0.01) {
      ctx.globalAlpha = ul;
      ctx.drawImage(layers.under, sx, sy, L.w * SHIP.k, L.h * SHIP.k);
      ctx.globalAlpha = 1;
    }

    // Ion engine plumes at the stern
    for (const [i, e] of ENGINES.entries()) {
      const [x, y] = shipPt(e[0], e[1], bob);
      const f = (0.78 + 0.22 * Math.sin(t * 24 + i * 1.9) * Math.sin(t * 7.5 + i)) * e[2];
      const len = 92 * f;
      const g = ctx.createLinearGradient(x, y, x + len, y);
      g.addColorStop(0, `rgba(220,245,255,${0.95 * f})`);
      g.addColorStop(0.28, `rgba(120,195,255,${0.7 * f})`);
      g.addColorStop(1, 'rgba(50,130,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x, y - 3.2 * e[2]);
      ctx.lineTo(x + len, y);
      ctx.lineTo(x, y + 3.2 * e[2]);
      ctx.closePath();
      ctx.fill();

      const r = ctx.createRadialGradient(x, y, 0, x, y, 24 * e[2]);
      r.addColorStop(0, `rgba(165,220,255,${0.75 * f})`);
      r.addColorStop(1, 'rgba(60,140,255,0)');
      ctx.fillStyle = r;
      ctx.fillRect(x - 24, y - 24, 48, 48);
    }

    // Glowing blue circular RCS thruster ports on bow & mid-hull
    for (const p of PORTS) {
      const [x, y] = shipPt(p[0], p[1], bob);
      const r = ctx.createRadialGradient(x, y, 0, x, y, 11);
      r.addColorStop(0, 'rgba(210,245,255,0.95)');
      r.addColorStop(0.35, 'rgba(100,195,255,0.65)');
      r.addColorStop(1, 'rgba(50,130,255,0)');
      ctx.fillStyle = r;
      ctx.fillRect(x - 11, y - 11, 22, 22);
    }

    // Blinking navigation & mast strobes
    for (const l of LIGHTS) {
      const on = (t * l.rate + l.ph) % 1 < 0.22;
      if (!on) continue;
      const [x, y] = shipPt(l.p[0], l.p[1], bob);
      const r = ctx.createRadialGradient(x, y, 0, x, y, 13);
      r.addColorStop(0, `rgba(${l.c},1)`);
      r.addColorStop(1, `rgba(${l.c},0)`);
      ctx.fillStyle = r;
      ctx.fillRect(x - 13, y - 13, 26, 26);
    }
    ctx.globalCompositeOperation = 'source-over';
  },
});
</script>
</body>
